        physMoveSlow(level, this, dt);
        this.hitDown = this.onGround;
        this.crushedIn(level);
    }
    draw(ctx, alpha) {
        if (typeof drawBatHp === 'function') { if (this.blinkT > 0 && Math.floor(this.blinkT * 20) % 2) return; drawBatHp(this, ctx, alpha); return; }
        const x = Math.round(this.drawX(alpha)), y = Math.round(this.drawY(alpha));
        const B = '#7a4ab0', D = '#4a2a70';
        if (this.st === 'hang') {
            ctx.fillStyle = D; ctx.fillRect(x + 3, y, 6, 2); ctx.fillStyle = B; ctx.fillRect(x + 4, y + 2, 4, 6); ctx.fillStyle = D; ctx.fillRect(x + 2, y + 1, 2, 6); ctx.fillRect(x + 8, y + 1, 2, 6);
            ctx.fillStyle = '#ffd24a'; ctx.fillRect(x + 4, y + 6, 1, 1); ctx.fillRect(x + 7, y + 6, 1, 1);
            return;
        }
        const k = Math.floor(game.time * 12) % 2;
        ctx.fillStyle = B; ctx.fillRect(x + 4, y + 3, 4, 5);
        ctx.fillStyle = D; if (k) { ctx.fillRect(x, y + 1, 4, 3); ctx.fillRect(x + 8, y + 1, 4, 3); } else { ctx.fillRect(x, y + 5, 4, 3); ctx.fillRect(x + 8, y + 5, 4, 3); }
        ctx.fillStyle = '#ffd24a'; ctx.fillRect(x + 4, y + 4, 1, 1); ctx.fillRect(x + 7, y + 4, 1, 1);
    }
}

// Tạo MỘT quái thường (rắn / dơi / FOES) đặt ở ô (c, r): quái mặt đất đứng trên đáy ô, quái treo / bay bám đỉnh ô. Dùng chung cho spawnObjects và carryoverPlace.
function foeMake(kind, c, r) {
    const x = c * TILE, y = r * TILE;
    if (kind === 'snake') return new Snake(x + 2, y + TILE - ENEMY_DEFS.snake.h);
    if (kind === 'bat') return new Bat(x + 2, y);
    if (FOES[kind]) { const d = ENEMY_DEFS[kind]; return new FOES[kind](x + (TILE - d.w) / 2, (FOE_AIR[kind] || d.hang) ? y + 2 : y + TILE - d.h); }
    return null;
}

// ---- QUÁI SÓT MANG SANG LEVEL KẾ (số ở CARRYOVER, 01_config) ----
//   nextLevel (16_gameloop): carryoverCollect(level cũ) → carryoverPick → game.carryIn. loadLevel: carryoverPlace(level mới) rải quái ra, trả về số con đã đặt.
// Loại quái còn sống đáng mang sang (null nếu không phải): Enemy thường, không boss / chủ cửa hàng / quái vô hại
function carryoverCan(kind) { return !!ENEMY_DEFS[kind] && (kind === 'snake' || kind === 'bat' || !!FOES[kind]); }
function carryoverKind(e) {
    if (!e.alive || !(e instanceof Enemy) || e.isBoss || e.boss || e.harmless || e.kind === 'shopkeeper') return null;
    return carryoverCan(e.kind) ? e.kind : null;
}
function carryoverCollect(level) {
    const out = []; if (!level || level.id === 'test') return out;
    for (const e of game.entities) { const k = carryoverKind(e); if (k) out.push(k); }
    return out;
}
// Chọn ceil(frac × còn sót) con NGẪU NHIÊN (xáo trộn bằng rngPlay có seed)
function carryoverPick(list) {
    if (!list.length || list.length < CARRYOVER.minLeft) return [];
    const n = Math.min(CARRYOVER.max, Math.ceil(list.length * ddaCarryFrac(game.player ? game.player.hp : ITEM.startHp))), R = game.rngPlay, a = list.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = R.int(0, i), t = a[i]; a[i] = a[j]; a[j] = t; }
    return a.slice(0, n);
}
// Ô hợp lệ để đặt quái: floor = ô trống trên nền đặc an toàn (quái mặt đất), ceil = ô trống ngay dưới trần (dơi / quái treo / bay). Loại ô gần điểm vào (minD) và gần cửa hàng, bàn thờ, rương, công chúa, ghế nghỉ.
function carryoverCells(L, minD) {
    const sc = Math.floor(L.spawn.x / TILE), sr = Math.floor((L.spawn.y - 1) / TILE), av = [], out = { floor: [], ceil: [] };
    for (const e of game.entities) if (e.alive && CARRYOVER.avoid.indexOf(e.kind) >= 0) av.push({ c: Math.floor(e.cx / TILE), r: Math.floor(e.cy / TILE) });
    for (let r = 2; r < L.h - 2; r++) for (let c = 2; c < L.w - 2; c++) {
        if (L.tile(c, r) !== T_EMPTY || L.hasRope(c, r)) continue;
        if (Math.abs(c - sc) + Math.abs(r - sr) < minD) continue;
        let near = false; for (const a of av) if (Math.abs(c - a.c) + Math.abs(r - a.r) < CARRYOVER.avoidR) { near = true; break; }
        if (near) continue;
        const up = L.isSolid(c, r - 1), dn = L.isSolid(c, r + 1);
        if (!up && dn) { const f = L.tile(c, r + 1); if (f === T_SOLID || f === T_HARD || f === T_STONE || f === T_GOLD || f === T_GOLDBIG) out.floor.push({ c, r }); }
        else if (up && !dn && L.tile(c, r + 1) === T_EMPTY) out.ceil.push({ c, r });
    }
    return out;
}
// Rải game.carryIn vào level vừa nạp (gọi trong loadLevel, sau spawnObjects). Mỗi con: thử CARRYOVER.pick ô ngẫu nhiên, lấy ô XA các quái đã có nhất (rải đều). Hết chỗ thì bỏ con đó. Trả về số con đã đặt.
function carryoverPlace(L) {
    const list = game.carryIn;
    if (!list || !list.length || L.id === 'test' || L.def.boss) return 0;
    let cells = carryoverCells(L, CARRYOVER.minDist);
    if (!cells.floor.length && !cells.ceil.length) cells = carryoverCells(L, CARRYOVER.minDist / 2);
    const R = game.rngPlay, sc = Math.floor(L.spawn.x / TILE), sr = Math.floor((L.spawn.y - 1) / TILE), refs = [];
    for (const e of game.entities) if (e.alive && e instanceof Enemy) refs.push({ c: Math.floor(e.cx / TILE), r: Math.floor(e.cy / TILE) });
    let placed = 0;
    for (const kind of list) {
        if (!carryoverCan(kind)) continue;
        const pool = (kind === 'bat' || FOE_AIR[kind] || ENEMY_DEFS[kind].hang) ? cells.ceil : cells.floor;
        if (!pool.length) continue;
        let best = -1, bi = 0;
        for (let k = 0; k < CARRYOVER.pick; k++) {
            const i = R.int(0, pool.length - 1), q = pool[i];
            let s = 1e9;
            for (const f of refs) { const d = (q.c - f.c) * (q.c - f.c) + (q.r - f.r) * (q.r - f.r); if (d < s) s = d; }
            if (!refs.length) s = (q.c - sc) * (q.c - sc) + (q.r - sr) * (q.r - sr);
            if (s > best) { best = s; bi = i; }
        }
        const q = pool.splice(bi, 1)[0], e = foeMake(kind, q.c, q.r);
        if (e) { entAdd(e); refs.push(q); placed++; }
    }
    return placed;
}

// Tạo vật / quái theo danh sách đặt sẵn của level (ký tự LVL_CHARS)
function spawnObjects(level) {
    for (const o of level.objs) {
        const x = o.c * TILE, y = o.r * TILE;
        let e = null;
        if (o.kind === 'snake' || o.kind === 'bat' || FOES[o.kind]) e = foeMake(o.kind, o.c, o.r);
        else if (o.kind === 'stalactite') e = new Stalactite(o.c, o.r);
        else if (o.kind === 'bigchest') e = new BigChest(x, y + TILE - 12);
        else if (o.kind === 'key') e = new Key(x + 4, y + TILE - 8);
        else if (o.kind === 'altar') e = new Altar(x + 1, y + TILE - 12);
        else if (o.kind === 'boss_warden') e = bossTierApply(new Warden(x + TILE / 2, y + TILE), game.levelIdx);
        else if (o.kind === 'boss_hunter') e = bossTierApply(new Hunter(x + TILE / 2, y + TILE), game.levelIdx);
        else if (o.kind === 'boss_mage') e = bossTierApply(new Mage(x + TILE / 2, y + TILE), game.levelIdx);
        else if (o.kind === 'boss_titan') e = new Titan(x + TILE / 2, y + TILE, level.def.finale);
        else if (o.kind === 'boss_queen') e = bossTierApply(new Queen(x + TILE / 2, y + TILE), game.levelIdx);
        else if (o.kind === 'barrel') e = new Barrel(x + 2, y + TILE - 14);
        else if (o.kind === 'waterbarrel') e = new WaterBarrel(x + 2, y + TILE - 14);
        else if (o.kind === 'rock') e = new Rock(x + 4, y + TILE - 8);
        else if (o.kind === 'pot') e = new Pot(x + 3, y + TILE - 11);
        else if (o.kind === 'shockflask') e = new ShockFlask(x + 3, y + TILE - 11);
        else if (o.kind === 'frostflask') e = new FrostFlask(x + 3, y + TILE - 11);
        else if (o.kind === 'poisonflask') e = new PoisonFlask(x + 3, y + TILE - 11);
        else if (o.kind === 'crate') e = new Crate(x + 2, y + TILE - 12);
        else if (o.kind === 'princess') e = new Princess(x + 3, y + TILE - PRINCESS.h);
        else if (o.kind === 'shopkeeper') e = new Shopkeeper(x + 2, y + TILE - ENEMY_DEFS.shopkeeper.h);
        else if (o.kind.indexOf('goods') === 0) e = new ShopGoods(x + 2, y + TILE - 12, o.kind.slice(5).toLowerCase());
        else if (o.kind === 'relic_shard') e = new Relic(x + 2, y + TILE - 14, 'shard');
        else if (o.kind === 'relic_item') e = new Relic(x + 2, y + TILE - 14, 'item');
        else if (o.kind === 'goldsmall') e = new Gold(x + 5, y + TILE - 4, 50);
        else if (o.kind === 'goldbig') e = new Gold(x + 4, y + TILE - 6, 150);
        if (e) { if (FOES[o.kind]) affixRoll(e); entAdd(e); }
    }
    arrowBoxesSpawn(level);          // v0.18: bẫy mũi tên trong tường → hộp bắn tên nhặt được (13b_traps)
    if (level.def.boss && level.exit) entAdd(new ExitSeal(level.exit.c, level.exit.r));
}

// 11b_foes — QUÁI CÁC VÙNG SAU (GĐ6b; chuyển từ Metroidvania reserve/mv_stash.js khối 1+4, viết lại theo Thing/Enemy của dự án này).
//   Luật chung (D3 + bảng 3.3): chết bằng roi / đạp đầu / vật ném / bom như quái thường; máu 1–3; chạm người chơi gây 1 (dmgContacts); MỌI đòn đặc biệt có điềm báo `windup` (dấu ! + đổi màu).
//   walker bọ đá (đi tuần) · chaser (thấy → báo → đuổi) · rusher (thấy → báo → húc) · hopper (thấy → ngồi → nhảy cung) · guard (khiên chặn roi/tên phía trước, trừ lúc nghỉ; đạp đầu vẫn được)
//   shooter (đứng yên, báo, bắn đạn thẳng) · mortar (vòng đỏ báo điểm rơi, ném đạn pháo cung, nổ nhỏ) · flyer (lượn, nhích về phía người chơi) · diver (thấy → báo → lao thẳng một đường, nghỉ, về chỗ).
const FOES = {}, FOE_AIR = { flyer: true, diver: true, wisp: true, eel: true, spark: true, icebat: true, gnat: true };

class Foe extends Enemy {
    constructor(type, x, y) { super(type, x, y); this.st = 'walk'; this.t = 0; this.air = !!FOE_AIR[type]; if (this.air) { this.gravity = 0; this.home = { x, y }; } this.tx = 0; this.ty = 0; }
    onHurt(src) { this.invulnT = 0.35; if (!this.air) this.stunT = 0.18; if (src && src.x !== undefined) this.vx = (this.cx < src.x ? -1 : 1) * 60; }
    // thấy người chơi? (tầm ngang sight, lệch dọc sightY, không tường chắn; front = chỉ nhìn phía trước)
    sees(level, front) {
        const p = game.player, d = this.def; if (!p || p.dead) return false;
        const dx = p.cx - this.cx, dy = p.cy - this.cy;
        if (this.noiseT > 0 && Math.abs(dx) <= d.sight * (this.noiseMul || 1.5) && Math.abs(dy) <= (d.sightY || 40) * 2) return true;      // nghe tiếng súng
        const sm = level.inWater(p) ? 0.4 : 1;           // lặn dưới nước: quái khó thấy (lần 27)
        if (Math.abs(dx) > d.sight * sm || Math.abs(dy) > (d.sightY || 40) * sm) return false;
        if (front && Math.sign(dx) !== this.facing) return false;
        const n = Math.ceil(Math.hypot(dx, dy) / 6);
        for (let i = 1; i < n; i++) if (level.solidAt(this.cx + dx * i / n, this.cy + dy * i / n)) return false;
        return true;
    }
    face() { const p = game.player; if (p) this.facing = p.cx < this.cx ? -1 : 1; }
    // đi tuần mặt đất như rắn (quay ở tường / mép vực)
    patrol(level, speed) {
        const f = this.facing, aheadX = f > 0 ? this.x + this.w + 1 : this.x - 1, feet = this.y + this.h + 1;
        if (level.solidAt(aheadX, this.y + this.h - 2) || !level.solidAt(aheadX, feet) && !platAt(level, Math.floor(aheadX / TILE), Math.floor(feet / TILE))) this.facing = -f;
        this.vx = this.facing * speed;
    }
    edgeAhead(level) { const f = this.facing, aheadX = f > 0 ? this.x + this.w + 2 : this.x - 2; return level.solidAt(aheadX, this.y + this.h - 2) || !level.solidAt(aheadX, this.y + this.h + 1); }
    warnOn(wind) { this.warnT = 0.001; if (wind) sndPlay(wind, { x: this.cx }); else sndPlay('alert', { x: this.cx, vol: 0.5, p: 1.2 }); }          // bước 8: wind = tiếng điềm báo riêng của loại quái (thay 'alert')
    update(level, dt) {
        this.timers(dt);
        if (this.holder) { this.followHolder(); return; }
        if (this.stunT > 0) { this.stunT -= dt; if (!(this.thrownT > 0)) this.vx *= scFric(0.3, dt); this.vy = Math.min(this.vy + (this.air ? 300 : this.gravity) * dt, this.fallMax); physMove(level, this, dt); return; }
        this.think(level, dt);
        if (!this.air) { this.vy = Math.min(this.vy + this.gravity * dt, this.fallMax); if (this.vy > 0 && !this.onGround) this.fallT += dt; else this.fallT = 0; }
        else this.ignorePlat = true;
        physMoveSlow(level, this, dt);
        this.crushedIn(level);
        if (this.y > level.ph + 32) this.alive = false;
    }
    // --- vẽ chung: thân màu quái, mắt, chân/cánh nhấp nhô; điềm báo = chớp trắng + dấu ! ---
    body(ctx, x, y) { }
    draw(ctx, alpha) {
        const x = Math.round(this.drawX(alpha)), y = Math.round(this.drawY(alpha)), d = this.def, k = Math.floor(game.time * 7 + this.x * 0.1) % 2, warn = this.st === 'warn';
        const col = warn && Math.floor(game.time * 20) % 2 ? '#ffffff' : d.col;
        if (this.blinkT > 0 && Math.floor(this.blinkT * 20) % 2) return;
        if (typeof drawFoeHp === 'function') { drawFoeHp(this, ctx, x, y); if (ITEM_HP) { foeDecoHp(this, ctx, x, y); if (warn) foeWarnHp(this, ctx, x, y); return; } this.deco(ctx, x, y); if (warn) { ctx.fillStyle = '#ffe14a'; ctx.fillRect(x + this.w / 2 - 1, y - 9, 2, 5); ctx.fillRect(x + this.w / 2 - 1, y - 3, 2, 2); } return; }
        ctx.fillStyle = '#1c1420'; ctx.fillRect(x, y + 1, this.w, this.h - 1);
        ctx.fillStyle = col; ctx.fillRect(x + 1, y + 2, this.w - 2, this.h - 4);
        ctx.fillStyle = 'rgba(255,255,255,0.28)'; ctx.fillRect(x + 1, y + 2, this.w - 2, 2);
        const ex = this.facing > 0 ? x + this.w - 5 : x + 2;
        ctx.fillStyle = '#fff'; ctx.fillRect(ex, y + 4, 3, 3); ctx.fillStyle = '#1a1a1a'; ctx.fillRect(ex + (this.facing > 0 ? 1 : 0), y + 5, 2, 2);
        if (!this.air) { ctx.fillStyle = '#1c1420'; ctx.fillRect(x + 1 + k, y + this.h - 2, 3, 2); ctx.fillRect(x + this.w - 4 - k, y + this.h - 2, 3, 2); }
        else { ctx.fillStyle = col; const w = k ? 3 : 0; ctx.fillRect(x - 3, y + 1 + w, 4, 2); ctx.fillRect(x + this.w - 1, y + 1 + w, 4, 2); }
        this.deco(ctx, x, y);
        if (warn) { ctx.fillStyle = '#ffe14a'; ctx.fillRect(x + this.w / 2 - 1, y - 9, 2, 5); ctx.fillRect(x + this.w / 2 - 1, y - 3, 2, 2); }
    }
    deco(ctx, x, y) { }
}

class Walker extends Foe {
    constructor(x, y, type) { super(type || 'walker', x, y); }
    think(level, dt) { if (this.onGround) this.patrol(level, this.def.speed); }
    deco(ctx, x, y) { ctx.fillStyle = '#7a2e22'; ctx.fillRect(x + 2, y, 8, 2); ctx.fillRect(x + 4, y - 1, 4, 1); }
}
class Chaser extends Foe {
    constructor(x, y) { super('chaser', x, y); }
    think(level, dt) {
        const d = this.def;
        if (this.st === 'walk') {
            if (this.onGround) this.patrol(level, d.speed);
            if (this.onGround && this.sees(level, false)) { this.st = 'warn'; this.t = d.windup; this.vx = 0; this.face(); this.warnOn(); }
        } else if (this.st === 'warn') { this.vx = 0; if ((this.t -= dt) <= 0) { this.st = 'chase'; this.t = d.giveUp; } }
        else if (this.st === 'chase') {
            this.face(); if (this.onGround) { if (this.edgeAhead(level)) this.vx = 0; else this.vx = this.facing * d.chaseSpeed; }
            if (this.sees(level, false)) this.t = d.giveUp; else if ((this.t -= dt) <= 0) this.st = 'walk';
        }
    }
    deco(ctx, x, y) { ctx.fillStyle = '#6a4210'; ctx.fillRect(x + 3, y + 8, 6, 2); ctx.fillStyle = '#fff'; ctx.fillRect(x + 4, y + 9, 1, 1); ctx.fillRect(x + 7, y + 9, 1, 1); }
}
class Rusher extends Foe {
    constructor(x, y) { super('rusher', x, y); }
    think(level, dt) {
        const d = this.def;
        if (this.st === 'walk') { if (this.onGround) this.patrol(level, d.speed); if (this.onGround && this.sees(level, true)) { this.st = 'warn'; this.t = d.windup; this.vx = 0; this.warnOn('rushWind'); } }
        else if (this.st === 'warn') { this.vx = 0; if ((this.t -= dt) <= 0) { this.st = 'lunge'; this.t = d.lungeT; sndPlay('rushGo', { x: this.cx }); } }
        else if (this.st === 'lunge') { this.vx = this.facing * d.lungeSpeed; if ((this.t -= dt) <= 0 || (this.onGround && this.edgeAhead(level))) { this.st = 'rest'; this.t = d.rest; this.vx = 0; } }
        else { this.vx = 0; if ((this.t -= dt) <= 0) this.st = 'walk'; }
    }
    deco(ctx, x, y) { ctx.fillStyle = '#3a5a26'; const f = this.facing > 0 ? x + this.w - 3 : x - 1; ctx.fillRect(f, y + 5, 4, 3); ctx.fillStyle = '#fff'; ctx.fillRect(f + 1, y + 6, 2, 1); }
}
class Hopper extends Foe {
    constructor(x, y) { super('hopper', x, y); }
    think(level, dt) {
        const d = this.def;
        if (this.st === 'walk') { if (this.onGround) this.patrol(level, d.speed); if (this.onGround && this.sees(level, false)) { this.st = 'warn'; this.t = d.windup; this.vx = 0; this.face(); this.warnOn('hopWind'); } }
        else if (this.st === 'warn') { this.vx = 0; if ((this.t -= dt) <= 0) { this.st = 'leap'; this.t = 0.12; this.vx = this.facing * d.leapVx; this.vy = d.leapVy; this.onGround = false; sndPlay('hopGo', { x: this.cx }); } }
        else if (this.st === 'leap') { if ((this.t -= dt) <= 0 && this.onGround) { this.st = 'rest'; this.t = d.rest; this.vx = 0; sndPlay('hopLand', { x: this.cx }); } }
        else { this.vx = 0; if ((this.t -= dt) <= 0) this.st = 'walk'; }
    }
    deco(ctx, x, y) { ctx.fillStyle = '#2a8a7a'; ctx.fillRect(x + 1, y + this.h - 4, 3, 2); ctx.fillRect(x + this.w - 4, y + this.h - 4, 3, 2); }
}
class Guard extends Foe {
    constructor(x, y) { super('guard', x, y); }

class Boss extends Enemy {

    hurt(src) {

        if (k !== DMG.WHIP && k !== DMG.STOMP && k !== DMG.EXPLOSION && k !== DMG.IMPACT && k !== DMG.ARROW) return false;

// Boss ngã: mở cửa, xoá hazard, thưởng vàng + hồi máu +1
function bossDefeated(level, boss) {
    game.bossDone = true; game.boss = null;
    for (const e of game.entities) if (e !== boss && e.alive && (e instanceof BossHazard || (e instanceof Enemy && !(e instanceof Boss)))) { e.alive = false; level.spawnBurst(e.cx, e.cy, 10, e.col, 120); }
    const R = game.rngFx;
    for (let i = 0; i < 8; i++) { const g = new Gold(boss.cx - 3, boss.cy - 6, i < 2 ? 150 : 50); g.vx = (R.next() - 0.5) * 140; g.vy = -120 - R.next() * 80; entAdd(g); }
    const p = game.player; if (p && !p.dead) p.hp = Math.max(p.hp, ITEM.startHp) + HP_UNIT;
    fxScreenFlash('#ffffff', 0.35, 0.8); sndPlay('victory'); fxShake(2, 0.5);
    level.spawnBurst(boss.cx, boss.cy, 30, '#ffe9a8', 160);
    game.banner = { text: 'ĐÃ HẠ ' + boss.def.name, t: 0 };
    if (game.stats) game.stats.kills++;
    abilityReward(game.levelIdx);                      // 09a_abilities: boss vùng 2 / 6 tặng nhảy đôi / lướt
}

        for (let j = -R; j <= R; j++) { const wd = Math.round((R - Math.abs(j)) * 0.72); ctx.fillStyle = dark; ctx.fillRect(cx - wd - 1, cy + j, wd * 2 + 3, 1); }
        for (let j = -R + 1; j < R; j++) { const wd = Math.round((R - Math.abs(j)) * 0.72) - 1; if (wd < 0) continue; ctx.fillStyle = j < -4 ? hi : j < 4 ? body : mid; ctx.fillRect(cx - wd, cy + j, wd * 2 + 1, 1); }
        const eye = flash ? '#fff' : sleep ? '#1a3248' : (wind || st === 'dive') ? '#ff3b3b' : '#10304a';
        ctx.fillStyle = eye; ctx.fillRect(cx - 5, cy - 3, 3, 3); ctx.fillRect(cx + 3, cy - 3, 3, 3);
        ctx.fillStyle = hi; for (const dx of [-6, -2, 2, 6]) ctx.fillRect(cx + dx - 1, cy - R - 4 - (Math.abs(dx) === 2 ? 3 : 0), 2, 5);       // vương miện
        if (wind) for (let i = 0; i < 5; i++) { const a = t * 5 + i * TAU / 5, r = 20 + 6 * k; ctx.fillStyle = st === 'summon_wind' ? '#d98cff' : '#7fe0ff'; ctx.fillRect(Math.round(cx + Math.cos(a) * r) - 1, Math.round(cy + Math.sin(a) * r) - 1, 3, 3); }
        if (st === 'stuck') for (let i = 0; i < 3; i++) { const a = t * 6 + i * 2.1; ctx.fillStyle = '#ffe9a8'; ctx.fillRect(Math.round(cx + Math.cos(a) * 12) - 1, Math.round(y - 6 + Math.sin(a) * 3) - 1, 3, 3); }
    }
}

// ---------- Phòng đấu ----------
// 26 × 16 ô: trần; bên trái 1 khối đá bậc + 1 bục thấp (không thang), bên phải 1 bục cao có thang (né sóng đất / xuống đạp đầu boss); sàn phẳng. P = cửa vào (trái), E = cửa ra (phải, bị phong ấn), 1 = Vệ binh, 2 = Bà chúa.
const BOSS_LEVELS = { 11: 'warden', 23: 'queen', 35: 'hunter', 47: 'mage', 54: 'titan' };   // E1 (v0.25): boss về đúng vùng cùng hệ · cuối vùng 2 Rừng sâu = Vệ binh đá (Vật lý) · vùng 4 Hang pha lê = Bà chúa (Sét) · vùng 6 Núi tuyết = Thợ săn (Băng) · vùng 8 Vực sâu = Kẻ dẫn hồn (Độc, 12a_boss2) · màn cuối = Titan (Lửa)
const BOSS_TIER = { 11: 1, 23: 1, 35: 1, 47: 1 }, BOSS_HP_MUL = [1, 1, 1.3, 1.6];       // móc chỉnh máu theo bậc (hiện mọi boss bậc 1; muốn Vệ binh bậc cao thì đặt BOSS_TIER[idx] = 2/3 → thêm II/III)
function bossTierApply(b, levelIdx) {
    const t = BOSS_TIER[levelIdx] || 1; b.tier = t; b.maxHp = b.hp = Math.round(b.def.hp * BOSS_HP_MUL[t] * (ddaOn() ? ddaS().boss : 1));
    b.bossName = t > 1 ? b.def.name + ' ' + 'I'.repeat(t) : b.def.name; return b;
}
function genBossArena(levelIdx) {
    if (BOSS_LEVELS[levelIdx] === 'titan') return genFinaleArena(levelIdx);
    const kind = BOSS_LEVELS[levelIdx], zone = zoneOf(levelIdx), W = 26, H = 16;
    const g = []; for (let r = 0; r < H; r++) g.push(new Array(W).fill('.'));
    for (let c = 0; c < W; c++) { g[0][c] = '#'; g[H - 1][c] = '#'; }
    for (let r = 0; r < H; r++) { g[r][0] = '#'; g[r][W - 1] = '#'; }
    g[14][3] = '#'; for (let c = 5; c <= 7; c++) g[13][c] = '=';       // bên trái (Dan, lần 35, mọi phòng boss): bậc 1 = khối đá cao 1 ô SÁT cửa vào (cột 3), bục 2 = bục một chiều cao 2 ô, dài 3 ô, cách bậc 1 một ô (cột 5–7); KHÔNG thang. Nhảy tối đa ~22 px
    for (let c = 18; c <= 22; c++) g[10][c] = '='; for (let r = 10; r <= 14; r++) g[r][17] = 'L';       // bên phải: bục cao + thang như cũ
    g[14][2] = 'P'; g[14][W - 3] = 'E'; g[14][kind === 'warden' ? 14 : kind === 'queen' ? 13 : 14] = { warden: '1', queen: '2', hunter: '3', mage: '4' }[kind];
    return {
        def: { id: 'L' + (levelIdx + 1), name: { warden: 'Phòng Vệ binh đá', hunter: 'Sân tuyết của Thợ săn', mage: 'Điện hồn của Kẻ dẫn hồn', queen: 'Ngai Bà chúa pha lê' }[kind], theme: zone.theme, dark: 0, boss: kind, map: g.map(r => r.join('')) },
        meta: { boss: kind, start: { c: 3, r: 15 }, exit: { c: W - 2, r: 15 }, counts: { snake: 0, bat: 0, foe: 0, rock: 0, pot: 0, crate: 0, gold: 0, trap: 0, princess: 0, shop: 0 }, shop: null, rooms: null, path: null }
    };
}

// 12a_boss2 — BOSS 3 & 4 (lần 33; Dan: "thiết kế thêm boss, học của Hollow Knight"). Nhân vật + số liệu + hình vẽ đều TỰ THIẾT KẾ, chỉ học NHỊP ĐÁNH của lối boss Hollow Knight:
//   · mỗi đòn có điềm báo rõ (tư thế + ánh sáng + vạch báo), sau đòn là khoảng hở để đánh trả;
//   · mẫu đòn xoay vòng, không lặp một đòn hai lần liền (Boss.pick);
//   · pha 2 (máu ≤ 50%) đòn nhanh hơn / nhiều hơn / có đòn nối.
// Boss 3 = THỢ SĂN TUYẾT (vùng 4, level 24): đấu tay đôi nhanh trên mặt đất — LAO CHÉM (có đòn nối quay lại ở pha 2), NÉM GIÁO BĂNG (giáo bay đi rồi QUAY VỀ như boomerang), NHẢY BỔ (đáp xuống sinh sóng băng hai phía).
// Boss 4 = KẺ DẪN HỒN (vùng 6, level 36): bay lơ lửng, luôn DỊCH CHUYỂN trước khi ra đòn — CẦU HỒN đuổi theo, CỘT GAI trồi từ sàn (vòng báo trên sàn), pha 2: ĐẬP TỪ TRÊN XUỐNG (cột sáng báo, đáp xuống nằm sơ hở).
// Phòng đấu dùng chung genBossArena (12_boss): ký tự '3' = Thợ săn, '4' = Kẻ dẫn hồn. Số liệu là ước lượng — chỉnh sau khi chơi thử (BOSS_HUNTER / BOSS_MAGE).

// ---------- Hazard mới ----------
// Giáo băng: bay ngang tới tầm `range` (hoặc chạm tường) rồi QUAY VỀ chủ, mất khi về tới chủ. Gây hại cả lúc đi lẫn lúc về.
class IceSpear extends BossHazard {
    constructor(cx, cy, dir, speed, range, owner) { super(cx - 8, cy - 2, 16, 5, 'spear', owner); this.dir = dir; this.spd = speed; this.range = range; this.x0 = cx; this.back = false; this.life = 4; }
    light() { return { r: 16, col: '#bfe9ff', a: 0.5 }; }
    step(level, dt) {
        const o = this.owner;
        if ((this.life -= dt) <= 0 || !o || !o.alive || o.st === 'dying') { this.alive = false; level.spawnBurst(this.cx, this.cy, 5, '#bfe9ff', 70); return; }
        if (!this.back) {
            this.x += this.dir * this.spd * dt;
            if (Math.abs(this.cx - this.x0) >= this.range || level.solidAt(this.cx + this.dir * 8, this.cy)) { this.back = true; sndPlay('shardBreak', { x: this.cx, vol: 0.6, p: 0.8 }); level.spawnBurst(this.cx, this.cy, 4, '#ffffff', 60); }
        } else {
            const dx = o.cx - this.cx, sp = this.spd * 1.2 * dt; this.dir = dx >= 0 ? 1 : -1;
            this.x += Math.sign(dx) * Math.min(Math.abs(dx), sp); this.y += (o.cy - this.cy) * Math.min(1, 7 * dt);
            if (Math.abs(dx) < 8) { this.alive = false; level.spawnBurst(this.cx, this.cy, 4, '#bfe9ff', 60); }
        }
        if (Math.floor(this.t * 24) !== Math.floor((this.t - dt) * 24)) level.fx.push({ x: this.cx - this.dir * 6, y: this.cy, vx: -this.dir * 10, vy: 0, life: 0.25, max: 0.3, size: 2, col: '#e8f6ff' });
    }
    draw(ctx, alpha) {
        if (ITEM_HP) return drawIceSpearHp(this, ctx, alpha);
        const x = Math.round(this.drawX(alpha)), y = Math.round(this.drawY(alpha)), f = this.dir;
        ctx.fillStyle = '#1c3048'; ctx.fillRect(x - 1, y - 1, 18, 7);
        ctx.fillStyle = '#9ad8ff'; ctx.fillRect(x, y, 16, 5); ctx.fillStyle = '#ffffff'; ctx.fillRect(x + 1, y + 1, 14, 2);
        ctx.fillStyle = '#e8f6ff'; ctx.fillRect(f > 0 ? x + 15 : x - 2, y + 1, 3, 3);                        // mũi giáo
        ctx.fillStyle = '#6a9cc8'; ctx.fillRect(f > 0 ? x : x + 12, y, 4, 5);
    }
}

// Cầu hồn: bay chậm, ĐUỔI theo người chơi (quay chậm nên né được), mất khi đụng tường hoặc hết life.
class SoulOrb extends BossHazard {
    constructor(cx, cy, ang, speed, turn, owner) { super(cx - 5, cy - 5, 10, 10, 'orb', owner); this.a = ang; this.sp = speed; this.turn = turn; this.life = 4.6; this.homeT = 2.4; }
    light() { return { r: 18, col: '#7fe05a', a: 0.55 }; }
    step(level, dt) {
        const p = game.player;
        if (this.t < this.homeT && p && !p.dead) {
            let d = Math.atan2(p.cy - this.cy, p.cx - this.cx) - this.a; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU;
            this.a += clamp(d, -this.turn * dt, this.turn * dt);
        }
        this.x += Math.cos(this.a) * this.sp * dt; this.y += Math.sin(this.a) * this.sp * dt;
        if ((this.life -= dt) <= 0 || level.solidAt(this.cx, this.cy)) { this.alive = false; level.spawnBurst(this.cx, this.cy, 7, '#7fe05a', 80); sndPlay('shardBreak', { x: this.cx, p: 0.7, vol: 0.7 }); }
        if (Math.floor(this.t * 20) !== Math.floor((this.t - dt) * 20)) level.fx.push({ x: this.cx, y: this.cy, vx: -Math.cos(this.a) * 14, vy: -Math.sin(this.a) * 14, life: 0.3, max: 0.35, size: 3, col: '#4fb83a' });
    }
    draw(ctx, alpha) {
        if (ITEM_HP) return drawSoulOrbHp(this, ctx, alpha);
        const x = Math.round(this.drawX(alpha) + 5), y = Math.round(this.drawY(alpha) + 5), pul = 1 + Math.round(Math.sin(this.t * 14));
        ctx.fillStyle = '#12300f'; ctx.fillRect(x - 5, y - 4, 10, 8); ctx.fillRect(x - 4, y - 5, 8, 10);
        ctx.fillStyle = '#4fb83a'; ctx.fillRect(x - 4, y - 3, 8, 6); ctx.fillRect(x - 3, y - 4, 6, 8);
        ctx.fillStyle = '#d4ffb8'; ctx.fillRect(x - 2, y - 2, 4, 4); ctx.fillStyle = '#ffffff'; ctx.fillRect(x - 1 + (pul > 1 ? 0 : 1), y - 1, 2, 2);
    }
}

// Cột gai: 'warn' (CHƯA gây hại: vòng tím + tia nhấp nháy trên sàn) warnT giây → 'up' (trồi nhanh, gây hại) → thụt xuống.
class SoulPillar extends BossHazard {
    constructor(cx, floorY, warnT, owner) { super(cx - 7, floorY - 2, 14, 2, 'pillar', owner); this.floorY = floorY; this.cxx = cx; this.warnT = warnT; this.st = 'warn'; this.active = false; this.maxH = 46; this.upT = 0; }
    light() { return this.st === 'warn' ? { r: 10 + 12 * clamp(this.t / this.warnT, 0, 1), col: '#6fd84a', a: 0.25 } : { r: 22, col: '#a8f070', a: 0.5 }; }
    step(level, dt) {
        if (this.st === 'warn') {
            if (Math.floor(this.t * 14) !== Math.floor((this.t - dt) * 14)) level.fx.push({ x: this.cxx + (game.rngFx.next() - 0.5) * 10, y: this.floorY - 2, vx: 0, vy: -30, life: 0.3, max: 0.35, size: 2, col: '#7fe05a' });
            if (this.t >= this.warnT) { this.st = 'up'; this.upT = 0; this.active = true; sndPlay('bossSlam', { x: this.cxx, vol: 0.35, p: 1.6 }); level.spawnDust(this.cxx, this.floorY, 5, 90, 14); }
            return;
        }
        this.upT += dt; const U = this.upT, hold = 0.42;
        const h = U < 0.08 ? this.maxH * (U / 0.08) : U < hold ? this.maxH : this.maxH * Math.max(0, 1 - (U - hold) / 0.12);
        this.h = Math.max(2, h); this.y = this.floorY - this.h; if (U >= hold + 0.12) this.alive = false;
    }
    draw(ctx, alpha) {
        if (ITEM_HP) return drawSoulPillarHp(this, ctx, alpha);
        const x = Math.round(this.x), fy = Math.round(this.floorY);
        if (this.st === 'warn') {
            const k = clamp(this.t / this.warnT, 0, 1), blink = this.warnT - this.t < 0.25 && Math.floor(this.t * 30) % 2;
            ctx.globalAlpha = blink ? 1 : 0.3 + 0.5 * k; ctx.strokeStyle = '#8ae04a'; ctx.strokeRect(Math.round(this.cxx) - 9 + 0.5, fy - 3 + 0.5, 18, 3);
            ctx.fillStyle = '#c8f8a0'; ctx.fillRect(Math.round(this.cxx) - 1, fy - 9 - Math.round(k * 4), 3, 4); ctx.globalAlpha = 1; return;
        }
        const y = Math.round(this.y), h = Math.round(this.h);
        ctx.fillStyle = '#12300f'; ctx.fillRect(x - 1, y - 1, 16, h + 1);
        for (let j = 0; j < h; j++) { const w = j < 6 ? 2 + j : 12 + (j % 6 < 3 ? 0 : 0); ctx.fillStyle = j < 4 ? '#e8ffd0' : '#4fb83a'; ctx.fillRect(x + 7 - (w >> 1), y + j, Math.min(w, 14), 1); }
        ctx.fillStyle = '#a8f070'; ctx.fillRect(x + 3, y + 8, 2, Math.max(0, h - 10));
    }
}

// ---------- Boss 3: THỢ SĂN TUYẾT ----------
// idle → LAO (dash_wind → dash → dash_rec) | NÉM GIÁO (spear_wind → spear_out: giáo bay đi và quay về, boss đứng chờ = sơ hở) | NHẢY BỔ (leap_wind → leap → leap_rec) | pha 2: ĐÒN NỐI (lao, quay đầu, lao ngược lại) và NÉM 2 GIÁO.
const BOSS_HUNTER = {
    idle: [0.8, 0.55],
    dashW: [0.75, 0.55], dashSpeed: [200, 235], dashMax: 0.5, dashRec: [1.0, 0.8], comboW: 0.4,       // lao tối đa ~100–118 px
    spearW: [0.7, 0.55], spearSpeed: 150, spearRange: 150, spears: [1, 2], spear2Gap: 0.45, spearWait: 3.2,
    leapW: [0.75, 0.6], leapVy: -250, leapAir: 0.55, leapMaxVx: 170, leapRec: [1.0, 0.8], waveSpeed: [80, 100]
};
class Hunter extends Boss {
    constructor(cx, by) { super('hunter', cx, by); this.aim = -1; this.ignorePlat = true; this.combo = false; this.fastW = 0; this.spearsLeft = 0; this.spearT = 0; this.floorY = 0; this.spearHeight = 0; }
    ph(a) { return Array.isArray(a) ? a[this.phase - 1] : a; }
    sleepStep(level, dt) { this.vx = 0; this.vy = Math.min(this.vy + PHYS.gravity * dt, PHYS.fallMax); physMove(level, this, dt); }
    face(p) { if (!p.dead) this.facing = this.dir = p.cx >= this.cx ? 1 : -1; }
    spears() { let n = 0; for (const e of game.entities) if (e.alive && e instanceof IceSpear && e.owner === this) n++; return n; }
    throwSpear(level, y) {
        const B = BOSS_HUNTER; entAdd(new IceSpear(this.cx + this.facing * 10, y, this.facing, B.spearSpeed, B.spearRange, this));
        sndPlay('shard', { x: this.cx, vol: 0.8, p: 0.8 }); sndPlay('bossRush', { x: this.cx, vol: 0.35, p: 1.5 });
    }
    light() {
        const L = super.light(); if (L) return L;
        const B = BOSS_HUNTER, k = x => clamp(this.stT / this.ph(x), 0, 1);
        if (this.st === 'dash_wind') return { r: 14 + 22 * k(B.dashW), col: '#ff4a2a', a: 0.15 + 0.55 * k(B.dashW) };
        if (this.st === 'spear_wind') return { r: 14 + 20 * k(B.spearW), col: '#7fd0ff', a: 0.15 + 0.5 * k(B.spearW) };
        if (this.st === 'leap_wind') return { r: 14 + 22 * k(B.leapW), col: '#ffd060', a: 0.15 + 0.55 * k(B.leapW) };
        if (this.st === 'dash') return { r: 28, col: '#ffffff', a: 0.4 };
        return { r: 14, col: '#9ad8ff', a: 0.2 };
    }
    think(level, dt, p) {
        const B = BOSS_HUNTER, ph = this.phase;
        if (!this.floorY) this.floorY = this.y + this.h;
        if (this.spearT > 0 && (this.spearT -= dt) <= 0) { this.spearT = 0; if (this.spearsLeft > 0) { this.spearsLeft--; this.throwSpear(level, this.floorY - 7); } }
        switch (this.st) {
            case 'idle': {
                this.vx = 0; this.face(p);
                if (this.stT >= this.ph(B.idle)) {
                    const list = ph === 2 ? ['dash', 'spear', 'leap', 'combo'] : ['dash', 'spear', 'leap'];
                    const dx = Math.abs(p.cx - this.cx);
                    let pat = this.pick(list);
                    if (dx < 36 && pat === 'dash' && game.rngPlay.next() < 0.5) pat = this.pick(['spear', 'leap']);      // sát quá thì đừng lao (lao sẽ chạy qua người)
                    this.lastPat = pat;
                    if (pat === 'dash' || pat === 'combo') { this.aim = this.facing; this.combo = pat === 'combo'; this.go('dash_wind'); sndPlay('bossWind', { x: this.cx }); }
                    else if (pat === 'spear') { this.go('spear_wind'); sndPlay('bossWind', { x: this.cx, p: 1.4 }); }
                    else { this.go('leap_wind'); sndPlay('bossWind', { x: this.cx, p: 1.2 }); }
                }
                break;
            }
            case 'dash_wind':
                this.vx = 0;
                if (Math.floor(this.stT * 10) !== Math.floor((this.stT - dt) * 10)) level.spawnDust(this.cx - this.aim * 8, this.y + this.h, 2, 60, 12);
                if (this.stT >= (this.fastW || this.ph(B.dashW))) { this.fastW = 0; this.go('dash'); sndPlay('bossRush', { x: this.cx }); }
                break;
            case 'dash': this.vx = this.aim * this.ph(B.dashSpeed); if (Math.floor(this.stT * 30) !== Math.floor((this.stT - dt) * 30)) level.fx.push({ x: this.cx - this.aim * 8, y: this.cy + (game.rngFx.next() - 0.5) * 12, vx: -this.aim * 20, vy: 0, life: 0.25, max: 0.3, size: 3, col: '#e8f6ff' }); break;
            case 'dash_rec': this.vx = 0; if (this.stT >= this.ph(B.dashRec)) this.go('idle'); break;
            case 'spear_wind':
                this.vx = 0; this.face(p);
                if (this.stT >= this.ph(B.spearW)) {
                    const y = clamp(p.cy, this.floorY - 40, this.floorY - 8); this.throwSpear(level, y);
                    this.spearsLeft = this.ph(B.spears) - 1; this.spearT = this.spearsLeft > 0 ? B.spear2Gap : 0; this.go('spear_out');
                }
                break;
            case 'spear_out': this.vx = 0; if (this.stT > 0.3 && this.spearsLeft === 0 && this.spearT === 0 && this.spears() === 0 || this.stT >= B.spearWait) this.go('idle'); break;
            case 'leap_wind': this.vx = 0; this.face(p); if (this.stT >= this.ph(B.leapW)) {
                const dx = p.cx - this.cx; this.facing = this.dir = dx >= 0 ? 1 : -1;
                this.vy = B.leapVy; this.vx = clamp(dx / B.leapAir, -B.leapMaxVx, B.leapMaxVx); this.onGround = false; this.go('leap'); sndPlay('bossRush', { x: this.cx, vol: 0.6, p: 1.6 });
            } break;
            case 'leap': if (this.stT > 0.1 && this.onGround) this.land(level); break;
            case 'leap_rec': this.vx = 0; if (this.stT >= this.ph(B.leapRec)) this.go('idle'); break;
        }
        if (this.st !== 'leap' && this.st !== 'dash') this.vx = 0;
        this.vy = Math.min(this.vy + PHYS.gravity * dt, PHYS.fallMax);
        physMove(level, this, dt);
        if (this.st === 'dash' && (this.hitL || this.hitR || this.stT >= B.dashMax)) {                                  // hết đà / đụng tường
            const wall = this.hitL || this.hitR; this.vx = 0;
            if (wall) { sndPlay('bossSlam', { x: this.cx, vol: 0.6 }); fxShake(2, 0.2); level.spawnBurst(this.cx + this.aim * 8, this.cy, 8, '#e8f6ff', 110); }
            if (this.combo) { this.combo = false; this.aim = -this.aim; this.facing = this.dir = this.aim; this.fastW = B.comboW; this.go('dash_wind'); sndPlay('bossWind', { x: this.cx, p: 1.5 }); }
            else this.go('dash_rec');
        }
    }
    land(level) {
        const B = BOSS_HUNTER, fy = this.y + this.h, sp = this.ph(B.waveSpeed);
        this.vx = 0; this.go('leap_rec'); sndPlay('bossSlam', { x: this.cx }); fxShake(3, 0.3); fxScreenFlash('#dff4ff', 0.14, 0.15);
        level.spawnBurst(this.cx, fy - 4, 14, '#e8f6ff', 140); level.spawnDust(this.cx, fy, 6, 120, 18);
        for (const d of [-1, 1]) entAdd(new Wave(this.cx + d * (this.w / 2 + 2), fy, d, sp, this, '#bfe9ff'));
    }
    draw(ctx, alpha) {
        if (ITEM_HP) return drawHunterHp(this, ctx, alpha);
        const x = Math.round(this.drawX(alpha)), y = Math.round(this.drawY(alpha)), W = this.w, H = this.h, f = this.facing, st = this.st, t = this.t;
        const flash = this.flashT > 0, sleep = st === 'sleep', B = BOSS_HUNTER;

class Stalactite extends BossHazard {
    constructor(c, r) { super(c * TILE + 4, r * TILE, 8, 11, 'stalactite', null); this.st = 'hang'; this.active = false; this.homeX = this.x; this.floorY = 0; this.warnAt = 0; }
    light() { return this.st === 'warn' ? { r: 12, col: '#ff6a4a', a: 0.18 } : null; }
    clearBelow(level, toY) { for (let y = this.y + this.h + 2; y < toY; y += 4) if (level.solidAt(this.cx, y)) return false; return true; }
    shatter(level, burst) {
        this.alive = false; level.spawnBurst(this.cx, this.cy, burst, '#9aa0b8', 90); level.spawnDust(this.cx - 4, this.y + this.h, 4, 60, 12);
        sndPlay('rock', { x: this.cx, p: 1.3 }); fxShake(0.6, 0.1);
    }
    startFall(level) { this.st = 'fall'; this.active = true; this.vy = 40; this.x = this.homeX; this.floorY = roomFloorY(level, this.cx, this.y + this.h); }
    step(level, dt) {
        const p = game.player;
        if (this.st === 'hang') {
            if (!level.solidAt(this.cx, this.y - 2)) { this.floorY = roomFloorY(level, this.cx, this.y + this.h); this.st = 'warn'; this.warnAt = this.t - STAL.warnT * 0.5; return; }     // trần bị nổ / đào: rơi sớm
            if (p && !p.dead && Math.abs(p.cx - this.cx) <= STAL.sightX && p.y > this.y + this.h && p.y - this.y <= STAL.sightY && this.clearBelow(level, p.y)) {
                this.st = 'warn'; this.warnAt = this.t; this.floorY = roomFloorY(level, this.cx, this.y + this.h); sndPlay('rock', { x: this.cx, vol: 0.5, p: 1.7 });
            }
        } else if (this.st === 'warn') {
            this.x = this.homeX + (Math.floor(this.t * 40) % 2 ? 1 : -1);
            if (Math.floor(this.t * 14) !== Math.floor((this.t - dt) * 14)) level.fx.push({ x: this.cx + (game.rngFx.next() - 0.5) * 6, y: this.y + this.h, vx: 0, vy: 40, life: 0.3, max: 0.35, size: 2, col: '#8a8fa8' });
            if (this.t - this.warnAt >= STAL.warnT) this.startFall(level);
        } else {
            this.vy = Math.min(this.vy + STAL.grav * dt, STAL.fallMax); this.y += this.vy * dt;
            if (this.y + this.h >= this.floorY) this.shatter(level, 8);
        }
    }
    contact() { const hit = super.contact(); if (hit) this.shatter(game.level, 6); return hit; }
    draw(ctx, alpha) {
        if (ITEM_HP) return drawStalactiteHp(this, ctx, alpha);
        const x = Math.round(this.drawX(alpha)), y = Math.round(this.drawY(alpha)), warn = this.st === 'warn';
        if (warn) {                                                  // dấu đỏ dưới sàn báo chỗ rơi
            const k = clamp((this.t - this.warnAt) / STAL.warnT, 0, 1), fy = Math.round(this.floorY), blink = k > 0.7 && Math.floor(this.t * 30) % 2;
            ctx.globalAlpha = blink ? 1 : 0.35 + 0.5 * k; ctx.fillStyle = '#ff3b3b'; ctx.fillRect(Math.round(this.cx) - 4, fy - 2, 8, 2); ctx.globalAlpha = 1;
        }
        for (let j = 0; j < this.h; j++) {                           // mũi nhọn chúc xuống
            const wd = Math.max(1, Math.round(this.w * (1 - j / this.h))), ox = x + ((this.w - wd) >> 1);
            ctx.fillStyle = '#2a2e3e'; ctx.fillRect(ox - 1, y + j, wd + 2, 1);
            ctx.fillStyle = warn && Math.floor(this.t * 20) % 2 ? '#d8c0c0' : '#8a8fa8'; ctx.fillRect(ox, y + j, wd, 1);
        }
        ctx.fillStyle = '#c4c9de'; ctx.fillRect(x + 2, y + 1, 1, Math.max(1, this.h - 5));
    }
}

// ---- Vùng 9 (hang núi lửa): bong bóng lửa — mặt dung nham GẦN người chơi sủi bọt (báo 0,6 s) rồi bắn 1 cầu lửa lên, rơi lại ----
const POP = { gapMin: 1.6, gapMax: 3.2, warnT: 0.6, range: 150, vy: -140, maxLive: 3 };
function lavaPopStep(L, p) {
    if (!p || p.dead || !L.hasLava || !curMech().pop) return;
    const q = game.popQ || (game.popQ = []); if (game.popT === undefined || game.levelT < 0.2) game.popT = POP.gapMin;
    for (let i = q.length - 1; i >= 0; i--) {
        const o = q[i]; o.t -= STEP;
        if (Math.floor(o.t * 30) % 3 === 0) L.fx.push({ x: o.x + (game.rngFx.next() - 0.5) * 10, y: o.y - 1, vx: 0, vy: -18, life: 0.25, max: 0.3, size: 2, col: '#ffb040' });
        if (o.t <= 0) { q.splice(i, 1); if (L.tile(o.c, o.r) === T_LAVA) { entAdd(new Fireball(o.x, o.y - 2, (game.rngPlay.next() - 0.5) * 20, POP.vy, null)); sndPlay('boom', { x: o.x, p: 2, vol: 0.25 }); L.spawnBurst(o.x, o.y, 5, '#ff9a2e', 80); } }
    }
    if ((game.popT -= STEP) > 0 || q.length >= POP.maxLive) return;
    game.popT = POP.gapMin + game.rngPlay.next() * (POP.gapMax - POP.gapMin);
    const c0 = Math.max(0, Math.floor((p.cx - POP.range) / TILE)), c1 = Math.min(L.w - 1, Math.floor((p.cx + POP.range) / TILE)), r0 = Math.max(0, Math.floor((p.cy - 110) / TILE)), r1 = Math.min(L.h - 1, Math.floor((p.cy + 110) / TILE)), cand = [];
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (L.tile(c, r) === T_LAVA && !L.isSolid(c, r - 1) && L.tile(c, r - 1) !== T_LAVA) cand.push([c, r]);
    if (!cand.length) return;
    const [c, r] = cand[Math.floor(game.rngPlay.next() * cand.length)]; q.push({ c, r, x: (c + 0.5) * TILE, y: r * TILE + 6, t: POP.warnT });
}

// 12c_finale — MÀN CUỐI (level 55 sau vùng 9, lần 40-41): TITAN NÚI LỬA, boss "đố mẹo môi trường" (ý Dan chốt 14:24, kiểu Olmec của Spelunky).
//   Titan BẤT TỬ (mọi đòn đều "keng"); không có thanh máu. Cách thắng: sàn arena gồm 5 Ô (mỗi ô rộng 4 ô-gạch) × 2 LỚP đất, dưới cùng là dung nham.
//   Mỗi cú ĐẬP của Titan phá 1 lớp trong đúng ô nó nhắm (ô khoá theo vị trí người chơi lúc bắt đầu "báo"; cột đỏ báo ô nào). Đập vào ô đã mất hết lớp
//   → Titan lao thủng xuống dung nham và chìm = THẮNG (qua cửa ra = hết game). Phải dụ nó đập 3 lần ĐÚNG MỘT Ô, vừa né cú đập, sóng đất và mưa đá;
//   đập sai ô thì thủng thêm một hố (hết chỗ đứng), bom có thể phá sẵn một lớp để rút ngắn. Số liệu là ước lượng — chỉnh ở BOSS_TITAN.
//   Tọa độ arena (genFinaleArena): lưới 26×24, ô-gạch hàng 16-17 là sàn (2 lớp), hàng 18-22 dung nham, 2 bệ cứng hai bên (xuất phát trái, cửa ra phải).
const BOSS_TITAN = {
    hover: 84, idle: [1.0, 0.7], track: [1.1, 0.8], slamW: [1.0, 0.75], slamSpeed: 340, stuck: [1.2, 0.9], rise: 130, waveSpeed: [80, 100],
    rainW: 0.8, rainWarn: 0.9, rainN: [4, 5], rainRec: 1.3, sinkSpeed: 70, sinkDepth: 0.65, teach: 2
};
const FIN = { W: 26, H: 24, cells: 5, cellW: 4, c0: 3, layerRows: [16, 17], lavaRow: 18, bossRow: 6 };     // tọa độ lưới map (chưa cộng LVL.border)

function genFinaleArena(levelIdx) {
    const W = FIN.W, H = FIN.H, g = []; for (let r = 0; r < H; r++) g.push(new Array(W).fill('.'));
    for (let c = 0; c < W; c++) { g[0][c] = 'H'; g[H - 1][c] = 'H'; } for (let r = 0; r < H; r++) { g[r][0] = 'H'; g[r][W - 1] = 'H'; }
    for (let r = 16; r < H; r++) for (const c of [1, 2, 23, 24]) g[r][c] = 'H';                                     // hai bệ cứng
    for (let c = FIN.c0; c < FIN.c0 + FIN.cells * FIN.cellW; c++) { for (const r of FIN.layerRows) g[r][c] = '#'; for (let r = FIN.lavaRow; r < H - 1; r++) g[r][c] = 'V'; }
    for (const c of [5, 6, 7, 8, 17, 18, 19, 20]) g[13][c] = '=';                                                 // 2 bục để nhảy tránh sóng
    g[15][2] = 'P'; g[15][23] = 'E'; g[FIN.bossRow][13] = '5';
    const B = LVL.border;
    return {
        def: { id: 'L' + (levelIdx + 1), name: 'Hang núi lửa — Titan', theme: 'magma', dark: 0, boss: 'titan', map: g.map(r => r.join('')), finale: { c0: FIN.c0 + B, cells: FIN.cells, cellW: FIN.cellW, topRow: FIN.layerRows[0] + B, rows: FIN.layerRows.length, lavaRow: FIN.lavaRow + B } },
        meta: { boss: 'titan', start: { c: 2, r: 15 }, exit: { c: 23, r: 15 }, counts: { snake: 0, bat: 0, foe: 0, rock: 0, pot: 0, crate: 0, gold: 0, trap: 0, princess: 0, shop: 0 }, shop: null, rooms: null, path: null }
    };
}
// Lớp trên cùng còn lại của ô i (hàng ô-gạch), hoặc -1 nếu ô đã thủng hết
function finTopRow(level, F, i) {
    for (let k = 0; k < F.rows; k++) { const r = F.topRow + k; for (let j = 0; j < F.cellW; j++) if (level.isSolid(F.c0 + i * F.cellW + j, r)) return r; }
    return -1;
}
function finLayers(level, F, i) { let n = 0; for (let k = 0; k < F.rows; k++) { const r = F.topRow + k; let any = false; for (let j = 0; j < F.cellW; j++) if (level.isSolid(F.c0 + i * F.cellW + j, r)) any = true; if (any) n++; } return n; }

class Titan extends Boss {
    constructor(cx, by, F) {
        super('titan', cx, by); this.F = F; this.gravity = 0; this.ignorePlat = true; this.firstState = 'hover'; this.slams = 0; this.acts = 0; this.cell = 2; this.lockCx = cx; this.sunk = false; this.rainLeft = 0;
        this.homeY = F.topRow * TILE - BOSS_TITAN.hover - this.h; this.homeX = cx - this.w / 2; this.x = this.px = this.homeX; this.y = this.py = this.homeY; this.noBar = true;
    }
    ph(a) { return Array.isArray(a) ? a[this.phase - 1] : a; }
    get harmless() { return this.st === 'sleep' || this.st === 'intro' || this.st === 'roar' || this.st === 'dying'; }
    hurt(src) {                                                      // BẤT TỬ: mọi đòn chỉ "keng"
        if (!this.alive || this.st === 'dying') return false;
        const k = src.kind; if (k !== DMG.WHIP && k !== DMG.STOMP && k !== DMG.EXPLOSION && k !== DMG.IMPACT && k !== DMG.ARROW) return false;
        if ((this.clangT || 0) <= 0) { this.clangT = 0.2; sndPlay('clang', { x: this.cx, p: 0.6 }); game.level.spawnBurst(this.cx, this.cy, 5, '#ffb070', 90); this.flashT = 0.06; }
        return false;
    }
    wake(level) {
        super.wake(level); game.pickupMsg = { t: 0, text: 'Nó không chết vì đòn đánh — dụ nó đập thủng sàn cùng một chỗ' };
    }
    draw(ctx, alpha) { drawTitanHp(this, ctx, alpha); }
    cellCx(i) { return (this.F.c0 + i * this.F.cellW + this.F.cellW / 2) * TILE; }
    cellOf(x) { return clamp(Math.floor((x / TILE - this.F.c0) / this.F.cellW), 0, this.F.cells - 1); }
    sleepStep(level, dt) {
        if (this.sunk) { this.y += BOSS_TITAN.sinkSpeed * 0.4 * dt; return; }
        this.hoverTo(level, dt, this.homeX, this.homeY, 90);
    }
    hoverTo(level, dt, x, y, sp) {
        const dx = x - this.x, dy = y + Math.sin(this.t * 2.2) * 2 - this.y, L = Math.hypot(dx, dy), v = Math.min(sp, L * 4);
        this.vx = L > 0.5 ? dx / L * v : 0; this.vy = L > 0.5 ? dy / L * v : 0; physMove(level, this, dt);
    }
    light() {
        const L = super.light(); if (L) return L;
        const B = BOSS_TITAN;
        if (this.st === 'slam_wind') { const k = clamp(this.stT / this.ph(B.slamW), 0, 1); return { r: 30 + 30 * k, col: '#ff5a3a', a: 0.25 + 0.5 * k }; }
        if (this.st === 'rain_wind') return { r: 40, col: '#ff7a3a', a: 0.5 };
        if (this.st === 'sink') return { r: 50, col: '#ffb060', a: 0.6 };
        return { r: 34, col: '#ff7a3a', a: 0.32 };
    }
    think(level, dt, p) {
        const B = BOSS_TITAN, F = this.F; if (this.clangT > 0) this.clangT -= dt;
        this.phase = this.slams >= 2 ? 2 : 1;
        switch (this.st) {
            case 'hover':
                this.facing = this.dir = p.cx >= this.cx ? 1 : -1;
                this.hoverTo(level, dt, lerp(this.x, p.cx - this.w / 2, 0.4), this.homeY, 45);
                if (this.stT >= this.ph(B.idle)) {
                    const rain = this.acts >= B.teach && game.rngPlay.next() < 0.4; this.acts++;
                    if (rain) { this.go('rain_wind'); sndPlay('bossRoar', { vol: 0.35, p: 1.4 }); } else this.go('slam_track');
                }
                break;
            case 'slam_track':
                this.facing = this.dir = p.cx >= this.cx ? 1 : -1;
                this.hoverTo(level, dt, p.cx - this.w / 2, this.homeY, 150);
                if (this.stT >= this.ph(B.track)) { const over = p.cx >= F.c0 * TILE && p.cx < (F.c0 + F.cells * F.cellW) * TILE; this.cell = over ? this.cellOf(p.cx) : Math.floor(game.rngPlay.next() * F.cells); this.lockCx = this.cellCx(this.cell); this.go('slam_wind'); sndPlay('diveWind', { x: this.cx, vol: 1.0, p: 0.7 }); }
                break;
            case 'slam_wind':
                this.hoverTo(level, dt, this.lockCx - this.w / 2, this.homeY - 6 * clamp(this.stT / this.ph(B.slamW), 0, 1), 120);
                if (this.stT >= this.ph(B.slamW)) { this.go(finTopRow(level, F, this.cell) < 0 ? 'sink' : 'slam'); this.x = this.lockCx - this.w / 2; sndPlay('diveGo', { x: this.cx, vol: 1.0, p: 0.7 }); }
                break;
            case 'slam':
                this.vx = 0; this.vy = B.slamSpeed; physMove(level, this, dt);
                if (this.onGround || this.vy === 0) this.impact(level);
                break;
            case 'stuck': this.vx = this.vy = 0; if (this.stT >= this.ph(B.stuck)) this.go('rise'); break;
            case 'rise': this.hoverTo(level, dt, this.x, this.homeY, B.rise); if (Math.abs(this.y - this.homeY) < 6) this.go('hover'); break;
            case 'sink': {                                          // đập vào ô đã thủng hết: lao xuống dung nham và chìm
                this.vx = 0; this.y += (this.stT < 0.25 ? B.slamSpeed : B.sinkSpeed) * dt; this.sunk = true;
                if (Math.floor(this.t * 20) !== Math.floor((this.t - dt) * 20)) level.spawnBurst(this.cx + (game.rngFx.next() - 0.5) * this.w, this.y + this.h * 0.9, 2, '#ff8a2a', 100);
                if (this.y + this.h * B.sinkDepth >= F.lavaRow * TILE + 4) { this.y = F.lavaRow * TILE + 4 - this.h * B.sinkDepth; this.die(null); sndPlay('boom', { x: this.cx, p: 0.6 }); level.spawnBurst(this.cx, F.lavaRow * TILE, 26, '#ff8a2a', 190); }
                break;
            }
            case 'rain_wind':
                this.hoverTo(level, dt, this.x, this.homeY - 5 * clamp(this.stT / B.rainW, 0, 1), 40);
                if (this.stT >= B.rainW) {
                    const n = this.ph(B.rainN), px = p.cx;
                    for (let i = 0; i < n; i++) { const cx = clamp(px + (i - (n - 1) / 2) * 40 + (game.rngPlay.next() - 0.5) * 18, TILE * 4.5, level.pw - TILE * 4.5); entAdd(new FallRock(cx, TILE * 2 + 2, roomFloorY(level, cx, this.y), B.rainWarn + i * 0.12, this)); }
                    this.go('rain_rec');
                }
                break;
            case 'rain_rec': this.hoverTo(level, dt, this.x, this.homeY, 40); if (this.stT >= B.rainRec) this.go('hover'); break;
        }
    }
    impact(level) {                                                 // đập xuống: vỡ 1 lớp của ô, sóng lửa hai phía, nằm yên một nhịp
        const B = BOSS_TITAN, F = this.F, row = finTopRow(level, F, this.cell), fy = (row < 0 ? F.topRow : row) * TILE;
        this.go('stuck'); this.vx = this.vy = 0; this.slams++;
        if (row >= 0) for (let j = 0; j < F.cellW; j++) { const c = F.c0 + this.cell * F.cellW + j; if (level.isSolid(c, row) && level.tile(c, row) !== T_HARD) { level.setTile(c, row, T_EMPTY); level.spawnBurst((c + 0.5) * TILE, (row + 0.5) * TILE, 5, '#7a4a30', 120); } }
        sndPlay('bossSlam', { x: this.cx }); fxShake(5, 0.4); fxScreenFlash('#ffb070', 0.2, 0.2);
        level.spawnBurst(this.cx, fy - 4, 18, '#ff8a2a', 160); level.spawnDust(this.cx, fy, 8, 140, 20);
        const sp = this.ph(B.waveSpeed), half = F.cellW * TILE / 2 + 6, sy = F.topRow * TILE;
        for (const d of [-1, 1]) entAdd(new Wave(this.lockCx + d * half, sy, d, sp, this, '#ff8a3a'));
    }
}
// Dấu hiệu trên sàn: mỗi ô còn mấy lớp (vệt kẻ trên mặt ô, nứt khi còn 1 lớp)
function drawFinaleFloorHp(ctx, F, L) {
    const t = game.time;
    for (let i = 0; i < F.cells; i++) {
        const n = finLayers(L, F, i), x0 = (F.c0 + i * F.cellW) * TILE, row = finTopRow(L, F, i); if (row < 0) continue;
        const y = row * TILE, w = F.cellW * TILE;
        ctx.fillStyle = n >= 2 ? '#8a5a40' : '#ff7a3a'; ctx.fillRect(x0 + 1, y, 0.5, 4); ctx.fillRect(x0 + w - 1.5, y, 0.5, 4);           // cột mốc hai bên ô
        if (n === 1) { ctx.fillStyle = 'rgba(255,122,58,' + (0.55 + 0.25 * Math.sin(t * 5)).toFixed(2) + ')'; for (let k = 0; k < 6; k++) { const zx = x0 + 6 + k * 9.5; ctx.fillRect(zx, y + 0.5, 3, 0.5); ctx.fillRect(zx + 2.5, y + 1, 0.5, 1); ctx.fillRect(zx + 1.5, y + 2, 2, 0.5); } }
    }
}

// 13a_items — vật cầm được + bom + dây + vàng. Mỗi món chỉ khai báo thuộc tính Thing (08a_thing); va chạm/sát thương do 10a_damage lo.
//   Đá (SC oRock 8×8): ném trúng sinh vật −1. Bình (SC oJar): vỡ khi đâm tường > 3 px/khung hoặc rơi > 3 px/khung, bị roi/nổ; vỡ ra đồ ngẫu nhiên (dòng lối chơi).
//   Bom (SC oBomb 8×8): ngòi 80 + 40 khung (4 s) rồi nổ (explode). Nhặt lên ném tiếp được. Trúng nổ khác thì nổ theo sau 0,1 s.
//   Dây (SC oRopeThrow): ném thẳng lên −12 px/khung; bắt đầu rơi hoặc chạm trần thì bám vào cột ô đó, thả dài xuống tối đa 8 ô hoặc tới đất.
//     ↓ + dây: thả từ mép trước mặt xuống (đứng sát mép vực).
//   Vàng: chạm là nhặt (cộng vào player.gold).

class Rock extends Thing {
    constructor(x, y) { super(x, y, 8, 8, { kind: 'rock', carryable: true, hurtsOnImpact: true, impactDmg: 1, mass: 1, col: '#8a8f9e', dmgFrom: [] }); }      // đá không vỡ: nổ chỉ hất văng
    draw(ctx, alpha) {
        if (ITEM_HP) { drawRockHp(this, ctx, alpha); return; }
        const x = Math.round(this.drawX(alpha)), y = Math.round(this.drawY(alpha));
        ctx.fillStyle = '#5d6170'; ctx.fillRect(x, y + 2, 8, 6); ctx.fillRect(x + 1, y + 1, 6, 7);
        ctx.fillStyle = '#9ba0b0'; ctx.fillRect(x + 1, y + 2, 5, 3); ctx.fillStyle = '#c6cad6'; ctx.fillRect(x + 2, y + 2, 2, 1);
    }
}

class Pot extends Thing {
    constructor(x, y) { super(x, y, 10, 11, { kind: 'pot', carryable: true, hurtsOnImpact: true, impactDmg: 1, breakOnImpact: true, hp: 1, mass: 1, col: '#b8743a' }); this.oil = oilPot(x, y); }
    onWall(level, v) { if (Math.abs(v) > 90) this.shatter(level); }          // SC: |xVel| > 3
    onLand(level, v) { if (v > 90) this.shatter(level); }                     // SC: yVel > 3
    onHitTarget(level, t) { this.shatter(level); }
    shatter(level) { if (this.alive) this.die({ kind: DMG.CRUSH, dmg: 1 }); }
    onDie(src) {
        const L = game.level, R = game.rngPlay, x = this.cx, y = this.cy;

class RopeThrow extends Thing {
    constructor(x, y) { super(x, y, 4, 4, { kind: 'rope', mass: 0, triggersTraps: false, dmgFrom: [], gravity: PHYS.gravity * 0.6 }); this.anchor = null; this.n = 0; this.t = 0; }
    update(level, dt) {

            while (this.t >= ITEM.ropeDropT && this.anchor) {

                const { c } = this.anchor, r = this.anchor.r + this.n;
                if (this.n >= ITEM.ropeLen || level.isSolid(c, r)) { this.alive = false; this.anchor = null; break; }

            return;

        physMove(level, this, dt);
