<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Honzy</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0d14; }
        body { display: flex; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none; }
        #stage { position: relative; line-height: 0; }
        canvas#game { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; outline: none; touch-action: none; }
        canvas#hud { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }      /* lớp chữ/bản đồ vẽ ở độ phân giải thật của màn hình (xem 06_render: drawText) */
        #tune { position: fixed; top: 8px; right: 8px; width: 250px; max-height: calc(100% - 16px); overflow: auto; display: none;
                background: rgba(10,12,20,.92); color: #cfd6e6; font: 11px/1.3 monospace; padding: 8px; border: 1px solid #3a4260; border-radius: 6px; }
        #tune.on { display: block; }
        #tune h4 { margin: 0 0 6px; font-size: 12px; color: #ffd36b; }
        #tune label { display: flex; justify-content: space-between; margin-top: 5px; }
        #tune input[type=range] { width: 100%; margin: 0; }
        #tune button { margin: 8px 4px 0 0; font: 11px monospace; cursor: pointer; }
    </style>
</head>
<body>
    <div id="stage"><canvas id="game" width="320" height="240" tabindex="0"></canvas><canvas id="hud"></canvas></div>
    <div id="tune"></div>

    <!-- Thứ tự nạp = số trong tên file. 3 khối: config -> entities -> engine -->
    <script>
// 01_config — hằng số toàn game (kích thước, vật lý, phím, camera) + vài hàm tiện ích nhỏ
// Mọi giá trị trong PHYS / WHIP / ITEM / CAM chỉnh được trực tiếp bằng bảng "Tuning" trong game (phím G).
//
// SỐ LIỆU SPELUNKY CLASSIC: các số có ghi "SC:" lấy từ mã nguồn Spelunky Classic (bản công bố 2009, giấy phép Spelunky User License v1.1b:
//   được học/sửa/chia sẻ, KHÔNG được bán bản dẫn xuất). Mình chỉ lấy SỐ và THUẬT TOÁN, không chép mã/hình/âm/mẫu phòng.
//   Game gốc chạy 30 khung/giây; mình chạy 60Hz nên đổi đơn vị: px/khung × 30 = px/s · px/khung² × 900 = px/s² · số khung ÷ 30 = giây.
//   Hệ số ma sát nhân mỗi khung (vd 0.6) được áp theo thời gian: v *= f^(dt·30) — cùng kết quả sau mỗi 1/30 s.

let RENDER_SMOOTH = true;             // nền (khối ô) phóng 2× làm mịn kiểu EPX (06_render.epx2); false = nền 1px thô như cũ
const RES = 2;                           // độ phân giải bên trong = RES × (320×240): thế giới vẫn tính theo ô 16px, nhưng nhân vật/quái vẽ được nửa-pixel (lần 25)
const VIEW_W = 320, VIEW_H = 240;      // SC: khung nhìn 320×240 = 20×15 ô (D2). Phóng to vừa màn hình.
const TILE = 16;                       // 1 ô = 16px
const STEP = 1 / 60;                   // bước vật lý cố định (giây)
const MAX_FRAME_DT = 0.1;              // chặn khi tab bị treo lâu
const TAU = Math.PI * 2;
const SC_FPS = 30;                     // tốc độ khung của Spelunky Classic (để đổi đơn vị)

// Bản đồ (H1, thay D1): lưới 5×5 phòng (trước là 4×4 theo SC), mỗi phòng 10×8 ô => level 50×40 ô, cộng viền đá cứng 1 ô quanh ngoài = 52×42 ô. Màn boss / màn cuối có đấu trường riêng, không theo lưới này.
const LVL = { roomsX: 5, roomsY: 5, roomW: 10, roomH: 8, border: 1 };
LVL.w = LVL.roomsX * LVL.roomW + 2 * LVL.border;     // 52
LVL.h = LVL.roomsY * LVL.roomH + 2 * LVL.border;     // 42

// Loại ô
//   T_SOLID  = đất thường: đặc, PHÁ ĐƯỢC bằng bom (D11)
//   T_HARD   = đá cứng: đặc, KHÔNG phá được (viền level, cửa ra)
//   T_ONEWAY = bục một chiều (đứng trên được, nhảy xuyên từ dưới lên, ↓+nhảy để xuống)
//   T_LADDER = thang: không đặc, leo được; ô thang trên cùng (ô trên nó không phải thang) đứng lên được như bục một chiều
//   T_SPIKE  = gai: không đặc; rơi xuống trúng thì chết (SC: đang rơi + đã rơi > 4 khung). Đi ngang qua không sao.
//   T_ARROW  = bẫy mũi tên: đặc, KHÔNG bị bom phá (v0.18); bắn khi có VẬT ĐANG CHUYỂN ĐỘNG đi vào tầm (13b_traps)
//   T_GOLD   = đất có vàng: như đất thường; phá ra thì rơi vàng
//   T_GOLDBIG = đất có mạch vàng lớn · T_STONE = khối đá (SC oBlock: 10% ô đất thành khối đá; bẫy mũi tên được tạo từ khối đá)
const T_EMPTY = 0, T_SOLID = 1, T_HARD = 2, T_ONEWAY = 3, T_LADDER = 4, T_SPIKE = 5, T_ARROW = 6, T_GOLD = 7, T_GOLDBIG = 8, T_STONE = 9, T_PUSH = 10, T_WATER = 11, T_CRUSH = 12, T_LAVA = 13, T_SPRING = 14, T_WEB = 15, T_CRUMBLE = 16, T_ICE = 17;      // T_SPRING = lò xo (nảy cao), T_WEB = mạng nhện (làm chậm), T_CRUMBLE = sàn vỡ (đứng lên là rung rồi sập) — 13j_springs      // T_LAVA = dung nham (13i_lava): không đặc; chạm là chết (người chơi, quái); vật nhặt được rơi vào thì cháy mất      // T_WATER = nước tĩnh (13g_water): không đặc, vẽ phủ lên vật thể, bơi/chìm chậm, không sát thương rơi      // T_PUSH = khối đẩy được (SC oPushBlock): đặc, bom phá được; đẩy sang ngang 1 ô, mất chỗ tựa thì rơi và đè chết sinh vật (13f_pushblock)
const T_IS_SOLID = [false, true, true, false, false, false, true, true, true, true, true, false, true, false, false, false, true, true];          // theo chỉ số loại ô
const T_BREAKABLE = [false, true, false, false, true, true, false, true, true, true, true, false, false, false, true, true, true, true];        // bom phá được (thang, gai cũng vỡ); v0.18: T_ARROW (chỉ số 6) KHÔNG còn bị phá
// Ký tự trong bản đồ ASCII (02_data.js). Ký tự đặt vật/quái xem LVL_CHARS ở 02_data.
const TILE_CHARS = { '#': T_SOLID, 'H': T_HARD, '=': T_ONEWAY, 'L': T_LADDER, '^': T_SPIKE, '<': T_ARROW, '>': T_ARROW, '$': T_GOLD, '%': T_GOLDBIG, 'X': T_STONE, 'M': T_PUSH, 'W': T_WATER, 'Z': T_CRUSH, 'V': T_LAVA, 'Y': T_SPRING, 'N': T_WEB, 'F': T_CRUMBLE, '~': T_ICE, ' ': T_EMPTY, '.': T_EMPTY };

// Người chơi (hitbox). SC: hộp va chạm 10×16 (−5..5, −8..8). Mình dùng 10×15 để chui khe cao đúng 1 ô không bị kẹt do làm tròn số thực.
const PLAYER_W = 10, PLAYER_H = 15;

// ---- Vật lý người chơi (px, giây) — đổi từ SC (xem đầu file) ----
//   Chạy: SC giới hạn 3 px/khung khi đi (90 px/s), 6 px/khung khi giữ nút chạy ≥ 10 khung (180 px/s); gia tốc 3 px/khung² nên gần như tức thì.
//   Đổi hướng: SC chỉ tăng tốc khi đã giữ phím > 2 khung (bấm rất nhanh = chỉ quay mặt, không bước) => turnDelay.
//   Nhảy: SC vận tốc ban đầu −4 px/khung (−120 px/s); trọng lực tăng dần từ 0 lên đầy (1 px/khung² = 900 px/s²) trong 10 khung khi còn GIỮ nút;
//         thả nút thì trọng lực đầy ngay. Kết quả: giữ = cao ~24px (1,5 ô), bấm nhanh = ~9px. Bậc 2 ô phải BÁM MÉP rồi leo lên (đúng như gốc).
//   Rơi: tối đa 10 px/khung (300 px/s).
const PHYS = {
    walkMax: 90,            // SC: 3 px/khung
    runMax: 180,            // SC: 6 px/khung (giữ nút chạy, hoặc SETTINGS.autoRun)
    runHoldT: 0.33,         // SC: giữ nút chạy ≥ 10 khung mới được chạy nhanh
    accel: 2700,            // SC: runAcc 3 px/khung²
    turnDelay: 0.07,        // SC: kLeftPushedSteps > 2
    groundFric: 0.6,        // SC: frictionRunningX (nhân mỗi 1/30 s khi không bấm hướng)
    airFric: 0.8,           // SC: xFric khi ở trên không
    jumpV: -120,            // SC: initialJumpAcc × 2 = −4 px/khung
    gravity: 900,           // SC: grav = 1 px/khung²
    jumpRampT: 0.333,       // SC: jumpTimeTotal = 10 khung
    fallMax: 300,           // SC: yVelLimit 10 px/khung
    coyote: 0.0,            // SC: không có (để 0; chỉnh thử nếu thấy khó)
    buffer: 0.0,            // SC: không có
    climbSpeed: 27,         // SC: climbAcc 0.6 + ma sát 0.6 => 0,9 px/khung
    ladderJumpVx: 120,      // SC: departLadderXVel 4 px/khung
    ladderJumpV: -120,      // SC: departLadderYVel −4
    hangCooldown: 0.17,     // SC: hangCount 5 khung sau khi buông mép (không bám lại ngay)
    stunFallT: 0.53,        // SC: rơi (vy > 0) quá 16 khung rồi chạm đất => choáng + mất 1 máu
    hurtFall2T: 1.07,       // SC: quá 32 khung => mất 2 máu
    deathFallT: 1.6,        // SC: quá 48 khung => mất 10 (chết)
    stunT: 2.0,             // SC: stunTimer += 60 khung
    spikeFallT: 0.13,       // SC: gai giết khi đang rơi và fallTimer > 4 khung
    lookDelay: 1.0,         // SC: giữ ↑/↓ đứng yên 30 khung thì camera bắt đầu dịch
    lookSpeed: 120,         // SC: 4 px/khung
    lookMax: 96             // giới hạn camera dịch khi nhìn lên/xuống (px). SC không giới hạn rõ — số tạm
};
const PHYS_DEFAULT = Object.assign({}, PHYS);
// Cho bảng tuning: [khoá, min, max, bước, nhãn]
const PHYS_META = [
    ['walkMax', 30, 200, 1, 'Tốc độ đi'], ['runMax', 60, 320, 1, 'Tốc độ chạy'], ['runHoldT', 0, 1, 0.01, 'Giữ chạy bao lâu (s)'],
    ['accel', 300, 5000, 50, 'Gia tốc'], ['turnDelay', 0, 0.2, 0.01, 'Trễ đổi hướng (s)'],
    ['groundFric', 0.05, 0.99, 0.01, 'Ma sát đất (nhân/khung SC)'], ['airFric', 0.05, 0.99, 0.01, 'Ma sát trên không'],
    ['jumpV', -300, -60, 1, 'Vận tốc nhảy'], ['gravity', 300, 2000, 10, 'Trọng lực'], ['jumpRampT', 0, 0.8, 0.01, 'Thời gian trọng lực tăng dần (s)'],
    ['fallMax', 150, 600, 5, 'Giới hạn rơi'], ['coyote', 0, 0.2, 0.01, 'Coyote (s, gốc = 0)'], ['buffer', 0, 0.2, 0.01, 'Nhớ phím nhảy (s, gốc = 0)'],
    ['climbSpeed', 10, 120, 1, 'Tốc độ leo'], ['stunFallT', 0.2, 1.5, 0.01, 'Rơi bao lâu thì choáng (s)'], ['deathFallT', 0.5, 3, 0.05, 'Rơi bao lâu thì chết (s)'],
    ['stunT', 0.2, 4, 0.1, 'Thời gian choáng (s)']
];

// ---- Roi (D3) — SC: hoạt ảnh 11 khung × tốc 0.6 ≈ 18 khung (0,61 s). 3 khung đầu: đòn "vung sau" sau lưng; từ khung 8: đòn chính phía trước.
//   H2: hình vẽ đã đổi thành KIẾM của mèo (HERO_ANIMS), nhưng số liệu bên dưới vẫn là của roi cũ (tên WHIP/whipT giữ nguyên để không vỡ code khác).
const WHIP = {
    total: 0.51,            // SC: tổng thời gian 1 nhát
    preEnd: 0.15,           // SC: image_index < 2 => vung sau lưng
    hitStart: 0.15,         // SC: image_index > 4 => đòn chính phía trước, tới hết hoạt ảnh
    dmg: 1,                 // SC: oWhip.damage = 1
    recover: 0.15,          // lần 29: sau hitStart + recover (0.30s) được QUẤT LẠI ngay (không phải chờ hết total) — Dan: quất hụt thì không kịp quất lần 2
    buffer: 0.2,            // bấm quất trong lúc đang quất: nhớ 0.2s, tới lúc được quất lại thì tự quất
    near: 5,                // hộp đòn chính kéo về sau tới cx − near: bình/hũ/quái nằm ngay dưới chân cũng trúng
    // hộp đòn tính từ tâm người chơi (SC: sWhip đặt ở x ± 16, bbox 3..15 × 6..10 quanh gốc 8,8 => x 11..23, y −2..2)
    fx0: 11, fx1: 24, fy0: -3, fy1: 3,
    // vung sau (SC: sWhipPre bbox 0..9 × 0..11 => phía sau x −24..−15, y −8..3)
    bx0: -24, bx1: -14, by0: -8, by1: 4,
    // H2 — chém LÊN (↑ + nút chém): hộp đòn phía trên đầu, tính từ tâm người chơi; dùng cùng total / hitStart / recover / dmg như đòn ngang (không có vung sau)
    ux0: -7, ux1: 7, uy0: -24, uy1: -3,
    // H4a — ĐÁNH BAY vật nhẹ (đá, bình, thùng, xác): chém ngang cho vx theo hướng chém, chém lên cho vy lên; vật coi như vừa bị ném (thrower = người chơi, safeT)
    launchVx: 200, launchVy: -110, launchUpVy: -260, launchUpVx: 30,
    // H4a — PHẢN ĐÒN đạn (Bolt, Shell, Fireball, mũi tên đang bay): đạn bật theo hướng chém với tốc = max(tốc cũ, reflectMin) × reflectMul; đổi chủ sang người chơi
    reflectMin: 200, reflectMul: 1.2,
    // H4c — ĐÒN NẠP: sau nhát chém thường (đã hết `total`) mà vẫn giữ nút chém thì nạp `chargeT` giây (đi chậm ×chargeSlow); thả nút khi đã đầy thì tung đòn mạnh,
    //   thả sớm thì huỷ im lặng. Đòn mạnh: hộp đòn rộng thêm chargeReach (ra trước / lên trên) và chargeH (mỗi bên theo chiều dọc / ngang), bỏ vung sau,
    //   sát thương +chargeDmgAdd, hất ×chargeKbMul, đánh bay vật nhẹ ×chargeLaunchMul, đẩy khối T_PUSH tối đa chargePush ô (chỉ chém ngang). chargeSkip = bắt đầu ở giây này của hoạt ảnh (bỏ bớt lấy đà).
    chargeT: 0.45, chargeSlow: 0.4, chargeReach: 12, chargeH: 5, chargeDmgAdd: 1, chargeKbMul: 2.5, chargeLaunchMul: 1.6, chargePush: 2, chargeSkip: 0.06,
    // H4c-lửa (v0.16): đòn nạp đầy luôn kèm LỬA (chargeElem = 'fire'; về sau đổi theo món đồ phụ nguyên tố, A18). Lửa có tầm riêng chargeFireReach (px, tính từ tâm người chơi, ra trước hoặc lên trên) nhưng CHỈ châm vũng dầu / thùng dầu (có chắn tường); quái chỉ cháy khi nằm trong lưỡi chém. Thùng dầu đổ vũng ±45 px, nên ≥ ~50 mới đứng ngoài lửa lan.
    chargeFireReach: 50
};
const WHIP_DEFAULT = Object.assign({}, WHIP);
const WHIP_META = [['total', 0.2, 1.2, 0.01, 'Roi: tổng (s)'], ['hitStart', 0, 0.6, 0.01, 'Roi: lúc đòn chính bắt đầu (s)'], ['preEnd', 0, 0.3, 0.01, 'Roi: vung sau tới (s)'], ['launchVx', 60, 400, 5, 'Chém: lực đánh bay vật nhẹ (ngang)'], ['reflectMul', 0.6, 2, 0.05, 'Chém: hệ số tốc đạn khi phản đòn'], ['chargeT', 0.1, 1.5, 0.05, 'Đòn nạp: thời gian nạp (s)'], ['chargeReach', 0, 30, 1, 'Đòn nạp: tầm thêm (px)'], ['chargeKbMul', 1, 5, 0.1, 'Đòn nạp: hệ số hất quái'], ['chargeFireReach', 20, 90, 1, 'Đòn nạp: tầm lửa châm dầu (px)']];

// ---- Vật thể, bom, dây (SC) ----
// v0.40 CÂN BẰNG MÁU (Dan duyệt): 1 "đơn vị máu cũ" = HP_UNIT máu mới. Người chơi 10 máu (HUD 5 tim, nửa tim), quái nhỏ 2 / vừa 4 / lớn 6, kiếm 2.
//   Mọi sát thương gốc trong code vẫn tính theo đơn vị cũ; Thing.hurt nhân HP_UNIT cho quái, playerDmgOf (08a) đổi riêng cho người chơi. src.raw = true: không nhân (DoT: cháy / độc / nước = mất đúng 1 máu / nhịp).
const HP_UNIT = 2;
const HURT_P = { spike: 5, lava: 5, bomb: 3, knockVy: -230, knockVx: 110, invuln: 1.2, burnOnLava: true };      // gai / dung nham: 5 máu + hất ra; bom 5; bẫy đè & rơi vực (dmg ≥ 90) vẫn chết ngay
const ITEM = {
    throwVx: 240,           // SC: ném ngang ±8 px/khung (+ vận tốc người chơi)
    throwVy: -90,           // SC: −3 px/khung
    throwUpVy: -270,        // SC: giữ ↑ khi ném: −9 px/khung
    dropVy: 90,
    throwDownVy: 260,       // lần 29: ↓ + ném khi đang ở trên không: ném mạnh thẳng xuống (đủ nhanh để gây sát thương)             // SC: giữ ↓ khi ném: rơi xuống 3 px/khung, ngang ×0.1
    itemGravity: 540,       // SC: vật rơi 0.6 px/khung² (myGrav vật thể)
    bounceY: 0.5,           // SC: chạm đất thì nảy −vy × 0.5
    bounceX: 0.5,           // SC: chạm tường thì −vx × 0.5
    groundFric: 0.3,        // SC: lăn trên đất xVel × 0.3 mỗi khung khi đã nảy
    impactSpeed: 120,       // vật bay nhanh hơn mức này (px/s) mới gây sát thương khi đâm trúng (SC: |vel| > 4 cho đa số vật) — kiểm lại ở GĐ5
    bombFuse: 1.2,          // v0.43 PHÁO (H5; Dan duyệt: thay hẳn bom): ngòi ngắn hơn bom. SC: alarm[0] = 80 khung = 2,67 s…
    bombFuse2: 0.6,         // …rồi alarm[1] = 40 khung nhấp nháy nhanh => nổ (SC tổng 4 s; Pháo 1,8 s)
    blastR: 18,             // Pháo: nổ nhỏ hơn bom (SC: hình nổ 48×48 => bán kính ~24 px)
    blastDmg: 10,           // SC: người chơi trúng nổ mất 10 (= chết khi còn ≤ 10 máu); quái mất 30
    blastKnockVx: 150,      // SC: văng ngang rand(4,6) px/khung
    blastKnockVy: -180,     // SC: −6 px/khung
    ropeThrowVy: -360,      // SC: dây ném lên −12 px/khung, bám khi bắt đầu rơi hoặc chạm trần
    ropeLen: 8,             // SC: 16 đoạn × 8px = 8 ô
    ropeDropT: 1 / 15,      // SC: mỗi khung thả thêm 8px => 1 ô (16px) mỗi 2 khung 30Hz = 1/15 s
    stompVy: -180,          // SC: đạp đầu quái nảy lên −6 px/khung (− 0.2 × vy)
    startBombs: 8, startRopes: 4, startHp: 10     // v0.40: 10 máu (SC: lifeStart / bombStart / ropeStart = "4"
};
const ITEM_DEFAULT = Object.assign({}, ITEM);
const ITEM_META = [

function rngHash(x) {      // splitmix32: số nguyên 32-bit -> số nguyên 32-bit "trộn đều"
    x = (x + 0x9E3779B9) | 0;
    x = Math.imul(x ^ (x >>> 16), 0x85EBCA6B); x = Math.imul(x ^ (x >>> 13), 0xC2B2AE35);
    return (x ^ (x >>> 16)) >>> 0;
}
// Seed dạng chữ hoặc số -> số nguyên 32-bit
function rngSeedOf(s) {
    if (typeof s === 'number' && isFinite(s)) return s >>> 0;
    s = String(s); let h = 2166136261;
    for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
    return h >>> 0;
}

class Rng {
    constructor(seed) {
        let a = rngHash(seed), b = rngHash(a), c = rngHash(b), d = rngHash(c);
        this.s = [a, b, c, d];
        for (let i = 0; i < 12; i++) this.u32();     // bỏ vài số đầu
    }
    u32() {
        const s = this.s; let [a, b, c, d] = s;
        const t = (((a + b) | 0) + d) | 0;
        d = (d + 1) | 0; a = b ^ (b >>> 9); b = (c + (c << 3)) | 0; c = (c << 21) | (c >>> 11); c = (c + t) | 0;
        s[0] = a; s[1] = b; s[2] = c; s[3] = d;
        return t >>> 0;
    }
    next() { return this.u32() / 4294967296; }                 // [0, 1)
    range(a, b) { return a + this.next() * (b - a); }           // số thực [a, b)
    int(a, b) { return a + Math.floor(this.next() * (b - a + 1)); }   // số nguyên [a, b] — tương đương rand(a,b) của SC
    chance(p) { return this.next() < p; }
    pick(arr) { return arr[Math.floor(this.next() * arr.length)]; }
    sign() { return this.next() < 0.5 ? -1 : 1; }
    state() { return this.s.slice(); }                          // để test so sánh
}

function rngWorld(seed, levelIdx) { return new Rng(rngHash(rngSeedOf(seed) ^ Math.imul(levelIdx + 1, 0x27D4EB2F))); }
function rngPlayFor(seed) { return new Rng(rngHash(rngSeedOf(seed) ^ 0x51ED270B)); }
function rngFxFor(seed) { return new Rng(rngHash(rngSeedOf(seed) ^ 0x1B873593)); }
// Làm tròn ngẫu nhiên (rung màn hình): 0.4 -> 0 hoặc 1 (xác suất 40%) — dùng dòng hình/âm
function stochRound(m, r) { const t = Math.trunc(m), f = Math.abs(m - t); return t + ((r || game.rngFx).next() < f ? Math.sign(m) : 0); }

    <script>
// 03_input — bàn phím qua lớp trừu tượng theo "hành động" (KEYMAP ở 01_config). Giữ nguyên từ dự án Metroidvania; chỉ đổi khoá lưu + tuỳ chọn (autoRun thay djOnJump).
//   inp.held('jump')     đang giữ
//   inp.pressed('jump')  vừa bấm xuống trong bước vật lý này
//   inp.released('jump') vừa thả trong bước này
// Cạnh bấm/thả được giữ lại cho tới khi một bước vật lý chạy xong (inp.endStep) => không mất phím khi màn hình 144Hz.
// Đổi phím (GĐ4): inp.bind / inp.unbind / inp.reset sửa KEYMAP tại chỗ rồi lưu localStorage ('mvGD4_controls_v1'); menu Esc ở 14_menu.
//   inp.lock(true) khi mở menu: bỏ qua phím cho game (menu tự nghe keydown). inp.name/label/fill dùng để hiện tên phím trong chữ hướng dẫn.
// Tay cầm: 03a_gamepad.js (phát lại thành phím nên dùng chung lớp này). Cảm ứng: chưa làm.

const INP_STORE = 'spGD2_controls_v6';          // v6 (v0.44): bố trí mới — Shift chạy · E lướt · R dùng đồ phụ · Tab / lăn chuột đổi đồ phụ. (v5 cũ:   // v2: bố trí Q W E R 1 2 · v4 (H2): bố trí PlayStation Q=X W=Tròn E=Vuông R=Tam giác · v5 (v0.12): bỏ Shift / Space / C (đổi khoá để phím đã lưu ở v4 không mang Shift/Space/C trở lại)         // khoá riêng cho dự án này (không lẫn với phím của Metroidvania)
const INP_STORE_OLD = 'spGD2_controls_v5';   // bản lưu trước v0.12: chỉ lấy lại các tuỳ chọn (autoRun, fit…), KHÔNG lấy phím và không lấy tay cầm (mặc định nay là bật)
const INP_MAX_KEYS = 3;                       // số phím tối đa mỗi hành động

const inp = (() => {
    const down = new Set(), pressedE = new Set(), releasedE = new Set();
    const gameCodes = new Set();
    let locked = false;
    const rebuild = () => { gameCodes.clear(); for (const k in KEYMAP) KEYMAP[k].forEach(c => gameCodes.add(c)); };
    rebuild();
    const isField = e => e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA');

    window.addEventListener('keydown', e => {
        if (isField(e) || locked) return;
        if (gameCodes.has(e.code)) e.preventDefault();
        if (e.repeat) return;
        if (!down.has(e.code)) pressedE.add(e.code);
        down.add(e.code);
    });
    window.addEventListener('keyup', e => {
        if (isField(e) || locked) return;
        if (down.has(e.code)) releasedE.add(e.code);
        down.delete(e.code);
    });
    window.addEventListener('blur', () => { down.clear(); pressedE.clear(); });
    // Lăn chuột = phím giả 'WheelUp' / 'WheelDown' (bấm + thả trong cùng một bước); giãn 120 ms để bàn rê chuột không nhảy nhiều món
    let wheelAt = 0;
    window.addEventListener('wheel', e => {
        if (locked || isField(e) || !e.deltaY) return;
        const code = e.deltaY > 0 ? 'WheelDown' : 'WheelUp';
        if (!gameCodes.has(code)) return;
        e.preventDefault(); const now = performance.now(); if (now - wheelAt < 120) return; wheelAt = now;
        pressedE.add(code); releasedE.add(code);
    }, { passive: false });

    const any = (set, action) => KEYMAP[action].some(c => set.has(c));
    const clear = () => { down.clear(); pressedE.clear(); releasedE.clear(); };

    // ---- Tên phím để hiển thị ----
    const NAMES = { ArrowLeft: '←', ArrowRight: '→', ArrowUp: '↑', ArrowDown: '↓', Space: 'Space', ShiftLeft: 'Shift', ShiftRight: 'Shift phải', Enter: 'Enter',
        Backspace: 'Backspace', Delete: 'Delete', Comma: ',', Period: '.', Slash: '/', Semicolon: ';', Quote: "'", Minus: '-', Equal: '=', Backslash: '\\', Backquote: '`' };
    const name = code => {
        if (NAMES[code]) return NAMES[code];
        let m = /^Key([A-Z])$/.exec(code); if (m) return m[1];
        m = /^Digit(\d)$/.exec(code); if (m) return m[1];
        m = /^Numpad(\w+)$/.exec(code); if (m) return 'Num' + m[1];
        return code;
    };
    // Các phím của hành động (tối đa n), nối bằng sep; chưa gán thì "(chưa gán)"
    // raw = true: luôn trả tên PHÍM (menu Đổi phím cần thấy phím thật); mặc định: đang dùng tay cầm thì trả tên nút PlayStation (GPAD.names, 03a_gamepad)
    const label = (action, n, sep, raw) => {
        if (!raw && typeof GPAD !== 'undefined' && GPAD.on && GPAD.names && GPAD.names[action]) return GPAD.names[action];
        const a = (KEYMAP[action] || []).slice(0, n || 2); return a.length ? a.map(name).join(sep || '/') : '(chưa gán)';
    };
    // Thay {hành_động} trong chữ hướng dẫn bằng tên phím thật
    const fill = str => str.replace(/\{(\w+)\}/g, (m, k) => KEYMAP[k] ? label(k, 2, ' hoặc ') : m);

    // ---- Đổi phím ----
    // Trả về lý do không gán được (chuỗi) hoặc null nếu gán được
    const bindReason = code => {
        if (!code || typeof code !== 'string') return 'Phím không hợp lệ';
        if (code === 'Escape') return 'Esc dùng để mở/đóng menu';
        if (code === 'ContextMenu' || code === 'CapsLock' || /^F\d+$/.test(code) || /^(Control|Alt|Meta|OS)/.test(code)) return name(code) + ' không gán được (trình duyệt dùng)';
        if (KEY_DEBUG_CODES.indexOf(code) >= 0) return name(code) + ' dành cho phím debug';
        return null;
    };
    const actionOf = id => KEY_ACTIONS.find(a => a.id === id);
    const save = () => {
        try { localStorage.setItem(INP_STORE, JSON.stringify({ keys: KEYMAP, autoRun: SETTINGS.autoRun, fit: SETTINGS.fit, shake: SETTINGS.shake, pad: SETTINGS.pad, assist: SETTINGS.assist, easy: SETTINGS.easy, dda: SETTINGS.dda })); } catch (e) { /* không có localStorage: bỏ qua */ }
    };
    const load = () => {
        try {
            let raw = localStorage.getItem(INP_STORE), old = false;
            if (!raw) { raw = localStorage.getItem(INP_STORE_OLD); old = true; if (!raw) return; }          // bản lưu cũ (trước H2): bỏ phím + tay cầm, giữ tuỳ chọn khác
            const d = JSON.parse(raw);
            if (!old) for (const a of KEY_ACTIONS) {
                const v = d.keys && d.keys[a.id]; if (!Array.isArray(v)) continue;
                const ok = v.filter((c, i) => typeof c === 'string' && !bindReason(c) && v.indexOf(c) === i).slice(0, INP_MAX_KEYS);
                if (ok.length || !a.need) KEYMAP[a.id] = ok;
            }
            if (typeof d.autoRun === 'boolean') SETTINGS.autoRun = d.autoRun;
            if (typeof d.fit === 'boolean') SETTINGS.fit = d.fit;
            if (typeof d.shake === 'boolean') SETTINGS.shake = d.shake;
            if (!old && typeof d.pad === 'boolean') SETTINGS.pad = d.pad;
            if (typeof d.assist === 'boolean') SETTINGS.assist = d.assist;
            if (typeof d.easy === 'boolean') SETTINGS.easy = d.easy;
            if (typeof d.dda === 'boolean') SETTINGS.dda = d.dda;
            rebuild();
        } catch (e) { /* dữ liệu hỏng: dùng mặc định */ }
    };
    // Gán `code` vào ô `slot` (0..2) của hành động. Phím đang thuộc hành động khác thì chuyển sang đây (trừ khi đó là phím duy nhất của hành động bắt buộc).
    // Trả về {ok, msg}
    const bind = (action, slot, code) => {
        const why = bindReason(code); if (why) return { ok: false, msg: why };
        const arr = KEYMAP[action]; if (!arr || slot < 0 || slot >= INP_MAX_KEYS) return { ok: false, msg: 'Ô không hợp lệ' };
        let moved = '';
        for (const a of KEY_ACTIONS) {
            if (a.id === action) continue;
            if (KEYMAP[a.id].indexOf(code) >= 0 && a.need && KEYMAP[a.id].length <= 1) return { ok: false, msg: name(code) + ' là phím duy nhất của "' + a.label + '"' };
        }
        for (const a of KEY_ACTIONS) {
            if (a.id === action) continue;
            const i = KEYMAP[a.id].indexOf(code); if (i >= 0) { KEYMAP[a.id].splice(i, 1); moved = a.label; }
        }
        const j = arr.indexOf(code);
        if (j >= 0 && j !== slot) { arr.splice(j, 1); if (j < slot) slot--; }
        if (slot < arr.length) arr[slot] = code; else arr.push(code);
        rebuild(); clear(); save();
        return { ok: true, msg: moved ? 'Đã chuyển ' + name(code) + ' từ "' + moved + '"' : '' };
    };
    const unbind = (action, slot) => {
        const arr = KEYMAP[action], a = actionOf(action);
        if (!arr || slot < 0 || slot >= arr.length) return { ok: false, msg: '' };
        if (a && a.need && arr.length <= 1) return { ok: false, msg: 'Cần ít nhất 1 phím cho "' + a.label + '"' };
        arr.splice(slot, 1); rebuild(); clear(); save();
        return { ok: true, msg: '' };
    };
    const reset = () => { for (const k in KEYMAP_DEFAULT) KEYMAP[k] = KEYMAP_DEFAULT[k].slice(); SETTINGS.autoRun = false; SETTINGS.fit = true; SETTINGS.shake = true; SETTINGS.pad = true; rebuild(); clear(); save(); resizeCanvas(); };

    load();
    return {
        held: a => any(down, a),
        pressed: a => any(pressedE, a),
        released: a => any(releasedE, a),
        heldCodes() { return [...down]; },          // để hiển thị trong debug (kiểm tra phím bị 'ghosting')
        axisX() { return (any(down, 'right') ? 1 : 0) - (any(down, 'left') ? 1 : 0); },
        endStep() { pressedE.clear(); releasedE.clear(); },
        clear,
        lock(on) { locked = !!on; clear(); },        // mở menu: game không nhận phím
        get locked() { return locked; },
        name, label, fill, bindReason, bind, unbind, reset, save, load
    };
})();

// 03a_gamepad — TAY CẦM (Gamepad API; Giai đoạn 8, lần 16).
//   Cách làm: mỗi khung hình đọc navigator.getGamepads() rồi PHÁT LẠI thành sự kiện bàn phím (keydown/keyup) lên window. Nhờ vậy mọi thứ có sẵn dùng được ngay:
//   phím đã đổi trong menu Esc vẫn đúng (tay cầm gửi phím ĐẦU TIÊN của hành động), menu/tiêu đề/bản đồ/màn hình kết thúc nghe cùng sự kiện như bàn phím.
//   Chơi (H2, bố cục PlayStation; chỉ số nút chuẩn 0=X 1=Tròn 2=Vuông 3=Tam giác):
//          X = Nhảy (↓ + X xuyên bục) · Tròn = Chém / ném (↑ + Tròn chém lên hoặc mở thùng, ↓ + Tròn nhặt / đặt, trên không ↓ + Tròn chém xuống nảy)
//          Vuông = GIỮ + hướng chạy nhanh, CHẠM nhanh lướt (khi đã học) · Tam giác = đổi trang bị kiếm → bom → dây · L1/R1/L2/R2 = chạy nhanh phụ (chạm cũng lướt)
//          cần trái hoặc D-pad = đi / leo / ngồi
//          Start = menu (Esc) · Back/Select = bản đồ (Tab)
//   Trong menu / tiêu đề / bản đồ / kết thúc:  cần/D-pad = ←↑→↓ · A = Enter · B = Esc · X = Backspace (xoá phím) · Start = Esc · Back = Tab
//   Rung tay cầm: ĐÃ TẮT (A16, v0.9): gpadRumble còn đó nhưng fxShake không gọi nữa.
//   Dùng hệ nút CHUẨN (mapping 'standard'); tay cầm lạ vẫn thử theo cùng chỉ số. Tắt hẳn: SETTINGS.pad = false (menu Esc, hàng "Tay cầm").
//   Hàm kiểm thử: gpadPoll(pads) nhận mảng giả tay cầm; gpadSend có thể thay để bắt sự kiện.

const GPAD = {
    dead: 0.5,                                    // cần gạt quá ngưỡng này mới tính là bấm
    // chỉ số nút chuẩn -> { play: hành động khi chơi, menu: mã phím khi đang ở menu/màn hình phụ, code: mã phím cố định cho cả hai }
    btn: {      // PlayStation (v0.44): X nhảy · Tròn kiếm / nhặt (↓) / ném · Vuông lướt (↓ = huýt sáo) · Tam giác dùng đồ phụ · L1 / L2 đổi đồ phụ · R1 / R2 chạy (giữ)
        0: { play: 'jump', menu: 'Enter' }, 1: { play: 'attack', menu: 'Escape' }, 2: { play: 'dash', menu: 'Backspace' }, 3: { play: 'item', menu: null },
        4: { play: 'swap', menu: null }, 5: { play: 'run', menu: null }, 6: { play: 'swapBack', menu: null }, 7: { play: 'run', menu: null },
        9: { code: 'Escape' },
        12: { play: 'up', menu: 'ArrowUp' }, 13: { play: 'down', menu: 'ArrowDown' }, 14: { play: 'left', menu: 'ArrowLeft' }, 15: { play: 'right', menu: 'ArrowRight' }
    },
    axis: { 'ax0-': { play: 'left', menu: 'ArrowLeft' }, 'ax0+': { play: 'right', menu: 'ArrowRight' }, 'ax1-': { play: 'up', menu: 'ArrowUp' }, 'ax1+': { play: 'down', menu: 'ArrowDown' } },
    names: { jump: 'X', attack: 'Tròn', dash: 'Vuông', item: 'Tam giác', run: 'R1', swap: 'L1', swapBack: 'L2' },      // tên nút để hiện trong chữ hướng dẫn khi đang dùng tay cầm (inp.label, 03_input)
    src: {},                                      // nguồn đang giữ: id nguồn -> mã phím đã gửi (để thả đúng mã dù ngữ cảnh đổi giữa chừng)
    count: {},                                    // mã phím -> số nguồn đang giữ nó (cần gạt + D-pad cùng hướng không thả sớm)
    name: '', on: false                           // tên tay cầm đang dùng ('' = chưa có), có dữ liệu ở khung vừa rồi
};

function gpadSend(type, code) {
    try { window.dispatchEvent(new KeyboardEvent(type, { code: code, key: code, bubbles: true, cancelable: true })); } catch (e) { /* trình duyệt không cho tạo sự kiện: bỏ qua */ }
}
// Ngữ cảnh menu = đang ở menu Esc / tiêu đề / bản đồ / màn hình kết thúc (game đứng hình, phím đi tới các trình nghe riêng)
function gpadMenuMode() { return typeof game !== 'undefined' && !!(game.menu || game.title || game.map || game.endScr); }
function gpadCodeFor(def, menu) {
    if (!def) return null;
    if (def.code) return def.code;
    if (menu) return def.menu || null;
    const a = KEYMAP[def.play]; return a && a.length ? a[0] : null;
}
function gpadPress(id, code) { GPAD.src[id] = code; if ((GPAD.count[code] = (GPAD.count[code] || 0) + 1) === 1) gpadSend('keydown', code); }
function gpadRelease(id) {
    const code = GPAD.src[id]; if (code === undefined) return;
    delete GPAD.src[id];
    if ((GPAD.count[code] = (GPAD.count[code] || 1) - 1) <= 0) { delete GPAD.count[code]; gpadSend('keyup', code); }
}
function gpadReleaseAll() { for (const id of Object.keys(GPAD.src)) gpadRelease(id); }
// Chọn tay cầm đầu tiên đang nối
function gpadPick(pads) {
    if (!pads) return null;
    for (let i = 0; i < pads.length; i++) { const p = pads[i]; if (p && p.connected !== false && p.buttons && p.buttons.length >= 4) return p; }
    return null;
}
// Mỗi khung: `pads` mặc định lấy từ navigator.getGamepads() (test truyền mảng giả)
function gpadPoll(pads) {
    if (pads === undefined) { try { pads = typeof navigator !== 'undefined' && navigator.getGamepads ? navigator.getGamepads() : null; } catch (e) { pads = null; } }
    const p = SETTINGS.pad === false ? null : gpadPick(pads);
    if (!p) { if (GPAD.on) gpadReleaseAll(); GPAD.on = false; GPAD.name = ''; return false; }
    GPAD.on = true; GPAD.name = String(p.id || 'Tay cầm').replace(/\s*\(.*$/, '').slice(0, 28);
    const menu = gpadMenuMode(), want = {};
    for (const k in GPAD.btn) { const b = p.buttons[k]; if (b && (b.pressed || b.value > 0.6)) want['b' + k] = GPAD.btn[k]; }
    const ax = p.axes || [], x = ax[0] || 0, y = ax[1] || 0;
    if (x < -GPAD.dead) want['ax0-'] = GPAD.axis['ax0-']; else if (x > GPAD.dead) want['ax0+'] = GPAD.axis['ax0+'];
    if (y < -GPAD.dead) want['ax1-'] = GPAD.axis['ax1-']; else if (y > GPAD.dead) want['ax1+'] = GPAD.axis['ax1+'];
    for (const id of Object.keys(GPAD.src)) if (!want[id]) gpadRelease(id);                      // thả trước, bấm sau (đổi hướng gọn)
    for (const id in want) { if (GPAD.src[id] !== undefined) continue; const code = gpadCodeFor(want[id], menu); if (code) gpadPress(id, code); }
    return true;
}
// Rung tay cầm (nếu có). mag 0..1, ms thời lượng
function gpadRumble(mag, ms) {
    if (SETTINGS.pad === false || SETTINGS.shake === false || !GPAD.on) return false;
    try {
        const pads = navigator.getGamepads(), p = gpadPick(pads), vib = p && p.vibrationActuator;
        if (vib && vib.playEffect) { vib.playEffect('dual-rumble', { duration: Math.round(clamp(ms, 40, 600)), strongMagnitude: clamp(mag, 0, 1), weakMagnitude: clamp(mag * 0.7, 0, 1) }); return true; }
    } catch (e) { /* không hỗ trợ rung */ }
    return false;
}
if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('gamepadconnected', e => { if (typeof uiToast === 'function' && SETTINGS.pad !== false) uiToast('Đã nhận tay cầm: ' + String((e.gamepad && e.gamepad.id) || '').replace(/\s*\(.*$/, '').slice(0, 28) + ' (bấm một nút để bắt đầu)'); });
    window.addEventListener('gamepaddisconnected', () => { gpadReleaseAll(); GPAD.on = false; GPAD.name = ''; });
    window.addEventListener('blur', () => gpadReleaseAll());
}

// 04_audio — âm thanh tổng hợp bằng Web Audio (KHÔNG có file âm thanh nào). Khối dựng âm (nhiễu, bao biên độ, tông, tiếng ồn lọc) lấy ý tưởng từ audio.js của DiabloLike/CozyWorld, viết lại cho game này.
//   Mỗi hiệu ứng = một hàm (ac, out, t, p) dựng nút âm thanh trên AudioContext bất kỳ (p = hệ số cao độ). Nhờ vậy test dựng được bằng OfflineAudioContext hoặc ngữ cảnh giả (tools/test_headless.js).
//   Phát: sndPlay('tên', { x: toạ độ thế giới (giảm âm theo khoảng cách tới người chơi + lệch trái/phải), vol, p }). Không có AudioContext (test Node) hoặc chưa được phép phát thì không làm gì.
//   Trình duyệt chỉ cho phát sau cử chỉ người dùng: AudioContext tạo ở lần bấm phím / chạm đầu tiên (sndUnlock). Âm lượng + tắt tiếng chỉnh ở menu Esc, lưu localStorage riêng (SND_STORE), không nằm chung với phím.
//   Mỗi tiếng có thời lượng tối đa, khoảng cách tối thiểu giữa 2 lần phát (tránh dồn tiếng khi nhiều quái cùng làm một việc) và giới hạn số giọng đồng thời.
//   Bước 8: SND_TUNE (bảng chỉnh âm từ tools/sound_tuner.html); hàm sndTone / sndNoise là lớp bọc áp hệ số chỉnh, bản dựng thật là sndToneRaw / sndNoiseRaw.
//   Tiếng của đòn quái luôn phát ĐÚNG lúc bắt đầu điềm báo (windup) rồi mới tới tiếng ra đòn — người chơi nghe được trước khi đòn tới.

const SND_STORE = 'mvGD7_audio_v1';
const SND = { master: 0.7, muted: false, music: 0.8 };       // music = âm lượng nhạc nền 0..1 (nhân vào MUS_VOL)              // master 0..1; muted = tắt tiếng hoàn toàn
const SND_MAX_VOICES = 28, SND_HEAR = 15 * TILE;        // số giọng tối đa cùng lúc; xa hơn SND_HEAR px (so với người chơi) thì không nghe
let sndCtx = null, sndMaster = null;
const sndStats = { played: {}, dropped: 0, state: 'none', err: null };
const _sndLast = {}, _sndEnds = [];

(function sndLoad() {
    try {

        case 'chirp': for (let i = 0; i < 3; i++) { sndNoise(ac, g, t + i * 0.07, { type: 'highpass', f: 4200, q: 0.8, dur: 0.04, vol: 0.05 }); sndTone(ac, g, t + i * 0.07, { f: 4300, dur: 0.04, vol: 0.015 }); } break;
        case 'pulse': sndTone(ac, g, t, { f: musMidi(musFloor(Z.root - 12)), f2: musMidi(musFloor(Z.root - 14)), dur: 0.38, vol: 0.2, type: 'sawtooth', lp: 320 }); if (r < 0.35) sndTone(ac, g, t + 0.3, { f: musMidi(musFloor(Z.root - 12 + Z.scale[1])), dur: 0.25, vol: 0.12, type: 'sawtooth', lp: 320 }); break;
        case 'stab': sndTone(ac, g, t, { f: musMidi(Z.root + 24), dur: 0.35, vol: 0.05, type: 'sawtooth', lp: 1600 }); sndTone(ac, g, t, { f: musMidi(Z.root + 30), dur: 0.35, vol: 0.04, type: 'sawtooth', lp: 1600 }); break;
    }
    MUS.n++;
}

// Gọi mỗi khung hình
function musStep() {
    if (!sndOn()) return;
    const ac = sndCtx, now = ac.currentTime, want = musZoneFor();
    while (MUS.old.length && MUS.old[0].until <= now) MUS.old.shift();
    if (MUS.zone !== want) {
        if (MUS.bus) musFadeOut(MUS.bus);
        MUS.bus = musBuild(want); MUS.zone = want; sndLogMusic(musLabel(want));
    }
    const b = MUS.bus, Z = MUS_ZONES[want];
    if (MUS_STYLE[want]) { musStyleStep(b, now); return; }          // lần 49: phong cách CozyWorld tự lên lịch
    Z.ev.forEach((e, i) => {
        if (b.nx[i] < now - 1) b.nx[i] = now + 0.2;                             // lịch tụt quá xa (tab ẩn…): đặt lại, không dồn tiếng
        let guard = 0;
        while (b.nx[i] < now + 0.5 && guard++ < 8) { musEvent(b, e, Math.max(b.nx[i], now + 0.01)); b.nx[i] += e.gap[0] + musRand() * (e.gap[1] - e.gap[0]); }
    });
}

// Hoạt ảnh hero (GĐ7): mỗi tên = một dải ngang n khung fw×fh trong assets/sprites/<img>.png. Do tools/gen_hero_frames.py sinh từ sprite gốc — GIỮ ĐỒNG BỘ số khung/kích thước ở hai nơi.
//   Chân ở hàng cuối khung, tâm hitbox ở cột giữa (Player.blitFrame). Chưa nạp xong ảnh thì Player.draw dùng sprite tĩnh cũ.
const HERO_ANIMS = {
    idle: { img: 'hero_a_idle', fw: 32, fh: 34, n: 4 }, run: { img: 'hero_a_run', fw: 32, fh: 34, n: 6 },
    jump: { img: 'hero_a_jump', fw: 32, fh: 34, n: 3 }, fall: { img: 'hero_a_fall', fw: 32, fh: 34, n: 2 }, hurt: { img: 'hero_a_hurt', fw: 32, fh: 34, n: 1 },
    slash: { img: 'hero_a_slash', fw: 48, fh: 34, n: 4 }, slashUp: { img: 'hero_a_slashup', fw: 32, fh: 46, n: 3 }, dash: { img: 'hero_a_dash', fw: 40, fh: 36, n: 4 }
};

const assets = { img: {}, white: {} };

function assetLoad() {
    if (typeof Image === 'undefined') return;                  // môi trường không có ảnh (test Node): dùng hình dự phòng
    for (const name in ASSET_DATA) {
        const im = new Image();
        im.onload = () => {
            assets.img[name] = im;
            const c = makeCanvas(im.width, im.height), g = c.getContext('2d');
            g.drawImage(im, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = '#ffffff'; g.fillRect(0, 0, im.width, im.height);
            assets.white[name] = c;
        };
        im.src = ASSET_DATA[name];
    }
}
function assetGet(name) { return assets.img[name] || null; }
function assetWhite(name) { return assets.white[name] || null; }
// v0.36: bóng đơn sắc (từ bóng trắng), có cache theo (tên, màu). Dùng cho bóng lướt. Chưa nạp xong ảnh thì null.
const _tintCache = {};
function assetTint(name, col) {
    const w = assets.white[name]; if (!w) return null;
    const k = name + '|' + col; if (_tintCache[k]) return _tintCache[k];
    const c = makeCanvas(w.width, w.height), g = c.getContext('2d');
    g.drawImage(w, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = col; g.fillRect(0, 0, w.width, w.height);
    return (_tintCache[k] = c);
}
assetLoad();

// 06_render — canvas, phóng vừa màn hình, camera (bám sát + nhìn lên/xuống), vẽ ô (bộ nhớ đệm THEO KHỐI 10×8 ô, vẽ lại cục bộ khi đất bị phá), nền, hạt, chữ, HUD
// Hình là hình tạm; nghệ thuật thật ở GĐ8.

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });   // nền luôn phủ kín => không cần kênh alpha (nhẹ hơn khi ghép trang)
ctx.imageSmoothingEnabled = false;
const view = { scale: 1 };

// Lớp HUD (GĐ8): canvas thứ hai nằm đè lên canvas game, có độ phân giải = độ phân giải THẬT của màn hình (không phải 320×240), dùng cho chữ và bản đồ → chữ nét, đọc được dấu tiếng Việt.
// Mọi toạ độ vẫn tính theo đơn vị nội bộ (320×240); hudFlush đặt phép phóng k = view.scale rồi vẽ. Không có lớp này (test Node, trình duyệt lạ) thì drawText vẽ thẳng lên canvas game như trước.
const hudCv = document.getElementById('hud'), hudCtx = hudCv && hudCv.getContext ? hudCv.getContext('2d') : null;
const TEXT = { q: [], size: 8.6, font: '"Segoe UI", "Noto Sans", "Helvetica Neue", Roboto, Arial, sans-serif' };

function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const raw = Math.min(window.innerWidth * dpr / VIEW_W, window.innerHeight * dpr / VIEW_H);
    // SETTINGS.fit (mặc định BẬT): phóng vừa khít màn hình (có thể lẻ); TẮT: số nguyên khi đủ chỗ (từng pixel đều nhau, nhưng chừa viền)
    const s = (!SETTINGS.fit && raw >= 1) ? Math.floor(raw) : raw;
    view.scale = s;
    canvas.style.width = (VIEW_W * s / dpr) + 'px';
    canvas.style.height = (VIEW_H * s / dpr) + 'px';
    if (hudCv && hudCtx) { hudCv.width = Math.max(1, Math.round(VIEW_W * s)); hudCv.height = Math.max(1, Math.round(VIEW_H * s)); }
}

// ---- Camera ----
// Bám sát người chơi (SC) với vùng chết nhỏ CAM.deadX/deadY, cộng độ dịch nhìn lên/xuống (player.look). Kẹp trong level.
// cx, cy: tâm "logic"; x, y: góc trên-trái đã làm mượt; px, py: bước trước (nội suy khi vẽ)
const cam = { x: 0, y: 0, px: 0, py: 0, cx: 0, cy: 0, look: 0 };

function camClampCenter(level) {
    cam.cx = level.pw <= VIEW_W ? level.pw / 2 : clamp(cam.cx, VIEW_W / 2, level.pw - VIEW_W / 2);
    cam.cy = level.ph <= VIEW_H ? level.ph / 2 : clamp(cam.cy, VIEW_H / 2, level.ph - VIEW_H / 2);
}
function camSnap(level, t) {
    cam.cx = t.x + t.w / 2; cam.cy = t.y + t.h / 2 + (t.look || 0);
    camClampCenter(level);
    cam.x = cam.px = cam.cx - VIEW_W / 2; cam.y = cam.py = cam.cy - VIEW_H / 2;
}
function camUpdate(level, t, dt) {
    cam.px = cam.x; cam.py = cam.y;
    const fx = t.x + t.w / 2, fy = t.y + t.h / 2 + (t.look || 0);
    if (fx < cam.cx - CAM.deadX) cam.cx = fx + CAM.deadX; else if (fx > cam.cx + CAM.deadX) cam.cx = fx - CAM.deadX;
    if (fy < cam.cy - CAM.deadY) cam.cy = fy + CAM.deadY; else if (fy > cam.cy + CAM.deadY) cam.cy = fy - CAM.deadY;
    camClampCenter(level);
    const k = 1 - Math.exp(-CAM.smooth * dt);
    cam.x = cam.cx - VIEW_W / 2;      // lần 49: ngang bám CỨNG trong vùng chết — trước đây làm mượt ngang gây trễ rồi "trượt" thêm khi người chơi dừng lại
    cam.y += (cam.cy - VIEW_H / 2 - cam.y) * k;
}

// ---- Vẽ ----
// Canvas ẩn dùng lại (cache): bầu trời và toàn bộ ô của phòng vẽ MỘT lần, mỗi khung chỉ chép lại (drawImage)
// thay vì ~2000 lệnh fillRect. Pixel y hệt cách vẽ trực tiếp (xem paintTiles). Kỹ thuật cache chi tiết hơn: Giai đoạn 3.
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

const _skyCache = new Map();
function skyFor(theme) {
    let c = _skyCache.get(theme);
    if (!c) {
        c = makeCanvas(VIEW_W, VIEW_H);
        const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, VIEW_H);
        gr.addColorStop(0, theme.sky[0]); gr.addColorStop(1, theme.sky[1]); g.fillStyle = gr; g.fillRect(0, 0, VIEW_W, VIEW_H);
        _skyCache.set(theme, c);
    }
    return c;
}
// Nền theo theme của phòng: bầu trời (cache) + 3 lớp parallax cuộn chậm hơn camera
function drawBackground(cx, cy, room) {
    const th = (room && room.theme) || THEMES.cave;
    if (th.style === 'mines') { drawBackWall(cx, cy, th); return; }
    ctx.drawImage(skyFor(th), 0, 0);
    for (const L of th.layers) {

// 06b_backdrop — HÌNH NỀN XA THEO VÙNG (lần 18): các lớp parallax của THEMES có thêm `kind` ngoài 'tri' (núi) và 'col' (cột):
//   pine = cây thông · bush = bụi cây · hang = nhũ đá treo từ trần · vine = dây leo rủ · shroom = nấm khổng lồ · ruin = cột đền (có cột gãy) · spire = tháp pha lê · cluster = chùm thạch anh nghiêng.
//   drawBackground (06_render) gọi drawBackdropShape cho kind lạ; trả false thì rơi về 'col' cũ. Mỗi hình chỉ là vài đa giác/hình chữ nhật cùng một màu L.col (bóng đổ xa), vẽ mỗi khung như hai kiểu cũ.
//   Hình dạng/cao thấp lấy theo chỉ số cột i qua hash1 → cố định, không nhấp nháy khi cuộn. Hình mọc từ đáy (y = đỉnh hình, kéo xuống VIEW_H) trừ hang/vine treo từ trần (y = 0).
// Một hoặc nhiều đa giác trong MỘT đường vẽ và MỘT lệnh fill (ít lệnh canvas hơn mỗi khung so với mỗi đa giác một fill)
function _bdPolys(g, polys) { g.beginPath(); for (const pts of polys) { g.moveTo(Math.round(pts[0][0]), Math.round(pts[0][1])); for (let k = 1; k < pts.length; k++) g.lineTo(Math.round(pts[k][0]), Math.round(pts[k][1])); g.closePath(); } g.fill(); }
// g: canvas để vẽ (mặc định ctx của game; test truyền bộ ghi lệnh vào)
function drawBackdropShape(L, x, y, h, i, g) {
    g = g || ctx; const w = L.w, b = VIEW_H, n = k => hash1(i * 7.3 + w * 1.7 + k * 3.1);
    switch (L.kind) {
        case 'pine': {                              // thông 3 tầng trên thân thẳng
            const cx = x + w / 2, th = h * 0.62;
            g.fillRect(Math.round(cx - 1), Math.round(y + h * 0.5), 3, b);
            const tiers = []; for (let t = 0; t < 3; t++) { const ty = y + t * th * 0.3, hw = w * (0.24 + 0.13 * t); tiers.push([[cx, ty], [cx - hw, ty + th * 0.42], [cx + hw, ty + th * 0.42]]); }

        }
        case 'bush': {                              // bụi tròn

            g.fillRect(Math.round(x + w * 0.1), Math.round(y + h * 0.3), Math.round(w * 0.8), b);
            g.fillRect(Math.round(x), Math.round(y + h * 0.6), Math.round(w), b);
            return true;
        }
        case 'hang': {                              // nhũ đá treo từ trần (hai mũi)
            const len = L.amp * (0.3 + 0.7 * n(1));
            _bdPolys(g, [[[x, 0], [x + w * 0.7, 0], [x + w * 0.35, len]], [[x + w * 0.7, 0], [x + w, 0], [x + w * 0.85, len * 0.5]]]);

        }
        case 'vine': {                              // dây leo rủ có lá

        }
        case 'spire': {                             // tháp pha lê lục giác + một mũi phụ
            _bdPolys(g, [[[x + w * 0.5, y], [x + w * 0.82, y + h * 0.28], [x + w * 0.82, b], [x + w * 0.18, b], [x + w * 0.18, y + h * 0.28]], [[x + w * 0.95, y + h * 0.45], [x + w * 1.15, y + h * 0.62], [x + w * 1.15, b], [x + w * 0.75, b], [x + w * 0.75, y + h * 0.62]]]);
            return true;

        case 'cluster': {                           // ba tinh thể nghiêng xoè quạt

            _bdPolys(g, cs);
            return true;
        }
    }
    return false;
}

// 06c_sprites — vẽ CHI TIẾT nửa-pixel (lần 25). Canvas bên trong nay gấp RES=2 lần 320×240 nên mỗi pixel logic = 2×2 điểm; các hàm vẽ nhân vật/quái dùng "hp" = nửa pixel
//   (đơn vị 0.5 px) để có viền tối, đổ bóng, mắt có tròng… Hitbox và vật lý KHÔNG đổi. Tất cả vẽ bằng fillRect (không file ảnh).
//   hpMaker(ctx, cx, bottomY, facing) → q(dx, dy, w, h, màu) với dx tính từ TÂM (hp, dương = phía trước mặt), dy từ ĐÁY (âm = lên trên); lật theo hướng nhìn.

function hpPart(q, dx, dy, w, h, c, o) { q(dx - 1, dy - 1, w + 2, h + 2, o || SPR_OUT); q(dx, dy, w, h, c); }

// ----- Người chơi -----

// ----- Công chúa + thú cưng -----
// 3 chấm máu của thú cưng (còn mấy lần ném): đỏ = còn, xám = hết
function petHpDots(ctx, e, cx, y) {
    const n = e.maxHp || 3, x0 = Math.round(cx - (n * 4 - 1) / 2);
    for (let i = 0; i < n; i++) { ctx.fillStyle = '#10101a'; ctx.fillRect(x0 + i * 4 - 1, y - 1, 4, 4); ctx.fillStyle = i < e.hp ? '#ff4a6a' : '#4a4a58'; ctx.fillRect(x0 + i * 4, y, 2, 2); }
}
function drawPrincessHp(e, ctx, alpha) {
    if (e.blinkT > 0 && Math.floor(e.blinkT * 20) % 2) return;

    for (let i = 0; i < 5; i++) { qq(-9 + i * 4, -15, 2, 2, '#ffffff'); qq(-7 + i * 4, -13, 2, 1, '#ffffff'); }                       // răng
    qq(-7, -13 - open, 3, 2, '#ffe14a'); qq(3, -13 - open, 3, 2, '#ffe14a'); qq(-6, -13 - open, 1, 1, '#1a1220'); qq(4, -13 - open, 1, 1, '#1a1220');   // mắt vàng trên nắp
}

// ---- Vật thưởng phòng ẩn (13t_relic): mảnh tim (nửa trái trái tim vỡ, vàng hồng, lấp lánh) · đồ (bình đồ phụ hoặc kiếm hệ), nhấp nhô nhẹ ----
function drawRelicHp(e, ctx, a) {

    if (e.type === 'shard') {

        q(5, 5, 4, 2, '#ffc0d4'); q(5, 5, 2, 1, '#ffffff'); q(12, 9, 2, 5, '#c0345e'); q(10, 15, 3, 3, '#c0345e'); q(9, 19, 3, 1, '#c0345e');
        q(13, 8, 1, 1, '#ffe08a'); q(14, 12, 1, 1, '#ffe08a'); q(12, 17, 1, 1, '#ffe08a');                   // vàng ở mép vỡ
        if (s === 0) { q(17, 3, 1, 3, '#fff3b0'); q(16, 4, 3, 1, '#fff3b0'); } else if (s === 2) { q(1, 14, 1, 3, '#fff3b0'); q(0, 15, 3, 1, '#fff3b0'); }
    } else if (e.pick && e.pick.blade) {
        bladeDraw((cx, cy, c) => q(cx, cy, 1, 1, c), e.pick.blade, 24);
    } else {

        U([[4, 8, 16, 11], [6, 6, 12, 15], [8, 19, 8, 2]], c); q(6, 10, 3, 6, '#ffffff'); q(14, 12, 3, 6, bladeShade(c, -0.3)); q(7, 15, 10, 1, bladeShade(c, 0.45));
    }

}

// 07a_level — Level: một khối bản đồ liền (thay Room của dự án cũ; KHÔNG có chuyển phòng).
//   Kích thước = LVL.w × LVL.h ô (42×34: 40×32 bên trong + viền đá cứng 1 ô). Toạ độ px: (0,0) = góc trên-trái viền.
//   tiles: Uint8Array loại ô (01_config: T_*) · rope: Uint8Array lớp dây (1 = ô có dây, leo được như thang)
//   Đổi ô qua setTile()/breakAt(): đánh dấu khối vẽ "bẩn" để 06_render vẽ lại CỤC BỘ (roadmap 3.4), không dựng lại cả level.
//   Va chạm AABB với ô: physMove / moveX / moveY (giữ từ dự án cũ, thêm đá cứng, bẫy, đất vàng; mặt trên thang = bục một chiều).

const CHUNK_W = 10, CHUNK_H = 8;       // khối vẽ = cỡ một phòng mẫu (160×128 px)

const DUST_COL = { mines: '#9a6a44', cave: '#8a97ad', forest: '#7a8f4e', deep: '#4f8f8a', ruins: '#9a8a6a', magma: '#8a5a48', crystal: '#9ad0e0', snow: '#e4f0fa', amethyst: '#9a78b8' };
class Level {
    // def = { id, name, theme, map: [chuỗi 40 ký tự × 32 dòng] } (TEST_LEVEL ở 02_data; GĐ2: bộ sinh level trả về cùng dạng)
    constructor(def) {
        this.def = def; this.id = def.id; this.name = def.name || def.id;
        this.themeName = def.theme || 'cave'; this.theme = THEMES[this.themeName] || THEMES.cave;
        this.ground = def.ground || this.theme.ground || null;
        const B = LVL.border, iw = def.map[0].length, ih = def.map.length;
        this.w = iw + 2 * B; this.h = ih + 2 * B; this.pw = this.w * TILE; this.ph = this.h * TILE;
        this.tiles = new Uint8Array(this.w * this.h).fill(T_HARD);
        this.rope = new Uint8Array(this.w * this.h);
        this.objs = []; this.traps = []; this.fx = []; this.pushes = []; this.crushers = []; this.hasLava = false; this.dark = def.dark || 0; this.arena = def.arena || null; this.arenaOpen = false; this.crumbles = []; this.springT = new Map(); this.hasWeb = false;      // pushes: các khối đẩy {c, r, fallT}
        this.spawn = { x: 2 * TILE, y: 2 * TILE }; this.exit = null; this.entry = null;
        this.chunksX = Math.ceil(this.w / CHUNK_W); this.chunksY = Math.ceil(this.h / CHUNK_H);
        this.dirty = new Set(); this.version = 0;          // khối cần vẽ lại (06_render đọc rồi xoá)
        for (let r = 0; r < ih; r++) for (let c = 0; c < iw; c++) {
            const ch = def.map[r][c], C = c + B, R = r + B;
            let t = TILE_CHARS[ch];
            if (t === undefined) {                        // ký tự đặt vật / quái: ô trống + ghi vào danh sách
                t = T_EMPTY; const kind = LVL_CHARS[ch];
                if (kind === 'start') { this.spawn = { x: C * TILE + TILE / 2, y: (R + 1) * TILE }; this.entry = { c: C, r: R }; }
                else if (kind === 'exit') this.exit = { c: C, r: R };
                else if (kind) { this.objs.push({ kind, c: C, r: R }); if (kind === 'eel') t = T_WATER; }          // v0.39: cá điện đặt trong nước => ô đó là nước
            }
            this.tiles[R * this.w + C] = t;
            if (t === T_CRUMBLE) this.crumbles.push({ c: C, r: R, st: 'idle', t: 0 });
            if (t === T_WEB) this.hasWeb = true;
            if (t === T_LAVA) this.hasLava = true;
            if (t === T_CRUSH) this.crushers.push({ c: C, r: R, hr: R, st: 'idle', t: 0 });
            if (t === T_PUSH) this.pushes.push({ c: C, r: R, fallT: -1, acc: 0 });
            if (t === T_ARROW) this.traps.push({ c: C, r: R, dir: ch === '>' ? 1 : -1, fired: false, range: 0 });
        }
        for (const tr of this.traps) tr.range = trapRange(this, tr);
    }
    inside(c, r) { return c >= 0 && r >= 0 && c < this.w && r < this.h; }
    tile(c, r) { return this.inside(c, r) ? this.tiles[r * this.w + c] : T_HARD; }
    isSolid(c, r) { return T_IS_SOLID[this.tile(c, r)]; }
    hasRope(c, r) { return this.inside(c, r) && this.rope[r * this.w + c] === 1; }
    inWater(e) {
        const c = Math.floor((e.x + e.w / 2) / TILE), r = Math.floor((e.y + e.h * 0.5) / TILE), t = this.tile(c, r);
        if (t === T_WATER) return true;
        if (t === T_LADDER && this.amt) { const k = r * this.w + c; return this.amtT[k] === 1 && this.amt[k] >= FLOW.thr; }      // thang ngập nước (lần 43)
        return false;
    }
    isClimb(c, r) { return this.tile(c, r) === T_LADDER || this.hasRope(c, r); }
    // Mặt trên thang: ô thang mà ô ngay trên KHÔNG phải thang => đứng lên được như bục một chiều (SC: oLadderTop)
    isLadderTop(c, r) { return this.tile(c, r) === T_LADDER && this.tile(c, r - 1) !== T_LADDER; }
    // Ô ở toạ độ px
    tileAt(x, y) { return this.tile(Math.floor(x / TILE), Math.floor(y / TILE)); }
    solidAt(x, y) { return this.isSolid(Math.floor(x / TILE), Math.floor(y / TILE)); }

    markDirty(c, r) {          // ô (c,r) đổi: khối chứa nó + khối kề (ô vẽ phụ thuộc hàng xóm, có phần treo/mọc sang ô bên cạnh)
        for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
            const cc = c + dc, rr = r + dr; if (!this.inside(cc, rr)) continue;
            this.dirty.add(Math.floor(rr / CHUNK_H) * this.chunksX + Math.floor(cc / CHUNK_W));
        }
        this.version++;
    }
    setTile(c, r, t) {
        if (!this.inside(c, r) || this.tiles[r * this.w + c] === t) return;
        this.tiles[r * this.w + c] = t; this.markDirty(c, r);
        if (typeof flowWake === 'function') flowWake(this, c, r);          // nước quanh ô vừa đổi thức dậy (13g_water)
    }
    // Phá ô (bom, cuốc…): trả về true nếu ô vỡ. Đá cứng không vỡ. Đất vàng rơi vàng. Bẫy vỡ thì bỏ khỏi danh sách bẫy.
    breakAt(c, r) {
        const t = this.tile(c, r);
        if (!T_BREAKABLE[t]) return false;
        this.setTile(c, r, T_EMPTY);
        const x = (c + 0.5) * TILE, y = (r + 0.5) * TILE;
        if (t === T_GOLD && typeof spawnGold === 'function') spawnGold(x, y, 1, 50);
        if (t === T_ARROW) this.traps = this.traps.filter(tr => tr.c !== c || tr.r !== r);
        if (t === T_GOLDBIG && typeof spawnGold === 'function') spawnGold(x, y, 1, 150);
        this.spawnBurst(x, y, 3, t === T_GOLD || t === T_GOLDBIG ? '#ffd24a' : t === T_STONE ? '#8a8a8e' : this.theme.solid[0], 90);
        return true;
    }
    // Ô không còn chỗ tựa (gai/thang treo lơ lửng sau khi nổ) thì vỡ theo — SC: gai không có đất bên dưới bị phá
    settleAfterBlast(c0, r0, c1, r1) {
        for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
            const t = this.tile(c, r);
            if (t === T_SPIKE && !this.isSolid(c, r + 1)) this.breakAt(c, r);
        }
    }

    // ---- Hạt hiệu ứng (dòng ngẫu nhiên hình/âm: game.rngFx) ----
    spawnDust(x, y, n, spread, up) {
        const R = game.rngFx, col = DUST_COL[this.themeName] || '#cfd6e6';      // lần 47: bụi ám màu nền của vùng (hầm mỏ = nâu)
        for (let i = 0; i < n; i++) this.fx.push({
            x: x + R.range(-3, 3), y, vx: R.range(-0.5, 0.5) * spread, vy: -R.next() * (up || 20),
            life: R.range(0.3, 0.5), max: 0.5, size: R.range(2, 4.5), col
        });
    }
    spawnBurst(x, y, n, col, speed) {
        const R = game.rngFx;
        for (let i = 0; i < n; i++) {
            const a = R.next() * TAU, v = speed * R.range(0.4, 1);
            this.fx.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 20, life: R.range(0.3, 0.5), max: 0.5, size: R.range(2, 4), col });
        }
    }
    updateFx(dt) {
        for (let i = this.fx.length - 1; i >= 0; i--) {
            const p = this.fx[i]; p.life -= dt;
            if (p.life <= 0) { this.fx.splice(i, 1); continue; }
            p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92;
            if (p.g) p.vy += p.g * dt;
        }
    }
}

// ---- Va chạm ----
// e.ignorePlat = true: bỏ qua bục một chiều + mặt trên thang (đang leo thang/dây, hoặc đang xuyên bục: e.dropT > 0)
// v0.39: ô ngay dưới chân (giữa thân) của thực thể là băng? (T_ICE)
function iceUnder(level, e) { return level.tile(Math.floor((e.x + e.w / 2) / TILE), Math.floor((e.y + e.h + 1) / TILE)) === T_ICE; }
function platAt(level, c, r) { const t = level.tile(c, r); return t === T_ONEWAY || (t === T_LADDER && level.isLadderTop(c, r)); }

function moveX(level, e, dx) {
    e.x += dx;
    const r0 = Math.floor(e.y / TILE), r1 = Math.ceil((e.y + e.h) / TILE) - 1;
    if (dx > 0) {
        const c = Math.ceil((e.x + e.w) / TILE) - 1;
        for (let r = r0; r <= r1; r++) if (level.isSolid(c, r)) { e.x = c * TILE - e.w; e.hitVx = e.vx; e.vx = 0; e.hitR = true; return true; }
    } else if (dx < 0) {
        const c = Math.floor(e.x / TILE);
        for (let r = r0; r <= r1; r++) if (level.isSolid(c, r)) { e.x = (c + 1) * TILE; e.hitVx = e.vx; e.vx = 0; e.hitL = true; return true; }
    }
    return false;
}

function moveY(level, e, dy) {
    const prevBottom = e.y + e.h;
    e.y += dy;
    const c0 = Math.floor(e.x / TILE), c1 = Math.ceil((e.x + e.w) / TILE) - 1;
    if (dy > 0) {
        const row = Math.ceil((e.y + e.h) / TILE) - 1;
        let solid = false, one = false;
        for (let c = c0; c <= c1; c++) {
            if (level.isSolid(c, row)) solid = true;
            else if (!e.ignorePlat && e.dropT <= 0 && platAt(level, c, row) && prevBottom <= row * TILE + 0.01) one = true;
        }
        if (solid || one) { e.y = row * TILE - e.h; e.hitVy = e.vy; e.vy = 0; e.onGround = true; e.groundTile = solid ? T_SOLID : T_ONEWAY; return true; }
    } else if (dy < 0) {
        const row = Math.floor(e.y / TILE);
        for (let c = c0; c <= c1; c++) if (level.isSolid(c, row)) { e.y = (row + 1) * TILE; e.hitVy = e.vy; e.vy = 0; e.hitU = true; return true; }
    }
    return false;
}

// Di chuyển thực thể theo vận tốc trong dt giây; cập nhật onGround/hitL/hitR/hitU/groundTile (+ hitVx/hitVy = vận tốc lúc đâm, cho nảy/sát thương).
// Chia nhỏ theo TILE/2 mỗi lần => không xuyên tường dù vận tốc lớn.
function physMove(level, e, dt) {
    e.hitL = e.hitR = e.hitU = false; e.onGround = false; e.groundTile = T_EMPTY; e.hitVx = 0; e.hitVy = 0;
    const half = TILE / 2;
    let dx = e.vx * dt;
    while (dx !== 0) { const s = Math.abs(dx) > half ? Math.sign(dx) * half : dx; dx -= s; if (moveX(level, e, s)) break; }
    let dy = e.vy * dt;
    while (dy !== 0) { const s = Math.abs(dy) > half ? Math.sign(dy) * half : dy; dy -= s; if (moveY(level, e, s)) break; }
    if (!e.onGround && e.vy >= 0) e.onGround = groundBelow(level, e);      // đứng yên trên đất (vy = 0, không có bước dy) vẫn tính là trên đất
}
// Có đất (hoặc bục) ngay dưới chân trong vòng 0,5px?
function groundBelow(level, e) {
    const row = Math.floor((e.y + e.h + 0.5) / TILE);
    if (Math.abs(row * TILE - (e.y + e.h)) > 0.5) return false;
    const c0 = Math.floor(e.x / TILE), c1 = Math.ceil((e.x + e.w) / TILE) - 1;
    for (let c = c0; c <= c1; c++) {
        if (level.isSolid(c, row)) { e.groundTile = T_SOLID; return true; }
        if (!e.ignorePlat && e.dropT <= 0 && platAt(level, c, row)) { e.groundTile = T_ONEWAY; return true; }
    }
    return false;
}
// Hộp {x,y,w,h} có chồng lên ô đặc nào không (dùng khi đặt vật / thả dây)
function boxHitsSolid(level, x, y, w, h) {
    const c0 = Math.floor(x / TILE), c1 = Math.ceil((x + w) / TILE) - 1, r0 = Math.floor(y / TILE), r1 = Math.ceil((y + h) / TILE) - 1;
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (level.isSolid(c, r)) return true;
    return false;
}

// 07b_levelgen — BỘ SINH LEVEL kiểu Spelunky (GĐ2). Mọi ngẫu nhiên qua rngWorld(seed, chỉ số level) => cùng seed + level = cùng bản đồ.
//   1. Đường chính (SC scrLevelGen, đã đọc mã gốc): lưới LVL.roomsX × LVL.roomsY phòng (H1: 5×5; SC gốc 4×4). Phòng vào = cột ngẫu nhiên ở hàng trên.
//      Mỗi bước: ở cột giữa tung 1–5 (1–2 trái, 3–4 phải, 5 xuống); ở mép trái tung 3–5 (phải hoặc xuống); ở mép phải tung 5–7 (xuống hoặc trái).
//      Không đi lại phòng đã đi. Đi xuống: phòng đang đứng thành loại 2, phòng dưới thành loại 3 (rơi tiếp từ phòng loại 3 => phòng đó thành '2t').
//      Ở hàng dưới cùng mà định đi xuống => đặt phòng ra ở đó.
//   2. Mỗi ô lưới chọn một mẫu cùng loại (02a_templates), lật trái-phải ngẫu nhiên; phòng ngoài đường = loại 0.
//   3. Giải ô xác suất (2, 7, 4) và khối chướng ngại 5×3 (5 mặt đất, 6 lơ lửng); đất: 10% khối đá, 20% mạch vàng nhỏ, 10% mạch vàng lớn (SC oBrick/oBlock).
//   4. Cửa vào: ô đứng được ngẫu nhiên trong phòng vào. Cửa ra: ô đứng được trong phòng ra mà bộ kiểm tra ĐI TỚI ĐƯỢC từ cửa vào (không bom, không dây, rơi ≤ GEN.maxFall).
//      Không có ô nào như vậy => sinh lại với seed con (đếm số lần ở fuzz). Sàn dưới cửa ra = đá cứng (SC: block.invincible).
//   5. Hậu xử lý (SC scrEntityGen / scrTreasureGen, vùng Hầm mỏ): quái (dơi treo trần 1/60, rắn trên sàn 1/60, không ở phòng vào),
//      đá 1/100, bình 1/40, hốc tường: thùng gỗ 1/10 hoặc vàng; bẫy mũi tên từ khối đá (1/4, cách cửa vào > 3 ô, phía trước có ≥ 2 ô trống).
//   (GĐ7c) Phòng bên đặc biệt: cửa hàng (genShop) và hố rắn (genPit) ghi đè phòng loại 0 trước bước 5.
//   Kết quả: def dạng { id, name, theme, map: [32 chuỗi × 40 ký tự] } — cùng dạng TEST_LEVEL, Level (07a) đọc được. Ký tự: TILE_CHARS + LVL_CHARS.

// ---- 1. Đường chính ----
function genPath(R) {
    const W = LVL.roomsX, H = LVL.roomsY;
    const type = []; for (let x = 0; x < W; x++) { type.push([]); for (let y = 0; y < H; y++) type[x].push(0); }
    let x = R.int(0, W - 1), y = 0;
    const start = { x, y }; let exit = null;
    type[x][y] = 1;
    const order = [{ x, y }];
    let guard = 0;
    while (y < H && guard++ < 500) {
        const n = x === 0 ? R.int(3, 5) : x === W - 1 ? R.int(5, 7) : R.int(1, 5);
        if (n === 1 || n === 2 || n === 6 || n === 7) { if (x > 0 && type[x - 1][y] === 0) { x--; type[x][y] = 1; order.push({ x, y }); } }
        else if (n === 3 || n === 4) { if (x < W - 1 && type[x + 1][y] === 0) { x++; type[x][y] = 1; order.push({ x, y }); } }
        else {                                     // n === 5: xuống
            if (y === H - 1) { exit = { x, y }; break; }
            type[x][y] = type[x][y] === 3 || type[x][y] === '2t' ? '2t' : 2;
            y++; type[x][y] = 3; order.push({ x, y });
        }
    }
    if (!exit) exit = { x, y: Math.min(y, H - 1) };
    return { type, start, exit, order };
}

// ---- 2–3. Ghép mẫu, giải ô xác suất ----
// Trả về lưới ký tự 40×32 (chưa có viền) + thông tin phòng
// Trọng số chọn mẫu theo vùng: mẫu chứa ký tự đặc điểm nào thì nhân trọng số vùng của đặc điểm đó
function tplWeight(tpl, zone) {
    let w = 1; if (!zone) return w;
    for (const k in zone.w) if (tpl.some(s => s.indexOf(k) >= 0)) w *= zone.w[k];

        for (let i = 0; i < n; i++) g[rm.ry * RH + 4 + i][rm.rx * RW + R.int(2, 7)] = 'u';

}


// ---- Phòng ẩn «vực dung nham» đòi LƯỚT (v0.54, H7): HAI phòng loại 0 kề ngang (20 ô): bên vào có sàn chạy đà 4 ô, rồi CHASM.gap ô dung nham, rồi bờ bên kia có vật thưởng (mảnh tim `]` hoặc đồ `[`) + vàng.
//   Không năng lực: không qua; chỉ nhảy đôi: không qua (đo: ≤ 5 ô); nhảy đôi + lướt: qua được (đo: tới 8 ô). Rơi xuống dung nham: mất 5 máu + bị hất ra (không chết ngay). Từ level CHASM.from.
//   Phòng bên vào được genOpenRooms khoét cửa (bỏ qua luật "không mở phòng có dung nham" cho đúng phòng này), phòng bên kia đóng kín.
function genChasm(R, path, rooms, g, taken, levelIdx) {
    if (levelIdx < CHASM.from || !R.chance(CHASM.chance)) return null;
    const RW = LVL.roomW, RH = LVL.roomH, free = rm => rm.type === 0 && !taken.some(t => t && t.rx === rm.rx && t.ry === rm.ry);
    const cand = []; for (const a of rooms) { if (!free(a)) continue; const b = rooms.find(x => x.rx === a.rx + 1 && x.ry === a.ry); if (b && free(b)) cand.push([a, b]); }
    if (!cand.length) return null;
    const [A, B] = R.pick(cand), flip = R.chance(0.5), W2 = RW * 2, row = [];
    for (let r = 0; r < RH; r++) {
        let t = '';
        for (let c = 0; c < W2; c++) {
            let ch = '.';
            if (r === 0 || r === RH - 1 || c === 0 || c === W2 - 1) ch = '#';
            else if (r === RH - 2 && c >= 5 && c < 5 + CHASM.gap) ch = 'V';
            t += ch;
        }
        row.push(t.split(''));
    }
    const lx = 5 + CHASM.gap + 1;                                                     // cột đầu bờ bên kia
    row[RH - 2][lx + 1] = 'G'; row[RH - 2][lx + 2] = '@'; row[RH - 2][lx + 3] = 'g'; row[RH - 2][W2 - 3] = 'G';
    const ci = lx + 2; let item = R.chance(0.55) ? ']' : '[';
    for (let r = 0; r < RH; r++) for (let c = 0; c < W2; c++) { const sc = flip ? W2 - 1 - c : c, ch = row[r][sc] === '@' ? item : row[r][sc]; if (c < RW) g[A.ry * RH + r][A.rx * RW + c] = ch; else g[B.ry * RH + r][B.rx * RW + c - RW] = ch; }
    const cellC = A.rx * RW + (flip ? W2 - 1 - ci : ci);
    return { rx: flip ? B.rx : A.rx, ry: A.ry, rx2: flip ? A.rx : B.rx, cell: { c: cellC, r: A.ry * RH + RH - 2 } };          // rx = phòng BÊN VÀO (chạy đà), rx2 = phòng bên bờ kia
}

// ---- Phòng mẫu TỔ HỢP có chủ đích (v0.53; Roadmap "phòng mẫu tổ hợp"): phòng loại 0 đóng kín (như hồ ngầm: đào / nổ vào, hoặc được genOpenRooms khoét cửa) bày sẵn MỘT tổ hợp môi trường + quái theo hệ của vùng, kèm phần thưởng ở đầu kia ----
//   burn  «Hành lang dầu»: thùng nước `t` ở cửa, hai cụm thùng dầu `x`, quái phun lửa `f` đứng cuối canh vàng => lửa bén dầu cả hành lang; ném / đẩy thùng nước dập hoặc bắn từ xa trước · shock «Ao sét»: ao nước 2 tầng có cá điện `u`, vàng ở bờ xa; điện chạy khắp ao (phòng chứa nước nên không được khoét cửa tự động)

    burn: ['##########', '##########', '##########', '##########', '#........#', '#........#', '#.t.xx.Gf#', '##########'],
    shock: ['##########', '#........#', '#........#', '#........#', '#.WWWW...#', '#.WuWW...#', '#.WWWW.G.#', '##########'],
    poison: ['##########', '#........#', '#........#', '#........#', '#........#', '#.|.|.|!.#', '#..g.g.cG#', '##########']

function genCombo(R, path, rooms, g, taken, levelIdx) {
    const zone = zoneOf(levelIdx), kind = zone.elem === 'burn' ? 'burn' : zone.elem === 'shock' ? 'shock' : zone.elem === 'poison' ? 'poison' : null;
    if (!kind || levelIdx < 2 || !R.chance(GEN.comboChance)) return null;
    const cand = rooms.filter(rm => rm.type === 0 && !taken.some(t => t && t.rx === rm.rx && t.ry === rm.ry));
    if (!cand.length) return null;
    const rm = R.pick(cand), RW = LVL.roomW, RH = LVL.roomH, flip = R.chance(0.5), tpl = COMBO_TPL[kind];
    for (let r = 0; r < RH; r++) for (let c = 0; c < RW; c++) g[rm.ry * RH + r][rm.rx * RW + c] = tpl[r][flip ? RW - 1 - c : c];
    return { rx: rm.rx, ry: rm.ry, kind };
}


// ---- Mở lối vào phòng phụ (lần 36) ----
//   Phòng loại 0 thường (không phải cửa hàng / hố rắn / kho báu / hồ…) có xác suất GEN.openChance được khoét một cửa hai ô cao ở tường chung với phòng kề
//   đã nối (phòng đường chính loại 1/3 luôn mở lối trái-phải, hoặc một phòng phụ đã mở trước đó), kèm gian tiền sảnh 4 ô trong đất.
//   Cửa nằm sát sàn (hàng 5–6, sàn hàng 7 là đất liền) => đi bộ vào được, không cần bom. Không đụng phòng đường chính => đường chính y nguyên.
function genOpenRooms(R, path, rooms, g, taken, seenAt, chasmRoom) {
    chasmRoom = chasmRoom || { rx: -9, ry: -9 };          // phòng bên vào của vực dung nham (có ô dung nham 'V' nhưng vẫn được khoét cửa)
    const RW = LVL.roomW, RH = LVL.roomH, key = (x, y) => x + ',' + y, DIRT = '#$%X';
    const conn = new Set(), opened = [];
    const linked = (nb, edge) => conn.has(key(nb.rx, nb.ry)) || seenAt(nb, edge);      // phòng kề có ô đứng ở mép đối diện đi tới được (hoặc vừa được mở)
    const at = (rm, c, r) => g[rm.ry * RH + r][rm.rx * RW + c];
    const has = (rm, chs) => { for (let r = 0; r < RH; r++) for (let c = 0; c < RW; c++) if (chs.indexOf(at(rm, c, r)) >= 0) return true; return false; };
    const canCarve = (rm, edge) => { for (const r of [5, 6]) { const ch = at(rm, edge, r); if (DIRT.indexOf(ch) < 0 && ch !== '.') return false; } return true; };
    const carve = (rm, side, depth) => {              // side = -1: khoét ở mép trái của phòng; +1: mép phải. depth = số cột tiền sảnh
        const edge = side < 0 ? 0 : RW - 1;
        for (let k = 0; k < depth; k++) for (const r of [5, 6]) { const c = edge + (side < 0 ? k : -k); const ch = at(rm, c, r); if (DIRT.indexOf(ch) >= 0) g[rm.ry * RH + r][rm.rx * RW + c] = '.'; }
    };
    const cand = rooms.filter(rm => rm.type === 0 && !taken.some(t => t && t.rx === rm.rx && t.ry === rm.ry) && (!has(rm, 'VW') || (rm.ry === chasmRoom.ry && rm.rx === chasmRoom.rx && !has(rm, 'W'))));
    for (let i = cand.length - 1; i > 0; i--) { const j = R.int(0, i); const t = cand[i]; cand[i] = cand[j]; cand[j] = t; }
    const want = new Set(cand.filter(() => R.chance(GEN.openChance)).map(rm => key(rm.rx, rm.ry)));
    for (let pass = 0; pass < 3; pass++) for (const rm of cand) {
        const k = key(rm.rx, rm.ry); if (!want.has(k) || conn.has(k)) continue;
        const sides = [];
        for (const side of [-1, 1]) {
            const nx = rm.rx + side; if (nx < 0 || nx >= LVL.roomsX) continue;
            const nb = rooms.find(x => x.rx === nx && x.ry === rm.ry);
            if (!linked(nb, side < 0 ? RW - 1 : 0)) continue;
            if (!canCarve(rm, side < 0 ? 0 : RW - 1)) continue;
            if (nb.type === 0 && !canCarve(nb, side < 0 ? RW - 1 : 0)) continue;
            sides.push({ side, nb });
        }
        if (!sides.length) continue;
        const { side, nb } = R.pick(sides);
        carve(rm, side, 4);
        if (nb.type === 0) carve(nb, -side, RW);          // phòng phụ đã mở nay thành lối đi xuyên qua: khoét suốt hai hàng
        conn.add(k); opened.push({ rx: rm.rx, ry: rm.ry, side });
    }
    return opened;
}

// ---- 4–5. Ráp level ----
// zoneTry (H1): số lần chết trong vùng chứa level này; > 0 => trộn vào seed (kể cả cờ màn tối) để MỖI LẦN CHẾT ra bản đồ mới, nhưng cùng (seed, level, zoneTry) vẫn sinh y hệt (để mở lại ván đã lưu).
function genLevel(seed, levelIdx, zoneTry, spawnMul) {          // spawnMul (v0.42, DDA): hệ số mật độ quái; 1 = mặc định (test / fuzz không truyền)

    if (BOSS_LEVELS[levelIdx]) { const out = genBossArena(levelIdx); out.meta.rerolls = 0; out.meta.seed = seed; out.meta.levelIdx = levelIdx; return out; }
    let tries = 0;

        const R = rngWorld(seed, levelIdx * 1000 + tries);
        const out = genTry(R, levelIdx, seed, spawnMul || 1);
        if (out) { out.meta.rerolls = tries; out.meta.seed = seed; out.meta.levelIdx = levelIdx; return out; }
    }
    // không bao giờ nên tới đây (fuzz canh): trả phòng thử nghiệm để game không chết
    return { def: TEST_LEVEL, meta: { failed: true, rerolls: tries, seed, levelIdx } };
}
function genTry(R, levelIdx, seedForDark, mul) {
    mul = mul || 1;
    const path = genPath(R);
    const zone = zoneOf(levelIdx), { g, rooms } = genTiles(R, path, zone);
    const shop = genShop(R, path, rooms, g, levelIdx);
    const pit = genPit(R, path, rooms, g, shop, levelIdx);
    const altar = genAltar(R, path, rooms, g, [shop, pit], levelIdx);
    const chest = genChest(R, path, rooms, g, [shop, pit, altar], levelIdx);
    const treasure = genTreasure(R, path, rooms, g, [shop, pit, altar, chest], levelIdx);
    const lake = genLake(R, path, rooms, g, [shop, pit, altar, chest, treasure], levelIdx);
    const aerie = genAerie(R, path, rooms, g, [shop, pit, altar, chest, treasure, lake], levelIdx);          // v0.46 (H7): phòng ẩn đòi nhảy đôi
    const combo = genCombo(R, path, rooms, g, [shop, pit, altar, chest, treasure, lake, aerie], levelIdx);          // v0.53: phòng tổ hợp theo hệ vùng
    const chasm = genChasm(R, path, rooms, g, [shop, pit, altar, chest, treasure, lake, aerie, combo], levelIdx);          // v0.54: vực dung nham đòi lướt
    const RW = LVL.roomW, RH = LVL.roomH, B = LVL.border, W = g[0].length, H = g.length;
    // lưới có viền để kiểm tra
    const full = []; for (let r = 0; r < H + 2 * B; r++) full.push(new Array(W + 2 * B).fill('H'));
    for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) full[r + B][c + B] = g[r][c];
    const grid = genGrid(full);
    const standIn = (rx, ry) => {
        const out = [];
        for (let r = ry * RH; r < (ry + 1) * RH; r++) for (let c = rx * RW; c < (rx + 1) * RW; c++) {
            const C = c + B, Rr = r + B;
            const t = grid.T(C, Rr), below = grid.T(C, Rr + 1), above = grid.T(C, Rr - 1);
            if (t === T_EMPTY && T_IS_SOLID[below] && below !== T_ARROW && !T_IS_SOLID[above] && above !== T_LADDER) out.push({ c: C, r: Rr });

    };
    // cửa vào
    const sCands = standIn(path.start.x, path.start.y); if (!sCands.length) return null;

    // (lần 36) mở lối vào phòng phụ — chỉ khoét phòng loại 0 nên đường chính không đổi; lưới `full` cập nhật tại chỗ => kiểm lại đường đi
    const opened = genOpenRooms(R, path, rooms, g, [shop, pit, altar, chest, treasure, lake, aerie, combo, chasm ? { rx: chasm.rx2, ry: chasm.ry } : null], (nb, edge) => !!reach.seen[(nb.ry * RH + 6 + B) * grid.w + nb.rx * RW + edge + B], chasm);
    if (opened.length) {
        for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) full[r + B][c + B] = g[r][c];

    }
    // cửa ra: ô đứng được trong phòng ra mà đi tới được, không trùng ô cửa vào
    if (shop) {            // chắc ăn: ô chủ cửa hàng phải đi tới được, nếu không sinh lại
        let ok = false;
        for (let r = shop.ry * RH + B; r < (shop.ry + 1) * RH + B && !ok; r++) for (let c = shop.rx * RW + B; c < (shop.rx + 1) * RW + B; c++) if (full[r][c] === 'D' && reach.seen[r * grid.w + c]) { ok = true; break; }
        if (!ok) return null;
    }
    if (chasm) {            // v0.54 (H7): bờ bên kia vực phải ẨN với người chỉ có nhảy đôi và VÀO ĐƯỢC bằng nhảy đôi + lướt
        const ci = (chasm.cell.r + B) * grid.w + chasm.cell.c + B;

        if (!genReach(grid, s.c, s.r, undefined, { doubleJump: true, dash: true }).seen[ci]) return null;
    }
    if (aerie) {            // v0.46 (H7): kho trên gác cao phải ẨN với người không năng lực và VÀO ĐƯỢC bằng nhảy đôi; không đạt thì sinh lại
        const ai = (aerie.cell.r + B) * grid.w + aerie.cell.c + B;

    }

    const solidAt = (c, r) => r >= 0 && r < full.length && genSolidCh(full[r][c]);
    const roomOf = (c, r) => ({ x: Math.floor((c - B) / RW), y: Math.floor((r - B) / RH) });
    const nearDoor = (c, r) => Math.abs(c - s.c) + Math.abs(r - s.r) < 3 || Math.abs(c - e.c) + Math.abs(r - e.r) < 2;
    const K = GEN.areaK, zk = levelIdx % ZONE_LEN, zr = GEN.zoneRamp[zk], zl2 = GEN.zoneLoot[zk];      // lần 37: nhịp độ khó trong vùng — màn đầu thoáng + nhiều đồ, màn sau dày quái/bẫy hơn
    const counts = { snake: 0, bat: 0, foe: 0, rock: 0, pot: 0, crate: 0, gold: 0, trap: 0, princess: 0, shop: shop ? 1 : 0, pit: pit ? 1 : 0, altar: altar ? 1 : 0, chest: chest ? 1 : 0, treasure: treasure ? 1 : 0 };
    const inShop = (c, r) => { const rm = roomOf(c, r); return !!(shop && rm.x === shop.rx && rm.y === shop.ry) || !!(pit && rm.x === pit.rx && rm.y === pit.ry) || !!(altar && rm.x === altar.rx && rm.y === altar.ry) || !!(chest && rm.x === chest.rx && rm.y === chest.ry) || !!(treasure && rm.x === treasure.rx && rm.y === treasure.ry) || !!(lake && rm.x === lake.rx && rm.y === lake.ry) || !!(aerie && rm.x === aerie.rx && rm.y === aerie.ry) || !!(combo && rm.x === combo.rx && rm.y === combo.ry) || !!(chasm && rm.y === chasm.ry && (rm.x === chasm.rx || rm.x === chasm.rx2)); };      // cửa hàng + hố rắn: không rải thêm vật / quái
    for (let r = B + 1; r < H + B; r++) for (let c = B; c < W + B; c++) {

        if (r < H + B - 3 && isEmpty(c, r + 1) && isEmpty(c, r + 2) && R.int(1, per) === 1) { const ch = genWeighted(R, zone.air); full[r + 1][c] = ch; counts[ch === 'B' ? 'bat' : 'foe']++; }

    //   Quái bị nhốt trong đất (không bao giờ gặp) bỏ bớt; thay vào đó rải thêm quái + vàng/thùng trên sàn ĐI TỚI ĐƯỢC (validator) — cho cảm giác có chuyện xảy ra trên đường.

// v0.40: sát thương lên NGƯỜI CHƠI theo máu mới (10). raw = giữ nguyên (DoT); ≥ 90 = chết ngay (bẫy đè, rơi vực); gai / dung nham / bom có mức riêng; còn lại ×HP_UNIT.

    if (src.raw) return src.dmg;

    if (src.kind === DMG.EXPLOSION) return HURT_P.bomb;

// Gai / dung nham làm người chơi sống sót: hất ra + bất tử ngắn (không bị cắn lại mỗi khung)

// Thực thể đang sống trong level (game.entities), lọc theo hàm f

        this.equip = 'sword'; this.whistleCd = 0; this.sel = null; this.sub = null; this.hpUp = 0; this.blade = 'fire';          // v0.45: kiếm Lửa miễn phí từ đầu (13s_blade); mua kiếm hệ khác ở cửa hàng thì thay

    update(level, dt) {

        if (this.state === 'climb') this.stepClimb(level, dt, ax, up, down);

        if (this.whipBuf > 0) { this.whipBuf -= dt; if (this.whipCan() && !this.hold && this.state !== 'climb' && this.state !== 'hang' && this.state !== 'cling' && this.state !== 'stun' && !this.dead) { this.whipBuf = 0; this.whipStart(this.whipBufUp ? 1 : 0); } }

    // ---- Chạy / nhảy / rơi (stand · run · duck · air) ----
    stepMove(level, dt, ax, up, down) {
        const wasGround = this.onGround;
        const duck = wasGround && down && this.whipT < 0;
        // Ngang (SC: tăng tốc khi giữ hướng > 2 khung; ma sát nhân mỗi khung; giới hạn tốc theo đi / chạy / bò)
        if (ax !== 0) this.facing = ax;

        const onIce = wasGround && iceUnder(level, this);          // v0.39: ô băng T_ICE dưới chân = sàn trơn theo từng ô (ICE), cộng / thay cơ chế vùng
        if (ax !== 0 && this.dirHeldT > PHYS.turnDelay) {

        }

        if (!inp.held('jump')) this.jumpHeld = false;

            this.vx *= scFric(WATER.fric, dt); this.fallT = 0;

            if (this.bufferT > 0 && !wasGround) { this.vy = WATER.stroke; this.bufferT = 0; this.jumpHeld = false; sndPlay('jump', { x: this.cx, vol: 0.5, p: 0.8 }); }

                    const nx = this.x + s * d;

                }

        // Đếm thời gian rơi (SC: fallTimer tăng mỗi khung yVel > 0)
        if (this.onGround) {

    // Đang đứng sát tường phía dir? (SC: đẩy tường thì không tăng tốc — tránh rung)
    blockedAt(level, dir) {

    }
    // Chạm đất: sát thương rơi theo thời gian rơi (SC: >16 khung = choáng + −1, >32 = −2, >48 = −10)
    land(level) {
        const f = this.fallT * Math.sqrt(curMech().gravMul);       // trọng lực nhẹ => rơi lâu hơn cho cùng độ cao: quy về độ cao
        if (f > PHYS.stunFallT) {

    // Xác / choáng: nảy như vật (SC: dead/stunned dùng trọng lực 0.6 px/khung², nảy −0.5 khi chạm đất, ma sát 0.3)

    }

    // ---- Bám mép (SC: tay ở tâm−5..−6 chạm khối đặc, ô trên tay trống (tâm−9), dưới chân trống (tâm+9); không bám lại trong hangCount) ----
    tryHang(level, ax) {
