        if (!(ax > 0 ? this.hitR || this.blockedAt(level, 1) : this.hitL || this.blockedAt(level, -1))) return false;
        if (!(level.solidAt(hx, cy - 5) || level.solidAt(hx, cy - 6))) return false;
        if (level.solidAt(hx, cy - 9)) return false;
        if (level.solidAt(this.cx, this.y + this.h + 1)) return false;
        if (level.solidAt(this.cx, this.y - 1)) return false;
        const r = Math.floor((cy - 5) / TILE), top = r * TILE;
        if (level.isSolid(Math.floor(hx / TILE), r - 1)) return false;
        // Bậc chỉ cao 1 ô so với chỗ vừa đứng: KHÔNG bám — cú nhảy tự lên được. (SC chạy 30 khung/s nên khung nhảy đầu đã vượt qua vùng bám;
        // ở 60Hz người chơi đi qua vùng bám từng bước nhỏ nên phải chặn rõ ràng, nếu không sẽ bám mép ở bậc 1 ô — lỗi báo 2026-10-25)
        if (this.vy < 0 && this.groundY - top <= TILE + 4) return false;
        this.y = top + 8 - this.h / 2;                     // SC: move_snap(1, 8) => tâm = mặt trên mép + 8
        this.vx = this.vy = 0; this.facing = ax; this.fallT = 0; this.jumpHeld = false;
        this.setState('hang'); sndPlay('step', { x: this.cx });
        return true;
    }
    // Ngồi ở mép + ép ra ngoài => tụt xuống bám ngay mép đó, quay mặt vào tường (SC: DUCKTOHANG)
    tryDuckToHang(level, ax) {
        if (Math.abs(this.vx) > PHYS.walkMax || this.hold && this.hold.mass >= 2) return false;
        const feet = this.y + this.h + 1;
        let edgeC = Math.floor((ax > 0 ? this.x + this.w - 1 : this.x + 1) / TILE);         // ô đang đỡ chân ở phía mép
        if (!level.isSolid(edgeC, Math.floor(feet / TILE))) edgeC -= ax;                       // đã nhô quá mép một chút
        if (!level.isSolid(edgeC, Math.floor(feet / TILE))) return false;
        const outC = edgeC + ax, r = Math.floor(feet / TILE);
        if (level.isSolid(outC, r) || level.isSolid(outC, r + 1) || level.isSolid(outC, r - 1)) return false;
        // còn cách mép > 3px thì chưa (bò tiếp tới mép); đã nhô ra ngoài mép (vẫn còn chân trên đất) cũng được
        const edgeX = ax > 0 ? (edgeC + 1) * TILE : edgeC * TILE, over = ax > 0 ? this.x + this.w - edgeX : edgeX - this.x;
        if (over < -3) return false;
        if (this.hold) carryDrop(this);
        this.x = ax > 0 ? edgeX : edgeX - this.w; this.y = r * TILE + 8 - this.h / 2;
        this.vx = this.vy = 0; this.facing = -ax; this.setState('hang'); this.hangCd = 0;
        return true;
    }
    stepHang(level, dt, ax, up, down) {
        this.vx = this.vy = 0; this.fallT = 0;
        const hx = this.facing > 0 ? this.x + this.w + 1 : this.x - 1;
        if (!level.solidAt(hx, this.cy - 4) && !level.solidAt(hx, this.cy - 7)) { this.letGo(4 / 30); return; }    // mép bị phá
        if (this.bufferT > 0) {
            this.bufferT = 0;
            if (down || ax === -this.facing) { this.letGo(5 / 30); return; }          // ↓ + nhảy hoặc giữ hướng ngược lại: buông
            this.x -= this.facing * 2;                                                // SC: lùi 2px rồi nhảy lên
            this.vy = PHYS.jumpV * gearJumpMul(this); this.jumpHeld = true; this.jumpT = 0; this.hangCd = 0.15; this.limit = PHYS.walkMax;
            this.setState('air'); sndPlay('jump', { x: this.cx });
        }
    }
    // ---- Bám tường (Găng leo tường, 13m_gear): trên không ép vào tường => bám; ↑/↓ leo, nhảy = bật ra, ép hướng ngược / ↓ + nhảy = buông ----
    tryCling(level, ax) {
        if (ax === 0 || !gearHas(this, 'gloves') || this.clingCd > 0 || this.hold && this.hold.mass >= 2 || level.inWater(this)) return false;
        if (this.vy < -40) return false;                                       // đang bay lên mạnh: chưa bám (để nhảy lên dọc tường được)
        const hx = ax > 0 ? this.x + this.w + 1 : this.x - 1;
        if (!(level.solidAt(hx, this.y + 3) && level.solidAt(hx, this.y + this.h - 3))) return false;     // tường phủ cả đầu lẫn chân
        this.vx = this.vy = 0; this.facing = ax; this.fallT = 0; this.jumpHeld = false; this.limit = PHYS.walkMax;
        this.setState('cling'); sndPlay('step', { x: this.cx, vol: 0.5, p: 1.4 });
        return true;
    }
    stepCling(level, dt, ax, up, down) {
        this.fallT = 0; this.vx = 0; this.ignorePlat = false;
        const hx = this.facing > 0 ? this.x + this.w + 1 : this.x - 1;
        if (!level.solidAt(hx, this.y + 3) && !level.solidAt(hx, this.y + this.h - 3)) { this.clingCd = 0.15; this.setState('air'); return; }      // tường biến mất
        if (this.bufferT > 0) {                                                // nhảy: bật khỏi tường (↓ + nhảy: chỉ buông)
            this.bufferT = 0;
            if (down) { this.clingCd = 0.2; this.setState('air'); this.vy = 0; return; }
            this.vy = PHYS.jumpV * gearJumpMul(this); this.vx = -this.facing * GEAR.wallKick; this.facing = -this.facing; this.jumpHeld = true; this.jumpT = 0; this.clingCd = 0.25;
            this.setState('air'); sndPlay('jump', { x: this.cx }); return;
        }
        if (ax === -this.facing) { this.clingCd = 0.2; this.setState('air'); this.vy = 0; return; }       // ép hướng ngược = buông
        this.vy = up ? -GEAR.clingUp : down ? GEAR.clingDown : 0;
        if (this.vy < 0 && !level.solidAt(hx, this.y + 3)) { this.vy = 0; if (!this.tryHang(level, this.facing)) { this.clingCd = 0.2; this.setState('air'); } return; }      // lên tới đỉnh tường: bám mép / thoát
        physMove(level, this, dt);
        if (this.onGround) { this.setState('stand'); this.clingCd = 0.1; }
    }
    letGo(cd) { this.hangCd = cd; this.setState('air'); this.vy = 0; }

    // ---- Thang / dây ----
    climbColAt(level, x, y) { const c = Math.floor(x / TILE), r = Math.floor(y / TILE); return level.isClimb(c, r) ? c : -1; }
    tryClimb(level, inAir) {
        const cy = this.cy;
        let c = this.climbColAt(level, this.cx, cy);
        if (c < 0 && inAir) c = this.climbColAt(level, this.cx, cy - 8);
        if (c < 0) return false;
        const mid = c * TILE + TILE / 2;
        if (Math.abs(this.cx - mid) >= 5) return false;                  // SC: |x − tâm thang| < 4
        if (this.hold && this.hold.mass >= 1) carryDrop(this);           // tay đang cầm vật vừa/nặng thì đánh rơi (SC: leo cần 2 tay; vật nhẹ như mũi tên vẫn giữ)
        this.x = mid - this.w / 2; this.vx = this.vy = 0; this.fallT = 0; this.jumpHeld = false;
        this.setState('climb'); this.ignorePlat = true;
        return true;
    }
    tryLadderDown(level) {
        const c = Math.floor(this.cx / TILE), r = Math.floor((this.y + this.h + 1) / TILE);
        if (!level.isClimb(c, r)) return false;
        const mid = c * TILE + TILE / 2;
        if (Math.abs(this.cx - mid) >= 5) return false;
        this.x = mid - this.w / 2; this.y += 2; this.vx = this.vy = 0;
        this.setState('climb'); this.ignorePlat = true;
        return true;
    }
    stepClimb(level, dt, ax, up, down) {
        this.ignorePlat = true; this.fallT = 0; this.vx = 0;
        if (ax !== 0) this.facing = ax;
        const cx = this.cx, cy = this.cy;
        if (!level.isClimb(Math.floor(cx / TILE), Math.floor(cy / TILE)) && !level.isClimb(Math.floor(cx / TILE), Math.floor((cy + 8) / TILE))) { this.setState('air'); this.ignorePlat = false; return; }
        if (up) {
            if (level.isClimb(Math.floor(cx / TILE), Math.floor((cy - 8) / TILE))) this.vy = -PHYS.climbSpeed;
            else {
                this.vy = 0;
                // đỉnh thang: bước lên đứng trên mặt thang (tiện hơn bản gốc phải nhảy; dây thì không có mặt đứng)
                const c = Math.floor(cx / TILE), r = Math.floor(cy / TILE);
                if (level.isLadderTop(c, r) && !boxHitsSolid(level, this.x, r * TILE - this.h, this.w, this.h)) { this.y = r * TILE - this.h; this.setState('stand'); this.ignorePlat = false; this.ladderCd = 0.25; return; }
            }
        } else if (down) {
            if (level.isClimb(Math.floor(cx / TILE), Math.floor((cy + 8) / TILE))) this.vy = PHYS.climbSpeed;
            else { this.setState('air'); this.ignorePlat = false; this.vy = 0; return; }        // SC: hết thang bên dưới => rơi
        } else this.vy = 0;
        physMove(level, this, dt);
        if (down && this.onGround && level.isSolid(Math.floor(cx / TILE), Math.floor((this.y + this.h + 1) / TILE))) { this.setState('stand'); this.ignorePlat = false; return; }
        if (this.bufferT > 0) {          // nhảy khỏi thang (SC: departLadderXVel 4, departLadderYVel −4)
            this.bufferT = 0;
            this.vx = ax * PHYS.ladderJumpVx; this.vy = PHYS.ladderJumpV; this.jumpHeld = true; this.jumpT = 0; this.limit = this.running ? PHYS.runMax : PHYS.walkMax;
            this.ladderCd = 5 / 30; this.setState('air'); this.ignorePlat = false; sndPlay('jump', { x: this.cx });
        }
    }

    // ---- Nhìn lên / xuống (SC: đứng yên giữ ↑/↓ 30 khung rồi camera dịch 4 px/khung) ----
    lookStep(dt, ax, up, down) {
        const still = this.onGround && ax === 0 && Math.abs(this.vx) < 1 && (up !== down);
        if (still) this.lookT += dt; else this.lookT = 0;
        if (this.lookT > PHYS.lookDelay) this.look = clamp(this.look + (up ? -1 : 1) * PHYS.lookSpeed * dt, -PHYS.lookMax, PHYS.lookMax);
        else this.look = approach(this.look, 0, PHYS.lookSpeed * 2 * dt);
    }

    // ---- Hành động: chém / nhặt / ném / bom / dây / đổi trang bị ----
    // Nút "dùng" (nay chỉ còn ↓ + chém / ↓ + Tròn gọi; phím Space đã bỏ ở v0.12). A17 (v0.9): KHÔNG mở thùng (mở thùng chỉ có ↑ + chém, xem actions()).
    //   đang cầm vật (kể cả thùng) -> ĐẶT nhẹ xuống; tay trống + có vật dưới chân (kể cả thùng) -> NHẶT. Trả true nếu đã làm được gì đó.
    useAction(level) {
        if (this.hold) { carryThrow(this, this.hold, false, this.onGround); return true; }
        const t = carryFind(this);
        return !!t && carryPick(this, t);
    }
    // v0.44: Tròn luôn là KIẾM (activeEquip giữ lại cho chỗ cũ). Đồ phụ có kho riêng: subList (món còn đồ) · sel (món đang chọn) · cycleSel (L1 / Tab / lăn chuột) · useSel (Tam giác) — chọn một lần, dùng nhiều lần.
    activeEquip() { return 'sword'; }
    subList() {
        const l = []; if (this.bombs > 0) l.push('bomb'); if (this.ropes > 0) l.push('rope');
        if (this.weapon === 'shotgun' && this.ammo > 0) l.push('shotgun'); else if (this.weapon === 'boomerang') l.push('boomerang');
        if (subHas(this)) l.push('sub');
        return l;
    }
    selItem() { const l = this.subList(); return l.indexOf(this.sel) >= 0 ? this.sel : (l[0] || null); }
    cycleSel(dir) {
        if (this.dead || this.state === 'stun') return;
        const l = this.subList(); if (l.length < 2) return;
        const cur = this.selItem(), i = l.indexOf(cur); this.sel = l[(i + dir + l.length) % l.length]; sndPlay('ui', { x: this.cx });
    }
    useSel(level, up, down) {          // Tam giác: dùng đồ phụ đang chọn
        if (this.dead || this.state === 'stun' || this.shocked()) return false;
        const it = this.selItem(); if (!it || this.whipT >= 0 || this.hold) return false;
        const canAct = this.state !== 'climb' || this.hold;
        if (it === 'bomb') { this.throwBomb(up, down); return true; }
        if (it === 'rope') { if (canAct !== false && ropeThrow(level, this, down)) { this.ropes--; return true; } return false; }
        if (it === 'sub') return subThrow(this, up, down);
        if (this.state === 'climb' || this.state === 'hang' || this.state === 'cling') return false;
        if (it === 'shotgun') { weaponFire(this, level); return true; }
        if (it === 'boomerang') { if (!this.boom) { weaponThrowBoom(this); return true; } return false; }
        return false;
    }
    throwBomb(up, down) {
        this.bombs--;
        const b = new Bomb(this.cx - 4, this.cy - 4); b.light();
        entAdd(b); carryThrow(this, b, up, down);
    }
    actions(level, ax, up, down) {
        if (this.hold && !this.hold.alive) this.hold = null;
        const canAct = this.state !== 'climb' || this.hold;
        if (inp.pressed('use')) { this.useAction(level); return; }          // phím `use` (v0.12: mặc định trống, đã bỏ Space): đặt vật đang cầm / nhặt vật dưới chân (không mở thùng)
        if (inp.pressed('attack') && down && this.onGround && this.state !== 'climb' && this.useAction(level)) return;          // A17 (v0.9): ↓ + O dưới đất: đang cầm (kể cả thùng) thì đặt xuống, tay trống + có vật / thùng dưới chân thì nhặt; làm TRƯỚC đặt bom / thả dây. Không có gì thì rơi xuống nhánh bên dưới (đặt bom / thả dây nếu đã chọn)
        if (inp.pressed('attack')) {
            if (this.hold) {
                carryThrow(this, this.hold, up, down);          // lần 29: đang nhảy/rơi + ↓ = ném THẲNG XUỐNG (đá trúng quái ngay bên dưới)
                this.whipT = -1;
            } else if (down && this.onGround) {
                carryPick(this, carryFind(this));
            } else if (down && !this.onGround && this.state === 'air' && this.whipT < 0 && !this.shocked()) {          // bước 6: dính Giật thì không chém xuống (rơi xuống nhánh chém cuối => báo từ chối)
                pogoStart(this);
            } else if (this.state !== 'climb' && this.state !== 'hang' && this.state !== 'cling') {
                if (this.shocked()) this.shockDeny();          // bước 6: dính Giật => không chém, không xếp hàng đợi nút
                else if (this.whipCan()) this.whipStart(up ? 1 : 0); else { this.whipBuf = WHIP.buffer; this.whipBufUp = !!up; }
            }
        }
        if (inp.pressed('item')) { this.useSel(level, up, down); }          // v0.44: Tam giác — dùng đồ phụ đang chọn (nhiều lần, không tự về kiếm)
        // Phím riêng cho bom / dây (mặc định KHÔNG gán; ai gán trong menu Đổi phím thì dùng như trước H2)
        if (inp.pressed('bomb') && this.bombs > 0 && this.whipT < 0) this.throwBomb(up, down);
        if (inp.pressed('rope') && this.ropes > 0 && this.whipT < 0 && canAct !== false) {
            if (ropeThrow(level, this, down)) this.ropes--;
        }
    }
    shocked() { return statusActive(this, 'shock'); }          // bước 6 (A15): dính Giật = không chém, không lướt (09a_abilities); vẫn chạy, nhảy, ném, dùng bom / dây
    shockDeny() { if (game.time - (this.shockDenyAt || -9) > 0.25) { this.shockDenyAt = game.time; sndPlay('st_shock', { x: this.cx, p: 1.6, vol: 0.35 }); } }          // báo "không chém được" (chống kêu liên tục khi bấm dồn)
    whipCan() { return !this.shocked() && (this.whipT < 0 || this.whipT >= WHIP.hitStart + WHIP.recover); }
    whipStart(dir, power) {          // power = true: đòn nạp (H4c)
        this.whipT = power ? WHIP.chargeSkip : 0; this.whipDir = dir ? 1 : 0; this.whipHits = new Set(); this.whipBuf = 0;
        this.whipPower = !!power; this.whipFireDone = false; this.chargeT = -1; this.chargeArm = !power; this.chargeDir = this.whipDir;          // chỉ nhát thường mới mở được nạp; đòn nạp xong không tự nạp tiếp
        sndPlay(this.whipDir ? 'swingUp' : 'swing', power ? { x: this.cx, p: 0.75 } : { x: this.cx });          // bước 8: chém lên có tiếng riêng (swingUp)
    }
    // H4c: nạp đòn. Bắt đầu ở update (nhát thường hết mà còn giữ nút chém); ở đây: đếm, báo đầy, thả nút thì tung đòn mạnh (đầy) hoặc huỷ (chưa đầy). Không nạp khi leo / bám / cầm vật / choáng / chết / dùng bom, dây, vũ khí khác.
    chargeStep(level, dt) {
        if (this.chargeT < 0) return;
        const s = this.state;
        if (this.dead || s === 'climb' || s === 'hang' || s === 'cling' || s === 'stun' || this.hold || this.dashT > 0 || this.shocked() || this.whipT >= 0 ) { this.chargeT = -1; return; }
        if (inp.held('attack')) {
            const was = this.chargeT; this.chargeT = Math.min(this.chargeT + dt, WHIP.chargeT);
            if (was < WHIP.chargeT && this.chargeT >= WHIP.chargeT) { sndPlay('ui', { x: this.cx, p: 1.6 }); level.spawnBurst(this.cx, this.cy, 6, '#ffe86a', 80); }          // báo đầy
        } else {
            const full = this.chargeT >= WHIP.chargeT; this.chargeT = -1;
            if (full) this.whipStart(this.chargeDir, true);
        }
    }
    // Hộp đòn chém hiện tại (null nếu không có): trước mặt (đòn chính), sau lưng (vung sau; chỉ chém ngang) hoặc phía trên đầu (chém lên)
    whipBox() {
        if (this.whipT < 0) return null;
        const f = this.facing, cx = this.cx, cy = this.cy, pw = this.whipPower, P = pw ? WHIP.chargeReach : 0, PH = pw ? WHIP.chargeH : 0;          // H4c: đòn nạp rộng hơn
        if (this.whipDir === 1) {                                   // chém lên: không có vung sau, đòn chính bắt đầu ở hitStart
            if (this.whipT < WHIP.hitStart) return null;
            const rch = (this.weapon === 'machete' ? WPN.macheteReach : 0) + salmonReach(this);          // cá hồi: tầm chém +10%
            return { x: cx + WHIP.ux0 - PH, y: cy + WHIP.uy0 - rch - P, w: WHIP.ux1 - WHIP.ux0 + 2 * PH, h: WHIP.uy1 - WHIP.uy0 + rch + P, front: true, up: true };
        }
        if (this.whipT < WHIP.preEnd) {
            if (pw) return null;                                    // đòn nạp không có vung sau lưng
            const x0 = f > 0 ? cx + WHIP.bx0 : cx - WHIP.bx1, x1 = f > 0 ? cx + WHIP.bx1 : cx - WHIP.bx0;
            return { x: x0, y: cy + WHIP.by0, w: x1 - x0, h: WHIP.by1 - WHIP.by0, front: false };
        }
        if (this.whipT >= WHIP.hitStart) {
            const rch = (this.weapon === 'machete' ? WPN.macheteReach : 0) + P + salmonReach(this), x0 = f > 0 ? cx - WHIP.near : cx - WHIP.fx1 - rch, x1 = f > 0 ? cx + WHIP.fx1 + rch : cx + WHIP.near;
            return { x: x0, y: cy + WHIP.fy0 - PH, w: x1 - x0, h: WHIP.fy1 - WHIP.fy0 + 2 * PH, front: true };
        }
        return null;
    }

    // ---- Vẽ (H2): mèo hiệp sĩ từ HERO_ANIMS (05_assets). Hình dự phòng (nhà thám hiểm nửa-pixel, rồi bản 1px bên dưới) khi ảnh chưa nạp xong. HITBOX KHÔNG ĐỔI, chỉ đổi hình. ----
    // Chọn khung theo trạng thái. Trả { a: tên hoạt ảnh, i: số khung, ... } — khung chưa vẽ (bám mép, leo, cúi, nhặt/ném, lượn…) dùng khung GẦN NHẤT tạm (Roadmap mục 9).
    heroFrame() {
        const s = this.state, t = game.time, vx = Math.abs(this.vx);
        if (s === 'dead') return { a: 'hurt', i: 0, lie: true };
        if (s === 'stun') return { a: 'hurt', i: 0 };
        if (this.dashT > 0) return { a: 'dash', i: clamp(Math.floor((1 - this.dashT / ABIL.dashT) * HERO_ANIMS.dash.n), 0, HERO_ANIMS.dash.n - 1) };
        if (this.whipT >= 0 && s !== 'hang' && s !== 'cling' && s !== 'climb') {          // chém: khung 0 = lấy đà (tới hitStart), các khung sau chia đều tới hết đòn
            const k = this.whipT < WHIP.hitStart ? -1 : (this.whipT - WHIP.hitStart) / Math.max(1e-6, WHIP.total - WHIP.hitStart);
            if (this.whipDir === 1) return { a: 'slashUp', i: k < 0 ? 0 : Math.min(HERO_ANIMS.slashUp.n - 1, 1 + Math.floor(k * (HERO_ANIMS.slashUp.n - 1))) };
            return { a: 'slash', i: k < 0 ? 0 : Math.min(HERO_ANIMS.slash.n - 1, 1 + Math.floor(k * (HERO_ANIMS.slash.n - 1))) };
        }
        if (s === 'hang' || s === 'cling') return { a: 'fall', i: 0 };                  // tạm: chưa có khung bám mép
        if (s === 'climb') return { a: 'idle', i: 0, flip: Math.floor(this.y / 6) % 2 === 1 };       // tạm: chưa có khung leo thang — lật qua lại theo quãng leo
        if (s === 'duck') return { a: 'idle', i: 0, squash: 0.8 };                       // tạm: chưa có khung cúi — idle ép thấp lại
        if (s === 'air') return this.vy < 0 ? { a: 'jump', i: this.vy < -110 ? 0 : this.vy < -40 ? 1 : 2 } : { a: 'fall', i: Math.floor(t * 6) % HERO_ANIMS.fall.n };
        if (s === 'run') return { a: 'run', i: Math.floor(this.stateT * (7 + vx / 180 * 6)) % HERO_ANIMS.run.n };
        return { a: 'idle', i: Math.floor(t * 5) % HERO_ANIMS.idle.n };
    }
    // Vẽ một khung 1:1 trên canvas nội bộ (khung fw×fh điểm = fw/RES × fh/RES pixel logic), chân ở đáy hitbox, tâm hitbox ở giữa khung, lật theo hướng nhìn. white = bóng trắng (chớp khi bị đánh).
    blitFrame(ctx, alpha, fr, white) {
        const A = HERO_ANIMS[fr.a]; if (!A) return false;
        const img = white ? assetWhite(A.img) : assetGet(A.img); if (!img) return false;
        const cx = Math.round((this.drawX(alpha) + this.w / 2) * RES) / RES, by = Math.round((this.drawY(alpha) + this.h) * RES) / RES;
        const dw = A.fw / RES, dh = A.fh / RES, left = (this.facing < 0) !== !!fr.flip;
        ctx.save(); ctx.translate(cx, by);
        if (fr.lie) { ctx.translate(0, -dw / 2); ctx.rotate(this.facing < 0 ? -Math.PI / 2 : Math.PI / 2); }     // chết: nằm ngang trên đất

    }
    // Vệt gió chém kéo dài hình kiếm ra tới hết tầm hộp đòn (hình kiếm trên ảnh ngắn hơn hộp đòn cũ của roi). Chỉ trang trí.
    // v0.37b: VỆT CHÉM lưỡi liềm kiểu Hollow Knight, chuyển từ Metroidvania Player.drawSlash (dùng chung fxCrescent của 09a): quét nhanh ra phía trước rồi mảnh dần và tan; ba lớp quầng / thân / lõi + tia sáng ở đầu lưỡi.
    //   Cỡ khớp hitbox Honzy: ngang với tới tâm ± WHIP.fx1 (+ chargeReach khi đòn nạp), lên với tới tâm − |WHIP.uy0|. Đòn nạp màu cam. Chỉ HÌNH: hitbox / thời gian đòn không đổi. Thời gian vệt SLASH_FX.dur (khớp heroActionLights).
    slashFx(ctx, alpha) {

        const s1 = ease, s0 = Math.max(Math.max(0, s1 - 0.72), k > 0.55 ? (k - 0.55) / 0.45 * 0.9 : 0);
        const mx = this.drawX(alpha) + this.w / 2, my = this.drawY(alpha) + this.h / 2, f = this.facing >= 0 ? 1 : -1, P = this.whipPower ? WHIP.chargeReach : 0, pw = this.whipPower;
        let cx, cy, rx, ry, t0, t1, fx = f;

        else { cx = mx - f * 3; cy = my + 1; rx = WHIP.fx1 + 3 + P; ry = 10 + P * 0.3; t0 = -1.15; t1 = 1.15; }
        const th = SLASH_FX.th * thin, al = fade, C = pw ? (bladeCol(this) || SLASH_FX.power) : SLASH_FX.norm;

        if (k < 0.6) {
            const a_ = t0 + (t1 - t0) * s1, hx = Math.round(cx + fx * rx * Math.cos(a_)), hy = Math.round(cy + ry * Math.sin(a_));

    }
    // H4c: thanh nạp nhỏ trên đầu (chỉ trang trí): xám = đang nạp, vàng nhấp nháy = đã đầy
    chargeFx(ctx, alpha) {
        if (this.chargeT < 0) return;
        const k = clamp(this.chargeT / WHIP.chargeT, 0, 1), x = Math.round(this.drawX(alpha) + this.w / 2) - 6, y = Math.round(this.drawY(alpha)) - 5;
        ctx.save(); ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x - 1, y - 1, 14, 4);
        { const bc = bladeCol(this); ctx.fillStyle = k >= 1 ? (Math.floor(game.time * 16) % 2 ? (bc ? bc[0] : '#ffe86a') : (bc ? bc[1] : '#fff6c8')) : '#9ab0d0'; } ctx.fillRect(x, y, Math.round(12 * k), 2); ctx.restore();
    }
    // Món đang chọn (chỉ bom / dây; kiếm đã đeo sẵn sau lưng trong ảnh hero): hero áo choàng không lộ tay nên quả bom / cuộn dây được vẽ ÔM TRƯỚC NGỰC (dưới mặt, đè lên áo).
    //   Toạ độ tính theo sprite 26×28 (vẽ 1:1, RES = 2 → 13×14 pixel logic, chân ở đáy hitbox, tâm ở giữa): ngực trước ≈ lệch +1…+4,5 ngang, cao 3…7 px tính từ chân. Chỉ trang trí, không đổi hitbox / vật lý.
    equipHandFx(ctx, alpha, fr, white) {
        const eq = this.activeEquip();
        if (eq === 'sword' || this.dead || this.hold || white || fr.lie || this.whipT >= 0 || this.dashT > 0) return;
        const s = this.state; if (s === 'hang' || s === 'cling' || s === 'climb' || s === 'stun') return;
        const f = this.facing >= 0 ? 1 : -1, sq = s === 'duck' ? 0.8 : 1;
        const bob = s === 'run' ? (Math.floor(this.stateT * 14) % 2) * 0.5 : s === 'air' ? (this.vy < 0 ? 0.5 : -0.5) : 0;      // nhấp nhô theo bước chạy / nhảy
        const cx = Math.round((this.drawX(alpha) + this.w / 2) * RES) / RES, by = Math.round((this.drawY(alpha) + this.h) * RES) / RES;
        const ox = cx + f * 0.5, oy = by - 7 * sq + bob;               // góc trên-trái (phía trước) của ô 8×8 nửa-pixel
        const H = (ax, ay, aw, ah, c) => { ctx.fillStyle = c; ctx.fillRect(f > 0 ? ox + ax * 0.5 : ox - (ax + aw) * 0.5, oy + ay * 0.5 * sq, aw * 0.5, ah * 0.5 * sq); };      // lưới nửa-pixel, lật theo hướng nhìn
        if (eq === 'bomb') {
            H(2, 0, 4, 1, '#15151c'); H(1, 1, 6, 6, '#15151c'); H(0, 2, 8, 4, '#15151c'); H(2, 7, 4, 1, '#15151c');                 // thân tròn
            H(1, 1, 5, 1, '#3a3a4a'); H(0, 2, 1, 3, '#3a3a4a'); H(2, 2, 2, 2, '#8a8a9a'); H(2, 2, 1, 1, '#d0d0e0');                 // viền sáng + bóng
            H(5, -2, 1, 2, '#c8a050');                                                                                             // ngòi
            if (Math.floor(game.time * 12) % 2) { H(5, -4, 1, 2, '#ffd24a'); H(4, -3, 1, 1, '#ff8a2a'); } else { H(5, -4, 2, 1, '#ff8a2a'); H(6, -3, 1, 1, '#ffd24a'); }      // tia lửa nhấp nháy
        } else if (eq === 'sub') {
            const sc = SUB[this.sub.id].col; H(3, 0, 2, 2, '#3a3a48'); H(1, 2, 6, 5, sc); H(0, 3, 8, 3, sc); H(2, 3, 1, 2, '#ffffff'); H(2, 7, 4, 1, '#2a2a33');          // bình (màu theo món)
        } else {
            H(2, 0, 4, 1, '#a8743a'); H(1, 1, 6, 6, '#a8743a'); H(0, 2, 8, 4, '#a8743a'); H(2, 7, 4, 1, '#8a5a2a');                 // cuộn dây
            H(3, 3, 2, 2, '#4a2e16'); H(1, 2, 5, 1, '#d8b070'); H(1, 5, 5, 1, '#d8b070'); H(0, 3, 1, 2, '#d8b070');                 // lỗ giữa + vòng sáng
            H(6, 6, 2, 3, '#d8b070'); H(7, 8, 1, 2, '#a8743a');                                                                    // đuôi dây buông xuống
        }
    }
    draw(ctx, alpha) {
        if (this.dashTrail && this.dashTrail.length) dashFxDraw(this, ctx, alpha);                // v0.36: bóng thưa + vệt gió + lưỡi liềm lướt, vẽ SAU LƯNG hero
        const white = this.flashT > 0 && !this.dead;                                      // vừa bị đánh: chớp trắng (hết thì nhấp nháy như cũ)
        if (!white && this.blinkT > 0 && !this.dead && Math.floor(this.blinkT * 20) % 2) return;
        const fr = this.heroFrame();
        if (this.blitFrame(ctx, alpha, fr, white)) { if (this.whipT >= 0 && !fr.lie) this.slashFx(ctx, alpha); this.chargeFx(ctx, alpha); this.equipHandFx(ctx, alpha, fr, white); return; }
        if (typeof drawHeroHp === 'function') { drawHeroHp(this, ctx, alpha); return; }          // vẽ nửa-pixel (06c_sprites); bản 1px bên dưới là dự phòng
        const x = Math.round(this.drawX(alpha) + this.w / 2), y = Math.round(this.drawY(alpha) + this.h);   // gốc = giữa chân
        const f = this.facing, s = this.state, t = game.time;
        const px = (dx, dy, w, h, col) => { ctx.fillStyle = col; ctx.fillRect(f > 0 ? x + dx : x - dx - w, y + dy, w, h); };
        const SKIN = '#f2c59a', HAT = '#b5793a', HAT2 = '#8a5626', SHIRT = '#3f78c8', PANTS = '#5a4632', BOOT = '#2a1e16', EYE = '#1a1220';
        if (s === 'dead') {          // nằm ngang

            ctx.fillStyle = PANTS; ctx.fillRect(x - 8, y - 4, 3, 3); ctx.fillStyle = '#ffffff'; ctx.fillRect(x + 3 * (f > 0 ? 1 : -1) - 1, y - 5, 1, 1); ctx.fillRect(x + 3 * (f > 0 ? 1 : -1) + 1, y - 5, 1, 1);
            return;
        }

        const run = s === 'run' ? Math.floor(t * 12) % 4 : 0;

        if (s === 'climb') { const k = Math.floor(this.y / 5) % 2; px(-4, -4 - k * 2, 3, 4, PANTS); px(1, -4 - (1 - k) * 2, 3, 4, PANTS); px(-4, -1 - k * 2, 3, 1, BOOT); px(1, -1 - (1 - k) * 2, 3, 1, BOOT); }
        else if (s === 'air' || s === 'hang' || s === 'cling') { px(-3, -5, 3, 3, PANTS); px(1, -4, 3, 3, PANTS); px(-3, -2, 3, 2, BOOT); px(2, -1, 3, 1, BOOT); }
        else { const a = run === 1 ? 1 : run === 3 ? -1 : 0; px(-3 + a, -4, 3, 3, PANTS); px(1 - a, -4, 3, 3, PANTS); px(-4 + a, -1, 4, 1, BOOT); px(1 - a, -1, 4, 1, BOOT); }

        px(-4, -10 + crouch, 8, 6 - (duck ? 0 : 0), SHIRT); px(-4, -5 + crouch, 8, 1, '#2a5294');

        else if (s === 'cling') { px(3, -13, 3, 4, SKIN); px(3, -8, 3, 3, SKIN); }
        else if (s === 'climb') { px(-5, -13, 2, 3, SKIN); px(4, -11, 2, 3, SKIN); }

            ctx.fillStyle = '#7a4a22';
            if (front) { const k = clamp((this.whipT - WHIP.hitStart) / 0.08, 0, 1); ctx.fillRect(f > 0 ? x + 6 : x - 6 - Math.round(17 * k), y - 9 + crouch, Math.round(17 * k), 1); }
            else ctx.fillRect(f > 0 ? x - 20 : x + 6, y - 14 + crouch, 14, 1);

        if (s === 'stun') {         // sao quay quanh đầu
            for (let i = 0; i < 3; i++) { const a = t * 6 + i * TAU / 3; ctx.fillStyle = '#ffe86a'; ctx.fillRect(Math.round(x + Math.cos(a) * 6), Math.round(y - 18 + Math.sin(a) * 2), 1, 1); }

    }
}

// ---- Chém trúng mục tiêu (gọi từ dmgStep, 10a_damage). Mỗi nhát trúng mỗi mục tiêu tối đa 1 lần ----
//   H4a: (1) đạn đang bay (Bolt, Shell, Fireball, mũi tên bẫy) bị chém thì BẬT NGƯỢC (whipReflect); (2) vật nhẹ (WHIP_LIGHT) bị chém thì ĐÁNH BAY (whipLaunch). Chỉ đòn chính phía trước / chém lên (b.front) mới tính, vung sau lưng thì không.
const WHIP_LIGHT = new Set(['rock', 'crate', 'corpse']);          // bình KHÔNG nằm đây: bình bị chém vẫn vỡ tại chỗ (hurt → shatter) như trước
// Vector hướng chém: ngang = (facing, 0); chém lên = chếch lên nhẹ về phía trước
function whipDirVec(p, b) { return b.up ? { x: p.facing * 0.5, y: -0.87 } : { x: p.facing, y: 0 }; }
// Phản đòn: trả true nếu e là đạn và đã bị bật ngược
function whipReflect(level, p, e, b) {
    let ok = false;
    if (e.kind === 'bolt' || e.kind === 'fireball') ok = e.owner !== p;
    else if (e.kind === 'shell') ok = e.owner !== p && !(e.boom >= 0);                 // đạn pháo đã nổ thì thôi
    else if (e.kind === 'arrow') ok = e.flying && e.thrower !== p && e.speed > ITEM.impactSpeed;     // mũi tên nằm im / do mình ném thì không
    if (!ok) return false;
    const d = whipDirVec(p, b), v = Math.max(e.speed, WHIP.reflectMin) * WHIP.reflectMul;
    e.vx = d.x * v; e.vy = d.y * v;
    if (e.kind === 'arrow') { e.thrower = p; e.safeT = 0.4; e.hitSet = null; e.flying = true; e.facing = e.vx >= 0 ? 1 : -1; }
    else {
        e.owner = p;                                                                    // đổi chủ: từ giờ hại quái (foeFriendlyFire), không hại người chơi
        if (e.kind === 'bolt') e.life = Math.max(e.life, 0.8);
        else if (e.kind === 'fireball') e.life = Math.max(e.life, 1.0);
        else e.age = Math.min(e.age, e.def.flightT * 0.5);                              // đạn pháo: cho bay thêm một đoạn trước khi nổ
    }
    sndPlay('reflect', { x: e.cx });          // bước 8: tiếng riêng cho chém phản đòn (trước đây dùng 'hit' cao ×1,6)
    level.spawnBurst(e.cx, e.cy, 5, '#fff3b0', 90);
    return true;
}
// Đánh bay vật nhẹ: coi như vừa bị ném (thrower = người chơi, safeT) để dmgImpacts / onHitTarget / onLand của chính vật đó lo phần còn lại
function whipLaunch(level, p, e, b) {
    if (!WHIP_LIGHT.has(e.kind)) return false;
    const mul = (e.throwMul || 1) * (p.whipPower ? WHIP.chargeLaunchMul : 1);          // H4c: đòn nạp hất mạnh hơn; xác to (cấp L) bay ngắn hơn
    e.thrower = p; e.safeT = 10 / 30; e.hitSet = null;
    if (b.up) { e.vx = p.facing * WHIP.launchUpVx * mul; e.vy = WHIP.launchUpVy * mul; }
    else { e.vx = p.facing * WHIP.launchVx * mul; e.vy = WHIP.launchVy * mul; }
    sndPlay('rock', { x: e.cx });
    level.spawnBurst(e.cx, e.cy, 3, e.col, 60);
    return true;
}
// H4c-lửa: châm mọi vũng dầu, thùng dầu và (v0.20) mạng nhện trong vùng lửa (dài hơn lưỡi chém: WHIP.chargeFireReach), có chắn tường. Quái KHÔNG tính ở đây (chỉ trong lưỡi chém, xem playerWhipStep).
function whipIgnite(level, p, b) {
    const R = WHIP.chargeFireReach, f = p.facing >= 0 ? 1 : -1, cx = p.cx, cy = p.cy;
    let fb;
    if (b.up) { const top = cy + WHIP.uy0 - (R - WHIP.fx1); fb = { x: b.x, y: top, w: b.w, h: cy + WHIP.uy1 - top }; }
    else { const x0 = f > 0 ? cx - WHIP.near : cx - R, x1 = f > 0 ? cx + R : cx + WHIP.near; fb = { x: x0, y: b.y, w: x1 - x0, h: b.h + 4 }; }          // ngang: từ sau lưng near px tới R px phía trước; cao thêm 4 px xuống để chạm vũng dầu sát đất
    const clear = e => { const dx = e.cx - cx, dy = e.cy - cy, n = Math.max(1, Math.ceil(Math.hypot(dx, dy) / 4)); for (let i = 1; i < n; i++) { if (level.isSolid(Math.floor((cx + dx * i / n) / TILE), Math.floor((cy + dy * i / n) / TILE))) return false; } return true; };
    for (const e of game.entities.slice()) {
        if (!e.alive || e.holder || !(e.kind === 'oil' || e.kind === 'barrel') || !overlapBox(fb, e) || !clear(e)) continue;
        if (e.kind === 'oil') oilIgnite(e); else e.hurt({ kind: DMG.FIRE, dmg: 1, x: cx, y: cy, by: p });          // thùng vỡ vì lửa → onDie tự châm cả 4 vũng
    }
    if (level.hasWeb) {          // v0.20: mạng nhện trong vùng lửa (có chắn tường) bắt lửa, rồi lan cả cụm (webFireStep, 13j_springs)
        for (let r = Math.floor(fb.y / TILE); r <= Math.floor((fb.y + fb.h - 0.01) / TILE); r++) for (let c = Math.floor(fb.x / TILE); c <= Math.floor((fb.x + fb.w - 0.01) / TILE); c++) {
            if (level.tile(c, r) === T_WEB && clear({ cx: (c + 0.5) * TILE, cy: (r + 0.5) * TILE })) webIgnite(level, c, r, 0);
        }
    }
    const n = Math.max(2, Math.round(fb.w / 8)), up = !!b.up;
    for (let i = 0; i < n; i++) level.spawnBurst(up ? fb.x + fb.w / 2 : fb.x + fb.w * (i + 0.5) / n, up ? fb.y + fb.h * (i + 0.5) / n : fb.y + fb.h / 2, 2, i % 2 ? '#ff9a4a' : '#ffd24a', 70);
    sndPlay('st_burn', { x: cx, p: 1.1, vol: 0.6 });
}
function playerWhipStep(level) {
    const p = game.player; if (!p || p.dead) return;
    const b = p.whipBox(); if (!b) return;
    if (p.whipPower && b.front && !b.up && level.pushes && level.pushes.length) {          // H4c: đòn nạp ngang đẩy khối T_PUSH (tối đa WHIP.chargePush ô; 13f_pushblock lo phần rơi / đè)
        const dir = p.facing >= 0 ? 1 : -1;
        for (const pb of level.pushes) {
            if (p.whipHits.has(pb) || pb.fallT >= 0 || level.tile(pb.c, pb.r) !== T_PUSH) continue;
            if (!overlapBox(b, { x: pb.c * TILE, y: pb.r * TILE, w: TILE, h: TILE })) continue;
            p.whipHits.add(pb);
            let n = 0; while (n < WHIP.chargePush && pushCellFree(level, pb.c + dir, pb.r, true)) { pushMove(level, pb, pb.c + dir, pb.r); n++; }
            if (n) { const x = (pb.c + 0.5 - dir * 0.5) * TILE, y = (pb.r + 1) * TILE; level.spawnDust(x, y, 6, 60, 14); sndPlay('rock', { x, vol: 0.7 }); fxShake(1.5, 0.1); }
        }
    }
    if (p.whipPower && p.blade === 'fire' && !p.whipFireDone && b.front) { p.whipFireDone = true; whipIgnite(level, p, b); }          // H4c-lửa: một lần cho mỗi đòn nạp, TRƯỚC vòng trúng mục tiêu (thùng dầu vỡ vì lửa thì không bị chém lại)
    for (const e of game.entities) {
        if (e === p || !e.alive || e.holder || p.whipHits.has(e)) continue;
        if (b.front && overlapBox(b, e) && (whipReflect(level, p, e, b) || whipLaunch(level, p, e, b))) { p.whipHits.add(e); continue; }
        if (!(e.creature || e.breakOnImpact)) continue;
        if (!overlapBox(b, e)) continue;
        p.whipHits.add(e);
        if (e.hurt({ kind: DMG.WHIP, dmg: (p.weapon === 'machete' ? WPN.macheteDmg : WHIP.dmg) + (p.whipPower ? WHIP.chargeDmgAdd : 0), x: p.cx, y: p.cy, by: p })) {
            const kb = p.whipPower ? WHIP.chargeKbMul : 1;
            if (p.whipPower && p.blade === 'fire' && e.alive && e.creature && !e.boss && !(e.wetT > 0) && !level.inWater(e) && affinityOf(e, 'fire') !== 'resist') { e.burnT = FIRE.burnT; e.burnTick = FIRE.burnTick; }          // quái trong lưỡi chém bắt lửa (13n_fire.fireStep lo nhịp cháy + châm dầu)
            if (p.whipPower && p.blade) bladeHit(level, p, e);          // v0.45: kiếm hệ băng / sét / độc (13s_blade); lửa ở dòng trên
            if (b.up) e.vy -= 80 * kb; else e.vx += p.facing * 60 * kb;          // chém lên hất lên, chém ngang hất ra
            sndPlay('hit', { x: e.cx });
            level.spawnBurst(e.cx, e.cy, 4, e.creature ? '#d23a3a' : e.col, 70);
        }
    }
}

// 09a_abilities — NĂNG LỰC của Honzy: LƯỚT (dash) và NHẢY ĐÔI (doubleJump) là năng lực HỌC ĐƯỢC; LƯỢN (playerGlide) có sẵn từ đầu.
//   Ý + số khởi điểm chuyển từ Metroidvania (09_player.js: startDash / updateDash, nhảy đôi + groundWithin; 13_items_ui.js: bảng nhận năng lực), viết lại cho Player
//   kiểu Spelunky của Honzy. VẬT LÝ HONZY GIỮ NGUYÊN (không đổi PHYS): lướt và nhảy đôi chỉ thêm vào, chỉ chạy khi đã học.
//   Mặc định chưa có năng lực nào => chơi y như trước. Nhận năng lực: hạ boss (ABILITY_REWARD, 01_config) · phím U (debug).
//   Nguyên tắc thiết kế: đường chính của level KHÔNG bao giờ đòi các năng lực này (genReach không tính chúng); chỉ phòng ẩn về sau mới đòi.
//   Kích hoạt lướt (H2; v0.12): CHẠM nhanh nút chạy (Vuông / E; thả ra trong ≤ ABIL.dashTap giây). Giữ lâu hơn = chạy nhanh như cũ. Phím phụ `dash` (C) đã bỏ. Chưa học Lướt thì bấm Vuông / E KHÔNG hiện gì cả.
//   Dữ liệu: game.abilities = { dash, doubleJump } (lưu trong RUN_STORE, trường ab). Số ABIL ở 01_config (bảng G chỉnh được).
//   Móc vào Player: constructor (dashT, dashCd, dashDir, dashUsed, djUsed) · update() gọi abilityStep() · stepMove() gọi playerDoubleJump() · stun()/die() xoá dashT.

function abilitiesNone() { return { dash: false, doubleJump: false }; }

function abilityGrant(id, announce) {

    if (!game.abilities) game.abilities = abilitiesNone();

}

function abilityReward(levelIdx) { const id = ABILITY_REWARD[BOSS_LEVELS[levelIdx]]; if (id) abilityGrant(id, true); }

// ---- Nhảy đôi ----
// Gọi trong Player.stepMove NGAY SAU khối nhảy thường: phím nhảy còn nhớ (bufferT > 0) mà không có đất / coyote để nhảy thường => dùng nhảy đôi.
function playerDoubleJump(p, level, wasGround) {
    if (!abilityHas('doubleJump') || p.djUsed || wasGround || p.coyoteT > 0 || p.bufferT <= 0 || p.dropT > 0) return false;
    if (gearHas(p, 'jetpack') || p.jetOn) return false;                    // bộ phản lực dùng cùng phím nhảy: giữ nguyên hành vi cũ
    if (level.inWater(p)) return false;                                     // trong nước, bấm nhảy = đạp nước (đã có)
    if (p.vy > 0 && boxHitsSolid(level, p.x, p.y + p.h, p.w, ABIL.djNearGround)) return false;      // sắp chạm đất: để phím đã nhớ cho cú nhảy thường
    p.vy = PHYS.jumpV * ABIL.djMul * gearJumpMul(p);
    p.jumpHeld = true; p.jumpT = 0; p.bufferT = 0; p.djUsed = true; p.fallT = 0;
    sndPlay('djump', { x: p.cx });
    for (let i = 0; i < 5; i++) level.fx.push({ x: p.cx + (i - 2) * 2, y: p.y + p.h, vx: (i - 2) * 22, vy: 25 + game.rngFx.next() * 20, life: 0.28, max: 0.28, size: 2, col: '#cfe3ff' });
    return true;
}

// ---- Lượn (H3, A5) ----
// CÓ SẴN TỪ ĐẦU (không cần học, không nằm trong game.abilities). Giữ ↑ khi đang rơi => vận tốc rơi kẹp ở ABIL.glideVy, hết sát thương rơi (fallT = 0).
// Gọi từ gearAir (13m_gear) mỗi khung, sau khối bộ phản lực; thay nhánh áo choàng (cape) cũ. Thang ưu tiên hơn lượn: tryClimb chạy sau gearAir trong stepMove
// nên nếu ↑ đang bám được thang thì trạng thái đổi sang leo và không lượn nữa. Không tính vào genReach (đường chính không đòi lượn).

    if (on) { p.vy = ABIL.glideVy; p.fallT = 0; }

}

// ---- Lướt ----
const DASH_STATES = { stand: 1, run: 1, duck: 1, air: 1 };       // chỉ lướt từ các trạng thái này (không lướt khi bám mép / leo / choáng / chết)
// Gọi đầu Player.update (sau khi loại chết/choáng). Trả true nếu khung này đang lướt (Player.update bỏ qua phần còn lại).
function abilityStep(p, level, dt) {

    if (p.onGround || p.state === 'hang' || p.state === 'climb' || p.state === 'cling') { p.djUsed = false; p.dashUsed = false; }
    // v0.37 (ý từ Metroidvania: dashBuf): đọc phím lướt MỖI KHUNG, kể cả lúc đang lướt / đang hồi chiêu, rồi NHỚ trong ABIL.dashBuf giây — trước đây chạm nút trong lúc lướt hay sát hết hồi chiêu bị bỏ mất nên không lướt liên tục được.
    //   Đếm riêng thời gian giữ nút chạy (tapT) vì runHeldT chỉ cập nhật sau abilityStep và bị dashStart xoá.
    if (p.whistleCd > 0) p.whistleCd -= dt;
    if (inp.pressed('dash') && inp.held('down') && !p.hold) { whistleTry(p); }          // v0.44: ↓ + Vuông / E = HUÝT SÁO (luôn dùng được, không cần học lướt)
    else if (inp.pressed('dash')) p.dashBufT = ABIL.dashBuf + (p.dashT > 0 ? p.dashT + ABIL.dashCd : Math.max(0, p.dashCd)); else if (p.dashBufT > 0) p.dashBufT -= dt;           // bấm lúc đang lướt / hồi chiêu: nhớ cho tới khi sẵn sàng + dashBuf (Metroidvania chỉ nhớ 0,1 s nên hồi chiêu 0,35 s vẫn làm mất lệnh)           // phím riêng 'dash': mặc định TRỐNG, chỉ có tác dụng nếu người chơi tự gán
    if (p.dashT > 0) return dashStep(p, level, dt);
    if (p.dashBufT <= 0) return false;
    if (!abilityHas('dash')) { p.dashBufT = 0; return false; }              // chưa học: IM LẶNG (không thông báo gì, người chơi chưa biết hero sẽ có Lướt)
    if (p.shocked()) { p.dashBufT = 0; p.shockDeny(); return false; }        // bước 6 (A15): dính Giật thì không lướt khởi động được (cú lướt đang chạy thì lướt nốt, xem dashT ở trên)
    if (!DASH_STATES[p.state] || p.dashCd > 0 || (p.dashUsed && !p.onGround)) return false;           // chưa đủ điều kiện: giữ lệnh nhớ tới khi hết dashBuf

function dashStart(p, level) {

    p.whipT = -1; p.whipBuf = 0; p.jumpHeld = false; p.bufferT = 0; p.runHeldT = 0; p.dashBufT = 0; p.tapT = 0;         // lướt cắt đòn chém, bỏ nhảy đang nhớ; xoá thời gian giữ nút chạy (khỏi cộng dồn sang lần giữ sau)
    p.invulnT = Math.max(p.invulnT, ABIL.dashInv);
    if (p.dashTrail) p.dashTrail.length = 0;
    sndPlay('dash', { x: p.cx });

}
function dashStep(p, level, dt) {
    p.dashT -= dt;

    physMove(level, p, dt);
    if ((p.dashDir > 0 && p.hitR) || (p.dashDir < 0 && p.hitL)) p.dashT = 0;           // đụng tường: dừng lướt
    dashFxPush(p);
    if (Math.floor(p.stateT * 60) % 2 === 0) level.fx.push({ x: p.cx - p.dashDir * 3, y: p.cy + (game.rngFx.next() - 0.5) * 8, vx: -p.dashDir * 25, vy: 0, life: 0.18, max: 0.18, size: 3, col: '#cfe3ff' });

}
function dashEnd(p) {

    p.limit = Math.max(p.limit, Math.abs(p.vx));                                              // để stepMove không kẹp mất đà ngay khung sau
}

// ---- Hiệu ứng lướt (v0.36; ý + số từ Metroidvania 09_player.drawDashFx, 15_fx_weather.fxCrescent; thu nhỏ theo hitbox 10×15 của Honzy) ----
//   Chỉ HÌNH: không đụng vật lý / hitbox / rng chơi. Ba lớp vẽ SAU LƯNG hero: (1) bóng thưa tô xanh nhạt, mờ nhanh · (2) vài vệt gió mảnh nhọn đuôi sau lưng · (3) lưỡi liềm xé gió ở phía trước trong ~0,1 s đầu.
//   Vết (dashTrail) ghi theo game.time nên dừng khi game dừng; vẽ cũ hơn DASH_FX.life giây thì bỏ.
const SLASH_FX = { dur: 0.18, th: 6, norm: ['#7ec8ff', '#dff3ff'], power: ['#ff9a3a', '#ffe0a8'] };          // v0.37b: vệt chém lưỡi liềm (09_player.slashFx): dur = thời gian vệt (s) · th = độ dày lớn nhất (px) · [quầng, thân]
const DASH_FX = { life: 0.2, ghostEvery: 4, streaks: 7, max: 40, crescentT: 0.1 };
// Lưỡi liềm thon hai đầu: cung elip tâm (cx, cy) bán kính rx × ry từ góc t0 tới t1; s0..s1 = đoạn hiện ra (0..1), dày nhất ở giữa cung; mờ dần từ đầu (đậm) về đuôi. fx = ±1 lật ngang.
function fxCrescent(g, cx, cy, rx, ry, t0, t1, fx, th, s0, s1, col, a, n) {
    if (a <= 0.01 || s1 <= s0 || th <= 0.2) return;

    }

}
// Mỗi bước lướt ghi một điểm vết (dashStep gọi)
function dashFxPush(p) {
    const tr = p.dashTrail || (p.dashTrail = []), now = game.time;
    while (tr.length && (now - tr[0].t0 > DASH_FX.life + 0.05 || tr.length >= DASH_FX.max)) tr.shift();
    tr.push({ x: p.x, y: p.y, face: p.dashDir, t0: now });
}
// Gọi ĐẦU Player.draw (trước hero)
function dashFxDraw(p, ctx, alpha) {
    const tr = p.dashTrail; if (!tr || !tr.length) return;
    const now = game.time, last = tr[tr.length - 1];
    if (now - last.t0 > DASH_FX.life) { tr.length = 0; return; }
    const DA = HERO_ANIMS.dash, tint = assetTint(DA.img, '#a8dcff'), ela = p.dashT > 0 ? ABIL.dashT - p.dashT : 99;
    ctx.save();
    if (tint) for (let j = 0; j < tr.length; j += DASH_FX.ghostEvery) {                 // (1) bóng thưa: cứ N bước một cái
        const g = tr[j], life = 1 - (now - g.t0) / DASH_FX.life; if (life <= 0) continue;
        const cx = Math.round((g.x + p.w / 2) * RES) / RES, by = Math.round((g.y + p.h) * RES) / RES, dw = DA.fw / RES, dh = DA.fh / RES;
        ctx.globalAlpha = 0.3 * life * life; ctx.save(); ctx.translate(cx, by); if (g.face < 0) ctx.scale(-1, 1);
        ctx.drawImage(tint, 1 * DA.fw, 0, DA.fw, DA.fh, -dw / 2, -dh, dw, dh); ctx.restore();
    }
    const fade = 1 - (now - last.t0) / DASH_FX.life;
    if (fade > 0) {                                                                    // (2) vệt gió: dải nhọn đuôi, độ dài theo quãng đã lướt
        const dir = last.face, hx = last.x + p.w / 2, hy = last.y + p.h / 2, run = Math.abs(hx - (tr[0].x + p.w / 2)) + 6, N = DASH_FX.streaks;
        for (let i = 0; i < N; i++) {
            const r1 = hash1(i * 3.17 + 1), r2 = hash1(i * 5.71 + 2), yy = hy + (i / (N - 1) - 0.5) * 15 + (r1 - 0.5) * 2;
            const xs = hx - dir * (1.5 + r1 * 4), len = Math.min(run, 9 + r2 * 24), xe = xs - dir * len, al = (0.55 + 0.4 * r2) * fade;
            ctx.fillStyle = '#7ec8ff'; ctx.globalAlpha = al * 0.25; ctx.beginPath(); ctx.moveTo(xs, yy - 1.5); ctx.lineTo(xe, yy); ctx.lineTo(xs, yy + 1.5); ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#ffffff'; ctx.globalAlpha = al; ctx.beginPath(); ctx.moveTo(xs, yy - 0.6); ctx.lineTo(xe, yy); ctx.lineTo(xs, yy + 0.6); ctx.closePath(); ctx.fill();
        }
    }
    if (ela < DASH_FX.crescentT) {                                                     // (3) lưỡi liềm xé gió lúc bắt đầu
        const u = ela / DASH_FX.crescentT, dir = p.dashDir, cx = p.x + p.w / 2 + dir * (3 + 10 * u), cy = p.y + p.h / 2;

        fxCrescent(ctx, cx - dir * 7, cy, 7 + 16 * u, 9, -0.95, 0.95, dir, 2 * (1 - u * 0.5), 0, 1, '#ffffff', 0.9 * (1 - u), 10);
    }
    ctx.restore();
}

// ---- HUD: biểu tượng năng lực đã có (góc phải) + bảng "ĐÃ HỌC" ----
// v0.36: biểu tượng hình (ý từ Metroidvania drawAbilityIcons) đứng cạnh chữ; mờ đi khi chưa dùng lại được (lướt đang hồi / đã dùng trên không; nhảy đôi đã dùng).

    else { ctx.fillStyle = '#ffe08a'; for (const dy of [0, 4]) { ctx.fillRect(x + 4, y + dy, 2, 1); ctx.fillRect(x + 2, y + dy + 1, 2, 1); ctx.fillRect(x + 6, y + dy + 1, 2, 1); ctx.fillRect(x, y + dy + 2, 2, 1); ctx.fillRect(x + 8, y + dy + 2, 2, 1); } }

    let y = 26; const p = game.player;

        const k = id === 'dash' ? inp.label('dash', 1) : inp.label('jump', 1) + '×2';
        const ok = !p ? true : id === 'dash' ? (p.dashCd <= 0 && (p.onGround || !p.dashUsed)) : (!p.djUsed || p.onGround);

    ctx.globalAlpha = a; ctx.fillStyle = '#ffd24a'; ctx.fillRect(bx, by, bw, 1); ctx.fillRect(bx, by + bh - 1, bw, 1);
    drawText('ĐÃ HỌC: ' + d.name, VIEW_W / 2, by + 7, '#ffd24a', 'center');
    drawText(inp.fill(d.text), VIEW_W / 2, by + 20, '#cfe3ff', 'center');
    ctx.globalAlpha = 1;
}

// 10a_damage — NGUỒN SÁT THƯƠNG CHUNG + vụ nổ + va chạm vật bay (roadmap mục 3.2–3.3).

const DMG_NAMES = { explosion: 'bị nổ', fall: 'rơi quá cao', impact: 'bị vật ném trúng', whip: 'bị quất roi', stomp: 'bị giẫm', spike: 'rơi vào gai', crush: 'bị đè', arrow: 'trúng mũi tên', fire: 'bị cháy', bite: 'bị cắn', ghost: 'bị ma bắt', boss: 'trúng đòn của boss', drown: 'chết đuối', shock: 'bị giật điện', ice: 'bị đóng băng', poison: 'bị nhiễm độc' };

const THING_NAMES = { tongue: 'lưỡi ếch', geodeshard: 'mảnh tinh thể', key: 'chìa khoá', spider: 'nhện', warden: 'Vệ binh đá', queen: 'Bà chúa pha lê', titan: 'Titan núi lửa', wave: 'sóng đất', fallrock: 'đá rơi', shard: 'mảnh tinh thể', spitter: 'quái phun lửa', magmite: 'sên magma', vent: 'miệng phun lửa', wisp: 'hồn lửa', fireball: 'cầu lửa', walker: 'bọ đá', hopper: 'bọ nhảy', chaser: 'quái đuổi', rusher: 'quái húc', guard: 'lính khiên', shooter: 'xạ thủ', mortar: 'pháo thủ', flyer: 'quái bay', diver: 'quái lao', bolt: 'đạn', shell: 'đạn pháo', snake: 'rắn', bat: 'dơi', rock: 'đá', pot: 'bình', arrow: 'mũi tên', bomb: 'bom', player: 'chính mình', gold: 'vàng', princess: 'công chúa', goods: 'hàng', ghost: 'con ma', shopkeeper: 'chủ cửa hàng', pellet: 'đạn chủ cửa hàng' };

// ---- Vụ nổ (SC: oExplosion 48×48, quái −30 máu, người chơi −10 máu + choáng, văng rand(4,6) px/khung ngang, −6 lên) ----
function explode(level, x, y) {
    const R = ITEM.blastR;
    // 1. Phá ô: mọi ô có hình vuông chạm vòng tròn bán kính R
    const c0 = Math.floor((x - R) / TILE), c1 = Math.floor((x + R) / TILE), r0 = Math.floor((y - R) / TILE), r1 = Math.floor((y + R) / TILE);
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
        const nx = clamp(x, c * TILE, (c + 1) * TILE), ny = clamp(y, r * TILE, (r + 1) * TILE);
        if ((nx - x) * (nx - x) + (ny - y) * (ny - y) < R * R) level.breakAt(c, r);
    }
    level.settleAfterBlast(c0 - 1, r0 - 1, c1 + 1, r1 + 2);
    // 2. Mọi Thing chạm vùng nổ: sát thương + văng. Bom khác: châm ngòi ngắn (nổ dây chuyền)
    for (const e of game.entities) {
        if (!e.alive) continue;
        const nx = clamp(x, e.x, e.x + e.w), ny = clamp(y, e.y, e.y + e.h);
        if ((nx - x) * (nx - x) + (ny - y) * (ny - y) >= R * R) continue;
        const dir = e.cx < x ? -1 : 1, kv = ITEM.blastKnockVx * game.rngPlay.range(0.67, 1);
        if (e.holder) e.release();
        if (e.kind === 'oil') { oilIgnite(e); continue; }
        if (e instanceof Bomb) { e.chain(); e.knock(dir * kv, ITEM.blastKnockVy); continue; }
        e.hurt({ kind: DMG.EXPLOSION, dmg: e.creature ? (e === game.player ? ITEM.blastDmg : 30) : 99, x, y });
        if (e.alive) { e.knock(dir * kv, ITEM.blastKnockVy); if (e === game.player && !e.dead) e.stun(100 / 30); }
    }
    // 3. Hình + tiếng
    level.spawnBurst(x, y, 18, '#ffb347', 220); level.spawnBurst(x, y, 10, '#ffe9a8', 140); level.spawnBurst(x, y, 8, '#6a6a6a', 90);
    fxBlast(x, y);
    sndPlay('boom', { x });
    fxShake(5, 0.35);
}

// ---- Vật bay trúng mục tiêu (SC: oItem |vel| > 2 px/khung trúng quái: quái −1 máu, quái nhận 0.3 vận tốc vật) ----
function dmgImpacts(level) {
    const ents = game.entities;
    for (const p of ents) {
        if (!p.alive || p.holder || !p.hurtsOnImpact || p.speed < ITEM.impactSpeed) continue;
        for (const t of ents) {
            if (t === p || !t.alive || t.holder === p || p.holder === t) continue;
            if (!(t.creature || t.breakOnImpact)) continue;
            if (p.kind === 'princess' && t.kind === 'princess') continue;          // thú cưng bay không làm đau công chúa / thú khác
            if (t === p.thrower && p.safeT > 0) continue;
            if (p.noHurtPlayer && t === game.player) continue;          // xác NHỎ: giết quái được nhưng bật lại người chơi thì không mất máu
            if (t.holder && t.holder === p.thrower) continue;          // vật người ném đang cầm
            if (p.hitSet && p.hitSet.has(t)) continue;
            if (TRAP.duckSafe && p.kind === 'arrow' && p.flying && t === game.player && t.state === 'duck') continue;     // cúi xuống: tên bay qua đầu
            if (!overlapBox(p, t)) continue;
            (p.hitSet || (p.hitSet = new Set())).add(t);
            const kind = p.kind === 'arrow' ? DMG.ARROW : DMG.IMPACT;
            if (t.hurt({ kind, dmg: p.impactDmg, x: p.cx, y: p.cy, vx: p.vx, by: p })) {
                t.vx += p.vx * 0.3; if (t === game.player && !t.dead) t.stun(1);
                sndPlay('hit', { x: t.cx });
                level.spawnBurst(t.cx, t.cy, 4, t.creature ? '#d23a3a' : t.col, 80);
                p.vx *= -0.3; p.vy = Math.min(p.vy, -60);
                if (p.onHitTarget) p.onHitTarget(level, t);
            }
        }
    }
}

// ---- Gai (SC: sinh vật đang rơi chạm hộp gai và đã rơi > 4 khung hoặc đang choáng => chết) ----
function dmgSpikes(level) {
    for (const e of game.entities) {
        if (!e.alive || !e.creature || e.holder || e.vy <= 0) continue;
        if (!(e.fallT > PHYS.spikeFallT || e.stunT > 0)) continue;
        const c0 = Math.floor((e.cx - 4) / TILE), c1 = Math.floor((e.cx + 4) / TILE), r0 = Math.floor((e.y + e.h - 8) / TILE), r1 = Math.floor((e.y + e.h) / TILE);
        let hit = false;
        for (let r = r0; r <= r1 && !hit; r++) for (let c = c0; c <= c1; c++) if (level.tile(c, r) === T_SPIKE && e.y + e.h > r * TILE + 6) { hit = true; break; }
        if (hit) { if (e === game.player) { if (e.invulnT > 0) continue; } else e.invulnT = 0; if (e.hurt({ kind: DMG.SPIKE, dmg: 99, x: e.cx, y: e.y + e.h })) { if (e === game.player && !e.dead) playerKnockOut(e, e.cx + (game.rngFx.next() < 0.5 ? -1 : 1)); else { e.vx = 0; e.vy = 0; } level.spawnBurst(e.cx, e.y + e.h, 8, '#d23a3a', 60); sndPlay('spike', { x: e.cx }); } }
    }
}

// ---- Quái chạm người chơi (SC: oEnemy Collision_oCharacter): từ trên xuống = bị đạp; ngang = người chơi bị cắn, choáng ngắn, bất tử 1s ----
// v0.17: quái NHỎ (dơi, rắn) cắn thì choáng và hất người chơi chỉ bằng `mul` so với thường (sát thương không đổi). Chỉ áp dụng cho cú cắn chạm (dmgContacts), không áp dụng cho đạn / xác ném / quái khác.
const SMALL_BITE = { kinds: ['bat', 'snake'], mul: 0.5 };
function dmgContacts(level) {
    const p = game.player; if (!p || p.dead) return;
    for (const e of game.entities) {
        if (!e.alive || !(e instanceof Enemy) || e.holder || e.harmless || !overlapBox(p, e)) continue;
        // Đạp đầu: người chơi đang rơi và chân ở nửa trên của quái
        if (p.vy > 0 && p.py + p.h <= e.py + e.h * 0.5 + 2) {
            const dmg = (Math.floor(p.fallT / PHYS.stunFallT) + 1) * (gearHas(p, 'spike') ? GEAR.spikeStomp : 1);   // SC: hp −= 1 × (floor(fallTimer/16) + 1)
            if (e.hurt({ kind: DMG.STOMP, dmg, x: p.cx, y: p.y + p.h, by: p })) {
                p.vy = ITEM.stompVy - 0.2 * p.vy; p.fallT = 0; p.jumpHeld = false;
                sndPlay('hit', { x: e.cx }); level.spawnBurst(e.cx, e.y, 5, '#d23a3a', 70);
            }
            continue;
        }
        if (p.invulnT > 0 || e.stunT > 0 || e.dmg <= 0) continue;
        if (p.hurt({ kind: DMG.BITE, dmg: e.dmg, x: e.cx, y: e.cy, by: e })) {
            p.invulnT = 1; p.blinkT = 1;                                   // SC: invincible = 30 khung
            const sm = SMALL_BITE.kinds.indexOf(e.kind) >= 0 ? SMALL_BITE.mul : 1;          // dơi / rắn: choáng + hất giảm một nửa
            p.knock((p.cx < e.cx ? -1 : 1) * 180 * sm, -120 * sm);                    // SC: xVel ±6
            if (!p.dead) p.stun(0.4 * sm);
            sndPlay('hurt', { x: p.cx }); fxShake(2, 0.15);
            const st = statusOf(e); if (st && !p.dead) statusApply(p, st);
        }
    }
}

// Quái VÔ TÌNH làm hại công chúa / thú cưng: chỉ khi chạm (quái không đổi AI, không chủ động đuổi). Đang được bế thì an toàn; boss và chủ tiệm không tính.
const RESCUE_HURT = { dmg: 1, invulnS: 1 };
function dmgRescuables(level) {
    for (const t of game.entities) {
        if (!t.alive || t.kind !== 'princess' || t.holder || t.invulnT > 0) continue;
        for (const e of game.entities) {
            if (!e.alive || !(e instanceof Enemy) || e.holder || e.harmless || e.boss || e.isBoss || e.kind === 'shopkeeper' || e.stunT > 0 || e.dmg <= 0) continue;
            if (!overlapBox(t, e)) continue;
            if (t.hurt({ kind: DMG.BITE, dmg: RESCUE_HURT.dmg, x: e.cx, y: e.cy, by: e })) {
                if (t.alive) { t.invulnT = RESCUE_HURT.invulnS; t.blinkT = RESCUE_HURT.invulnS; t.knock((t.cx < e.cx ? -1 : 1) * 120, -90); }
                sndPlay('hurt', { x: t.cx, p: 1.4 }); level.spawnBurst(t.cx, t.cy, 4, '#d23a3a', 70);
            }

        }
    }
}
function dmgStep(level) {
    dmgImpacts(level);
    dmgContacts(level);
    dmgRescuables(level);
    playerWhipStep(level);
    dmgSpikes(level);
}

// ---- Hiệu ứng nhỏ dùng chung (thay 10_combat cũ) ----
function fxShake(amp, t) {
    if (SETTINGS.shake === false) return;
    // A16: tay cầm KHÔNG rung (bỏ gpadRumble); chỉ rung màn hình

}
function fxBlast(x, y) { game.blasts.push({ x, y, t: 0 }); }

// 10b_carry — NHẶT / MANG / NÉM / ĐẶT XUỐNG (dùng cho mọi Thing có carryable: đá, bình, bom, mũi tên… GĐ6: xác quái, người bị nạn).
//   SC: ngồi (↓) + nút hành động (X) để nhặt vật dưới chân (hộp x−8..x+8, y..y+8 quanh tâm người chơi).

//       Vật có noThrow (công chúa): X chỉ đặt nhẹ xuống, không ném.
//       Bị choáng / chết thì đánh rơi vật đang cầm (vật văng theo vận tốc người chơi, −6 lên).

// Vùng nhặt (v0.44): ngang ±halfW px quanh tâm, từ `top` × chiều cao thân trở xuống (trước: ±9 px, nửa thân dưới). Tìm vật nhặt được gần nhất, ưu tiên phía trước mặt

function carryFind(p) {
    const box = { x: p.cx - PICK.halfW, y: p.y + p.h * PICK.top, w: PICK.halfW * 2, h: p.h * (1 - PICK.top) + 2 };          // v0.44: vùng nhặt / mở thùng rộng hơn (không cần đứng đúng)
    let best = null, bd = 1e9;
    for (const e of game.entities) {
        if (!e.alive || e.holder || e === p) continue;
        if (!e.carryable && !e.openable && !carryableFoe(e)) continue;
        if (!overlapBox(box, e)) continue;
        const d = Math.abs(e.cx - p.cx) + Math.abs(e.cy - p.cy) + (e.cx !== p.cx && Math.sign(e.cx - p.cx) !== p.facing ? 6 : 0);          // ưu tiên món ở phía trước mặt
        if (d < bd) { bd = d; best = e; }
    }
    return best;
}
// Quái đang CHOÁNG (stunT > 0.25) nhấc được như một vật; không nhấc boss / chủ cửa hàng / thứ không phải Enemy
function carryableFoe(e) { return e instanceof Enemy && e.kind !== 'shopkeeper' && e.stunT > 0.25 && !e.air; }

    if (!t || t.holder) return false;
    if (t.openable) { t.open(p); return true; }          // v0.44: thùng gỗ không nhấc nữa — ↓ + Tròn mở thẳng (chém vào thùng vẫn hất đi như xác quái)
    p.hold = t; t.holder = p; t.thrower = null; t.vx = t.vy = 0; t.hitSet = null;
    if (t.onPicked) t.onPicked(p);
    sndPlay('ui', { x: p.cx });
    return true;
}
// Ném vật t khỏi tay p (cũng dùng để ném bom vừa lấy ra: bom không qua bước "cầm")
function carryThrow(p, t, up, down) {
    if (t.holder) t.release();
    t.thrower = p; t.safeT = 10 / 30; t.hitSet = null;
    // đặt vật ra trước mặt, không chui vào tường
    let x = p.cx + p.facing * 4 - t.w / 2, y = p.y + 2;
    const level = game.level;
    if (boxHitsSolid(level, x, y, t.w, t.h)) x = p.cx - t.w / 2;
    if (boxHitsSolid(level, x, y, t.w, t.h)) y = p.y + p.h - t.h;
    t.teleport(x, y);
    if (t.noThrow && !(down && p.onGround)) game.pickupMsg = { t: 0, text: 'Không ném được — đặt xuống' };
    if (t.noThrow) { t.vx = 0; t.vy = 0; if (p.onGround) t.teleport(x, p.y + p.h - t.h); }   // vật không ném được: luôn đặt nhẹ xuống
    else if (down && p.onGround) { t.vx = p.facing * ITEM.throwVx * 0.1; t.vy = 0; t.teleport(x, p.y + p.h - t.h); }   // đặt nhẹ xuống
    else {
        t.vx = p.facing * ITEM.throwVx * (t.throwMul || 1) * (gearHas(p, 'mitt') ? GEAR.mittThrow : 1) + p.vx;      // throwMul: xác to ném ngắn hơn
        t.vy = up ? ITEM.throwUpVy : down ? (p.onGround ? ITEM.dropVy : ITEM.throwDownVy) : ITEM.throwVy * (gearHas(p, 'mitt') ? GEAR.mittArc : 1);      // găng ném: nhanh hơn VÀ phẳng hơn (ném gần như thẳng ngang)
        if (down) t.vx *= 0.1;
    }
    if (t.onThrown) t.onThrown(p, !!t.noThrow || (down && p.onGround));      // tham số 2: true = chỉ đặt nhẹ xuống (không phải ném thật)
    const heavy = t.kind === 'corpse' || t.kind === 'princess' || t instanceof Enemy;          // bước 8: ném quái / xác / công chúa-thú cưng = throwFoe; đá, bình, bom… giữ 'rock'; đặt nhẹ xuống cũng giữ 'rock'
    sndPlay(heavy && !t.noThrow && !(down && p.onGround) ? 'throwFoe' : 'rock', { x: p.cx });
}
// Đánh rơi (choáng / chết): vật văng nhẹ theo người
function carryDrop(p) {
    const t = p.hold; if (!t) return;
    t.release(); t.thrower = p; t.safeT = 0.3; t.vx = p.vx; t.vy = -180;
}

// 10c_status — TRẠNG THÁI (GĐ6c; chuyển từ Metroidvania reserve/mv_stash.js khối 7): độc · cháy · chậm · choáng, gắn lên người chơi bởi quái "nguyên tố".
//   Nguyên tố theo vùng (ZONES[].elem): Rừng sâu = độc · Hang pha lê = chậm · Tàn tích = cháy. Quái có ENEMY_DEFS.elemental dùng nguyên tố của vùng; quái có def.status dùng riêng (quái phun lửa luôn cháy).
//   Gắn khi đòn của quái TRÚNG (chạm, đạn, đạn pháo, cầu lửa). Độc/cháy trừ 1 máu theo nhịp nhưng KHÔNG giết (dừng ở 1 máu, STATUS.lethal = false — bật true để thử khó hơn). Chậm: tốc đi ×0,6.
//   Nước dập lửa và rửa độc. Sinh ra từ dự án cũ: số liệu giữ nguyên.
const ELEMENTS = {
    poison: { name: 'Độc', col: '#7be06a' }, burn: { name: 'Cháy', col: '#ff9a4a' }, slow: { name: 'Chậm', col: '#6fa8ff' },
    shock: { name: 'Giật', col: '#ffe45a' }, stun: { name: 'Choáng', col: '#c070ff' }
};
function elemCol(el) { return el && ELEMENTS[el] ? ELEMENTS[el].col : null; }
const STATUS = {
    slow: { dur: 2.5, runMul: 0.6 },
    poison: { dur: 5, tick: 1.5, dmg: 1 },
    burn: { dur: 1.0, tick: 0.9, dmg: 1 },          // v0.17: 1,0 s < 2 nhịp (0,9 s) → mỗi lần bắt lửa chỉ mất ĐÚNG 1 máu (trước: 1,9 s = 2 máu). Đứng yên trong lửa thì hết giờ rồi bắt lại → vẫn mất tiếp.
    stun: { dur: 0.6, imm: 2.0 },
    shock: { dur: 2.5 },

const STACK = { addMul: 0.5, maxMul: 2 };          // v0.39: cộng dồn thời lượng trạng thái (xem statusApply)
const STATUS_ORDER = ['stun', 'shock', 'burn', 'poison', 'slow'];
const STATUS_SND = { poison: 'st_poison', burn: 'st_burn', slow: 'st_slow', stun: 'st_stun', shock: 'st_shock' };

function statusOf(e) {
    const d = e && e.def; if (!d) return null;
    if (d.status) return d.status;
    return d.elemental ? (zoneOf(game.levelIdx).elem || null) : null;
}
// v0.38 (Roadmap bước 8, E2): NGUYÊN TỐ ĐÒN của quái, gọi theo tên nguyên tố sát thương ('fire' · 'poison' · 'ice' · 'shock'), cùng hệ tên với affinityOf / dmgElement (11_enemies) — khác statusOf trả tên TRẠNG THÁI ('burn' · 'slow'…).
//   def.attackElem ghi đè (cho quái đặc biệt, ví dụ Băng / Sét sau này); không có thì suy từ statusOf. null = đòn không mang nguyên tố.
const STATUS_ELEM = { burn: 'fire', poison: 'poison', slow: 'ice', shock: 'shock' };
function attackElem(e) {
    const d = e && e.def; if (!d) return null;
    if (d.attackElem !== undefined) return d.attackElem;
    const st = statusOf(e); return st && STATUS_ELEM[st] ? STATUS_ELEM[st] : null;
}
// ---- SÉT (v0.39, Roadmap bước 12 / E3; ý từ status.js của Diablo: tia sét `fxBolts`) ----
//   shockWater: điện chạy khắp KHỐI NƯỚC liền nhau (BFS 4 hướng trên ô T_WATER, tối đa SHOCK.waterCap ô cho khỏi giật hình) bắt đầu từ ô nước chứa nguồn `src`; mọi sinh vật đứng trong khối nước đó
//   (người chơi + quái, trừ nguồn và quái kháng Sét) nhận DMG.SHOCK `dmg`; người chơi trúng thì dính Giật (statusApply). Trả số ô nước + số sinh vật bị giật.

        const p = game.player, d = this.def;
        const dist = p ? Math.hypot(p.cx - this.cx, p.cy - this.cy) : 1e9;
        const ceil = level.solidAt(this.cx, this.y - 1);
        if (this.st === 'hang') {
            this.vx = this.vy = 0;
            if (p && !p.dead && ((dist < 90 && p.cy > this.cy + 16) || !ceil)) { this.st = 'fly'; sndPlay('alert', { x: this.cx, vol: 0.5 }); }
        } else {
            if (p && !p.dead && dist < 160) {
                let ang = Math.atan2(p.cy - this.cy, p.cx - this.cx);
                // SC: bị tường chắn thì bay thẳng lên/xuống; bị trần/sàn chắn thì bay ngang
                if ((this.hitR && p.cx > this.cx) || (this.hitL && p.cx < this.cx)) ang = p.cy < this.cy ? -Math.PI / 2 : Math.PI / 2;
                if ((this.hitU && p.cy < this.cy || this.hitDown && p.cy > this.cy) && Math.abs(p.cx - this.cx) > 8) ang = p.cx < this.cx ? Math.PI : 0;
                this.vx = Math.cos(ang) * d.speed; this.vy = Math.sin(ang) * d.speed;
            } else if (ceil) { this.st = 'hang'; this.vx = this.vy = 0; }
            else { this.vx = 0; this.vy = -d.speed; }
            this.facing = p && p.cx < this.cx ? -1 : 1;
        }
        if (this.stunT > 0) { this.stunT -= dt; this.vy += 300 * dt; }
