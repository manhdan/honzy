    }
    attach(level) {
        const c = Math.floor(this.cx / TILE); let r = Math.floor(this.cy / TILE);
        if (level.isSolid(c, r)) r++;
        this.anchor = { c, r }; this.vx = this.vy = 0;
        this.teleport(c * TILE + TILE / 2 - 2, r * TILE);
        sndPlay('step', { x: this.cx, p: 0.7 });
    }
    draw(ctx, alpha) {
        if (this.anchor) return;
        if (ITEM_HP) { drawRopeThrowHp(this, ctx, alpha); return; }
        if (this.anchor) return;
        const x = Math.round(this.drawX(alpha)), y = Math.round(this.drawY(alpha));
        ctx.fillStyle = '#c9a46a'; ctx.fillRect(x, y, 4, 4); ctx.fillStyle = '#8a6a3a'; ctx.fillRect(x + 1, y + 4, 2, 6);
    }
}
// Người chơi bấm nút dây. down = thả từ mép trước mặt. Trả về true nếu đã dùng 1 dây.
function ropeThrow(level, p, down) {
    if (down && p.onGround) {
        const c = Math.floor((p.cx + p.facing * TILE * 0.75) / TILE), r = Math.floor(p.cy / TILE);
        if (level.isSolid(c, r)) return false;
        const rt = entAdd(new RopeThrow(c * TILE + 6, r * TILE)); rt.anchor = { c, r }; sndPlay('step', { x: p.cx, p: 0.7 });
        return true;
    }
    if (level.solidAt(p.cx, p.y - 2)) return false;          // SC: sát trần thì không ném lên được
    const rt = entAdd(new RopeThrow(p.cx - 2, p.y));
    rt.vy = ITEM.ropeThrowVy; sndPlay('swing', { x: p.cx, p: 0.8 });
    return true;
}

// Xác quái (lần 18): nhấc lên ném như vật nặng (trúng quái khác gây 1 sát thương), tan sau 25 giây
class Corpse extends Thing {
    // tier: 'S' nhỏ / 'M' vừa / 'L' to (CORPSE_TIERS ở 10c_status): quyết định hitbox, mass, sát thương ném, lực ném, hình vẽ. srcKind: loại quái gốc, chỉ để vẽ chi tiết đặc trưng (drawCorpseHp)
    constructor(cx, bottom, col, tier, srcKind) {
        const T = CORPSE_TIERS[tier] || CORPSE_TIERS.M;
        super(cx - T.w / 2, bottom - T.h, T.w, T.h, { kind: 'corpse', carryable: true, hurtsOnImpact: true, impactDmg: T.impactDmg, mass: T.mass, col: col, dmgFrom: [] });
        this.age = 0; this.srcKind = srcKind || ''; this.tier = CORPSE_TIERS[tier] ? tier : 'M'; this.throwMul = T.throwMul; this.noHurtPlayer = !!T.harmless;      // noHurtPlayer: bật lại trúng người chơi không mất máu (10a_damage)
    }
    update(level, dt) { if ((this.age += dt) > 25 && !this.holder) { this.alive = false; return; } super.update(level, dt); }
    draw(ctx, alpha) {
        if (typeof drawCorpseHp === 'function') { drawCorpseHp(this, ctx, alpha); return; }
        const x = Math.round(this.drawX(alpha)), y = Math.round(this.drawY(alpha));
        ctx.globalAlpha = this.age > 20 ? 0.5 : 1; ctx.fillStyle = this.col; ctx.fillRect(x, y + 2, this.w, this.h - 2); ctx.fillStyle = '#d23a3a'; ctx.fillRect(x + 1, y + this.h - 3, this.w - 2, 1);
        ctx.fillStyle = '#1a1a22'; ctx.fillRect(x + 2, y + 3, 2, 1); ctx.fillRect(x + this.w - 4, y + 3, 2, 1); ctx.globalAlpha = 1;
    }
}

// 13b_traps — bẫy theo cảm biến (GĐ1: bẫy mũi tên; GĐ5: tảng đá, nghiền, giáo…).
//   Bẫy mũi tên (SC oArrowTrap): ô đặc, mặt bắn quay trái ('<') hoặc phải ('>'). Tầm cảm biến = từ mặt bẫy tới ô đặc đầu tiên, tối đa TRAP.arrowRange (96px).
//   Kích hoạt khi BẤT KỲ vật nào ĐANG CHUYỂN ĐỘNG (người chơi, quái, đá đang bay, bình…) cắt đường cảm biến ngang giữa ô. v0.18: bắn xong chờ TRAP.rearmT (15 s) rồi nạp lại; bom KHÔNG phá được.
//   v0.18: HỘP BẮN TÊN (ArrowBox) — hầu hết bẫy ô trong tường được đổi thành vật nhặt / mang / ném / đặt được (arrowBoxesSpawn, gọi cuối spawnObjects). Bẫy không nằm lọt trong tường (thiếu tường sau / trên / dưới) giữ nguyên là ô cố định để không đổi hình học level.
//   Mẹo đúng như gốc: ném đá / bình qua tầm cảm biến để bẫy bắn hụt trước khi mình đi qua.

// Tính tầm cảm biến (px) của bẫy tr trong level
function trapRange(level, tr) {
    const y = tr.r * TILE + TILE / 2;
    let x = tr.dir > 0 ? (tr.c + 1) * TILE : tr.c * TILE, d = 0;
    while (d < TRAP.arrowRange) { const sx = tr.dir > 0 ? x + d + 0.5 : x - d - 0.5; if (level.solidAt(sx, y)) break; d += 1; }
    return d;
}
// Hộp cảm biến của bẫy (dải cao 2px giữa ô, dài = tầm)
function trapSensor(tr) {
    const y = tr.r * TILE + TILE / 2 - 1, face = tr.dir > 0 ? (tr.c + 1) * TILE : tr.c * TILE;
    return { x: tr.dir > 0 ? face : face - tr.range, y, w: tr.range, h: 2 };
}
function trapStep(level) {
    for (const tr of level.traps) {
        if (tr.fired) { if (tr.cd > 0) { tr.cd -= STEP; if (tr.cd <= 0) { tr.cd = 0; tr.fired = false; } } continue; }          // v0.18: nạp lại sau TRAP.rearmT
        if (level.tile(tr.c, tr.r) !== T_ARROW) { tr.fired = true; tr.cd = 0; continue; }
        if (level.version !== tr.ver) { tr.range = trapRange(level, tr); tr.ver = level.version; }      // đất trước mặt bị phá: tầm đổi
        if (tr.warn > 0) { tr.warn -= STEP; if (tr.warn <= 0) { tr.warn = 0; trapFire(level, tr); } continue; }      // đang báo trước (đá rung/lóe đỏ) rồi mới bắn
        const s = trapSensor(tr);
        for (const e of game.entities) {
            if (!e.alive || !e.triggersTraps || !e.moving) continue;
            if (!overlapBox(s, e)) continue;
            if (TRAP.warnT > 0) { tr.warn = TRAP.warnT; sndPlay('alert', { x: tr.c * TILE, vol: 0.6 }); } else trapFire(level, tr);
            break;
        }
    }
}
function trapFire(level, tr) {
    tr.fired = true; tr.cd = TRAP.rearmT;
    const face = tr.dir > 0 ? (tr.c + 1) * TILE + 1 : tr.c * TILE - 9, y = tr.r * TILE + TILE / 2 - 1;
    const a = entAdd(new Arrow(face, y, tr.dir)); a.vx = tr.dir * TRAP.arrowV; a.vy = 0; a.thrower = null;
    sndPlay('arrowShot', { x: face });          // bước 8: tiếng bắn tên riêng (trước đây 'shoot' chung với súng)
}

// Báo trước: khối bẫy lóe đỏ + chấm than phía trước mặt bẫy (vẽ động, ngoài bộ nhớ đệm ô)
function drawTrapWarn(ctx, level) {
    for (const tr of level.traps) {
        if (!(tr.warn > 0) || tr.fired) continue;
        const x = tr.c * TILE, y = tr.r * TILE, on = Math.floor(tr.warn * 24) % 2 === 0;
        ctx.fillStyle = on ? 'rgba(255,70,50,0.55)' : 'rgba(255,200,60,0.4)'; ctx.fillRect(x, y, TILE, TILE);
        const fx = tr.dir > 0 ? x + TILE + 3 : x - 5;
        ctx.fillStyle = '#ff5a3a'; ctx.fillRect(fx, y + 3, 2, 6); ctx.fillRect(fx, y + 11, 2, 2);
    }
}

// ---- HỘP BẮN TÊN (v0.18) ----
//   Vật nhặt được (↓ + O), mang, ném, đặt. Bom KHÔNG phá (dmgFrom rỗng: nổ chỉ hất văng). Bắn mũi tên (Arrow, 13a) theo hướng `dir` khi có vật ĐANG CHUYỂN ĐỘNG cắt đường cảm biến phía trước; bắn xong nạp lại sau TRAP.rearmT giây.
//   Hướng: đặt nhẹ (↓ + O) = cùng hướng mặt người chơi; RƠI (ném, bị đánh rơi, mất chỗ tựa) = ngẫu nhiên trái / phải lúc chạm đất (game.rngPlay, có seed); hộp có sẵn trong level giữ hướng của ô.
//   Chỉ bắn khi đang nằm yên trên đất và không ai cầm; sau khi rời tay có armT = 0,6 s chưa bắn (đặt xong khỏi bị bắn ngay).
class ArrowBox extends Thing {
    constructor(x, y, dir) {
        super(x, y, 12, 12, { kind: 'arrowbox', carryable: true, hurtsOnImpact: true, impactDmg: 1, mass: 1, col: '#6e6258', dmgFrom: [] });
        this.dir = dir >= 0 ? 1 : -1; this.facing = this.dir; this.cd = 0; this.warn = 0; this.armT = 0;
    }
    release() { const h = this.holder; super.release(); if (h) this.armT = 0.6; }
    onPicked(p) { this.warn = 0; }
    onThrown(p, soft) { if (soft) this.dir = p.facing >= 0 ? 1 : -1; }          // đặt nhẹ: cùng hướng mặt người chơi (ném thật: hướng chọn ngẫu nhiên lúc chạm đất, onLand)
    onLand(level, v) { this.dir = game.rngPlay.sign(); }
    sensor(level) {
        const d = this.dir, y = this.cy - 1, x0 = d > 0 ? this.x + this.w : this.x;
        let n = 0; while (n < TRAP.arrowRange) { const sx = d > 0 ? x0 + n + 0.5 : x0 - n - 0.5; if (level.solidAt(sx, y)) break; n++; }
        return { x: d > 0 ? x0 : x0 - n, y, w: n, h: 2 };
    }
    fire(level) {
        const d = this.dir, face = d > 0 ? this.x + this.w + 1 : this.x - 9, y = this.cy - 1;
        if (boxHitsSolid(level, face, y, 8, 3)) return;          // sát tường: không bắn
        this.cd = TRAP.rearmT;
        const a = entAdd(new Arrow(face, y, d)); a.vx = d * TRAP.arrowV; a.vy = 0; a.thrower = null;
        sndPlay('arrowShot', { x: face });
    }
    update(level, dt) {
        super.update(level, dt);
        if (!this.alive) return;
        this.facing = this.dir;
        if (this.cd > 0) this.cd = Math.max(0, this.cd - dt);
        if (this.armT > 0) this.armT -= dt;
        if (this.holder) return;
        if (this.warn > 0) { this.warn -= dt; if (this.warn <= 0) { this.warn = 0; this.fire(level); } return; }
        if (this.cd > 0 || this.armT > 0 || !this.onGround) return;
        const s = this.sensor(level); if (s.w <= 0) return;
        for (const e of game.entities) {
            if (e === this || !e.alive || !e.triggersTraps || !e.moving || !overlapBox(s, e)) continue;
            if (TRAP.warnT > 0) { this.warn = TRAP.warnT; sndPlay('alert', { x: this.cx, vol: 0.6 }); } else this.fire(level);
            break;
        }
    }
    draw(ctx, alpha) {
        const x = Math.round(this.drawX(alpha)), y = Math.round(this.drawY(alpha)), f = this.dir, ready = this.cd <= 0, flash = this.warn > 0 && Math.floor(this.warn * 24) % 2 === 0;
        ctx.fillStyle = '#2e2a26'; ctx.fillRect(x, y, 12, 12);
        ctx.fillStyle = flash ? '#ff5a3a' : ready ? '#6e6258' : '#46423e'; ctx.fillRect(x + 1, y + 1, 10, 10);
        ctx.fillStyle = ready ? '#8e8274' : '#5a5650'; ctx.fillRect(x + 1, y + 1, 10, 1); ctx.fillRect(x + 1, y + 1, 1, 10);
        ctx.fillStyle = '#14100d'; ctx.fillRect(f > 0 ? x + 8 : x, y + 4, 4, 4);          // nòng ở mặt bắn
        if (ready) { ctx.fillStyle = '#c9b48a'; ctx.fillRect(f > 0 ? x + 8 : x + 2, y + 5, 2, 2); }
        else { ctx.fillStyle = '#ffb347'; ctx.fillRect(x + 1, y + 10, Math.round(10 * (1 - this.cd / TRAP.rearmT)), 1); }          // thanh nạp lại
    }
}
// Đổi bẫy ô lọt trong tường (có tường sau, trên, dưới) thành ArrowBox đặt trong hốc ô cũ. Bẫy còn lại giữ là ô cố định (level.traps).
function arrowBoxesSpawn(level) {
    const keep = [];
    for (const tr of level.traps) {
        const c = tr.c, r = tr.r, d = tr.dir;
        if (level.tile(c, r) !== T_ARROW || !level.isSolid(c - d, r) || !level.isSolid(c, r - 1) || !level.isSolid(c, r + 1)) { keep.push(tr); continue; }
        level.setTile(c, r, T_EMPTY);
        entAdd(new ArrowBox(c * TILE + (TILE - 12) / 2, r * TILE + TILE - 12, d));
    }
    level.traps = keep;
}

// 13c_princess — CÔNG CHÚA CẦN CỨU (SC: "damsel"). Hình vẽ TỰ THIẾT KẾ (vương miện nhỏ + váy tím), không vẽ lại nhân vật có bản quyền nào.
//   Là một Thing: nhặt / mang được; CÔNG CHÚA không ném được (bấm ném = đặt nhẹ xuống), thú cưng thì ném được. Chịu chung nguồn sát thương (bom, mũi tên, gai, vật ném trúng, quái chạm vào (vô tình; đang bế thì an toàn)… — KHÔNG chết vì roi hay đạp để mất công cứu).
//   Mang tới cửa ra rồi bấm ↑ (hoặc đặt xuống trong ô cửa ra) => công chúa +2 máu, thú cưng +1 máu. Chết/bị mất = không được gì (không phạt thêm).
//   Quy tắc nối: exitStep (16_gameloop) gọi princessRescue.

const PRINCESS = { w: 10, h: 14, hp: 2 * HP_UNIT, helpDist: 72, healPrincess: 2 * HP_UNIT, healPet: 1 * HP_UNIT, petHp: 3 * HP_UNIT, petDmg: 2 };      // thú cưng: 3 máu; mỗi lần NÉM thật −1 máu, trúng quái gây petDmg; ném lần cuối (hết máu) thì hy sinh sau khi va chạm

class Princess extends Thing {
    constructor(x, y) {
        super(x, y, PRINCESS.w, PRINCESS.h, { kind: 'princess', carryable: true, creature: true, mass: 0, hp: PRINCESS.hp, bounceY: 0.1, bounceX: 0.1, col: '#b070e0',
            dmgFrom: [DMG.EXPLOSION, DMG.ARROW, DMG.IMPACT, DMG.SPIKE, DMG.CRUSH, DMG.FIRE, DMG.BITE] });
        this.facing = game.rngPlay ? game.rngPlay.sign() : 1; this.callT = 0;
        const h = (Math.floor(x / TILE) * 11 + Math.floor(y / TILE) * 5) % 10; this.pet = h < 3 ? (h < 2 ? 'dog' : 'cat') : null;       // ~30% là thú cưng (chó/mèo), còn lại công chúa
        this.noThrow = !this.pet;                                   // công chúa không ném được (X = đặt nhẹ xuống)
        if (this.pet) { this.hp = this.maxHp = PRINCESS.petHp; this.impactDmg = PRINCESS.petDmg; }
        this.flying = false; this.flightT = 0; this.sacrifice = false;
        this.invulnT = 1;                                           // vừa xuất hiện: 1 giây không bị quái cắn (tránh chết oan ngay đầu màn)
    }
    update(level, dt) {
        super.update(level, dt);
        if (this.flying) {                                          // thú đang bị ném: dừng lại / hết giờ thì hết "đạn"
            this.flightT += dt;
            if (this.flightT > 0.12 && ((this.onGround && this.speed < ITEM.impactSpeed) || this.flightT > 2)) this.endFlight();
        }
        const p = game.player;
        if (!this.alive || this.holder || !p || p.dead) return;
        if (this.onGround && Math.abs(this.cx - p.cx) < PRINCESS.helpDist && Math.abs(this.cy - p.cy) < 40) {
            this.facing = p.cx < this.cx ? -1 : 1;
            if ((this.callT -= dt) <= 0) { this.callT = 2.2; sndPlay('alert', { x: this.cx, p: 1.8, vol: 0.5 }); }
        }
        if (level.solidAt(this.cx, this.cy)) this.hurt({ kind: DMG.CRUSH, dmg: 99 });
    }
    // ---- Thú cưng bị ném (chỉ thú cưng mới ném được) ----
    onThrown(p, gentle) {
        if (!this.pet || gentle) return;                            // đặt nhẹ xuống: không mất máu, không gây sát thương
        this.hp -= HP_UNIT; this.flying = true; this.flightT = 0; this.hurtsOnImpact = true; this.hitSet = null;
        if (this.hp <= 0) { this.hp = 0; this.sacrifice = true; }   // lần ném cuối: vẫn bay, gây sát thương rồi mới chết
    }
    onPicked(p) { this.flying = false; this.hurtsOnImpact = false; }
    endFlight() {
        this.flying = false; this.hurtsOnImpact = false;
        if (this.sacrifice && this.alive) this.die({ kind: DMG.IMPACT, dmg: 99, sacrifice: true });
    }
    onHitTarget(level, t) { if (this.sacrifice) this.endFlight(); }
    onLand(level, v) { if (this.flying && this.sacrifice) this.endFlight(); }
    onWall(level, v) { if (this.flying && this.sacrifice) this.endFlight(); }
    onDie(src) {
        const L = game.level; L.spawnBurst(this.cx, this.cy, 8, '#b070e0', 90); L.spawnBurst(this.cx, this.cy, 4, '#ffd24a', 70);
        sndPlay('hurt', { x: this.cx, p: 1.5 });
        if (src && src.sacrifice) { game.pickupMsg = { t: 0, text: 'Thú cưng đã hy sinh!' }; return; }        // chủ động ném lần cuối: không tính là "mất người cần cứu"
        game.pickupMsg = { t: 0, text: (src && src.kind === DMG.BITE ? (this.pet ? 'Thú cưng bị quái cắn!' : 'Công chúa bị quái cắn!') : (this.pet ? 'Thú cưng gặp nạn!' : 'Công chúa gặp nạn!')) };
        game.stats.princessLost = (game.stats.princessLost || 0) + 1;
    }
    draw(ctx, alpha) {
        if (typeof drawPrincessHp === 'function') { drawPrincessHp(this, ctx, alpha); return; }
        if (this.blinkT > 0 && Math.floor(this.blinkT * 20) % 2) return;
        const x = Math.round(this.drawX(alpha)), y = Math.round(this.drawY(alpha)), f = this.facing, held = !!this.holder, k = Math.floor(game.time * 3) % 2;
        const px = (dx, dy, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(f > 0 ? x + dx : x + this.w - dx - w, y + dy, w, h); };
        if (this.pet) {
            const c = this.pet === 'dog' ? '#c8924a' : '#8a8a96', c2 = this.pet === 'dog' ? '#7a4a22' : '#4a4a56';
            px(1, 6, 8, 5, c); px(6, 3, 4, 4, c); px(7, 2, 1, 2, c2); px(9, 2, 1, 2, c2); px(8, 4, 1, 1, '#1a1a1a'); px(10, 5, 1, 1, '#1a1a1a');
            px(1, 11, 2, 3, c2); px(6, 11, 2, 3, c2); px(0, 5 + k, 2, 2, c2);
            if (this.callT > 1.2 && !this.holder) { ctx.fillStyle = '#ff7a9a'; ctx.fillRect(x + 4, y - 7, 2, 4); ctx.fillRect(x + 4, y - 2, 2, 1); }
            return;
        }
        const HAIR = '#7a3a22', SKIN = '#f2c9a0', GOWN = '#8a52c8', GOWN2 = '#6a3aa8', GOLD = '#ffd24a';
        if (held) { px(1, 0, 8, 3, HAIR); px(2, 1, 6, 3, SKIN); px(2, 4, 6, 8, GOWN); px(0, 10, 10, 3, GOWN2); px(2, 0, 6, 1, GOLD); return; }
        px(2, 0, 6, 1, GOLD); px(3, -1, 1, 1, GOLD); px(6, -1, 1, 1, GOLD);       // vương miện
        px(1, 1, 8, 3, HAIR); px(2, 2, 6, 3, SKIN); px(1, 4, 2, 4, HAIR);        // tóc + mặt
        px(6, 3, 1, 1, '#2a1a1a');                                               // mắt
        px(2, 5, 6, 4, GOWN); px(1, 9, 8, 4, GOWN); px(0, 12, 10, 2, GOWN2);     // váy
        px(3 + k, 5, 1, 2, SKIN); px(7 - k, 5, 1, 2, SKIN);                      // tay vẫy
        if (this.callT > 1.2 && !this.holder) { ctx.fillStyle = '#ff7a9a'; ctx.fillRect(x + 4, y - 7, 2, 4); ctx.fillRect(x + 4, y - 2, 2, 1); }   // dấu chấm than: "cứu em!"
    }
}

// Cứu công chúa: người chơi cầm cô tới cửa ra bấm ↑, hoặc cô (được ném / để lại) nằm trong ô cửa ra. Trả về số người được cứu.
function princessRescue(L, p, up) {
    const e = L.exit; if (!e) return 0;
    const box = { x: e.c * TILE, y: e.r * TILE, w: TILE, h: TILE };
    let n = 0;
    for (const t of game.entities) {
        if (!t.alive || t.kind !== 'princess' || !overlapBox(box, t)) continue;
        if (t.holder && (t.holder !== p || !up)) continue;          // đang cầm: phải bấm ↑ ở cửa ra
        if (t.holder) t.release();
        t.alive = false; n++;
        const heal = t.pet ? PRINCESS.healPet : PRINCESS.healPrincess;
        p.hp += heal;
        L.spawnBurst(e.c * TILE + 8, e.r * TILE + 4, 10, '#ff7a9a', 90);
        game.pickupMsg = { t: 0, text: (t.pet ? 'Thú cưng quấn quýt! +' : 'Công chúa cảm ơn bạn! +') + heal / HP_UNIT + ' tim' };
        game.stats.rescued = (game.stats.rescued || 0) + 1; if (t.pet) game.stats.pets = (game.stats.pets || 0) + 1;
        sndPlay('unlock', { x: p.cx });
    }
    return n;
}

// 13d_shop — CỬA HÀNG ĐƠN GIẢN (GĐ4, roadmap D12). Phòng cửa hàng do bộ sinh đặt (07b_levelgen: genShop); file này là hành vi.
//   Hàng (ShopGoods): bom / dây / tim / bộ đồ nghề. Nhặt lên (phím nhặt) khi ĐỦ vàng => trả tiền và nhận ngay. Không đủ vàng vẫn cầm được,
//   nhưng mang RA KHỎI phòng cửa hàng mà chưa trả = TRỘM => chủ cửa hàng nổi giận. Chủ cửa hàng cũng nổi giận khi bị đánh / đạp / nổ.
//   Chủ cửa hàng giận: đuổi theo, cắn (1 máu) và bắn súng hoa cải (3 viên, 1 máu mỗi viên, có điềm báo). Giết được → rơi vàng.
//   Tương tác chéo (đúng tinh thần Spelunky): ném đá/bom vào chủ cửa hàng, quăng hàng ra ngoài cửa rồi nhặt, bẫy mũi tên bắn trúng ông ta…

const SHOP = {
    price: { bomb: 240, rope: 160, heart: 600, kit: 300, shotgun: 900, machete: 600, boomerang: 500 },
    name: { bomb: '+4 pháo', rope: '+4 dây', heart: '+2 tim', kit: '+2 pháo +2 dây', shotgun: 'Súng hoa cải', machete: 'Kiếm hệ', boomerang: 'Boomerang' },
    wind: 0.4, cd: 1.6, range: 140, pelletV: 300, pelletLife: 0.9, spread: 0.16, chaseSpeed: 70, dropGold: 150
};

class ShopGoods extends Thing {
    constructor(x, y, type) {
        super(x, y, 12, 12, { kind: 'goods', carryable: true, mass: 1, dmgFrom: [], hurtsOnImpact: false, col: '#ffd24a' });
        this.type = type === 'heart' || type === 'rope' || type === 'bomb' || type === 'kit' || type === 'item' || type === 'shotgun' || type === 'machete' || type === 'boomerang' ? type : (type === 'crate' ? 'kit' : 'bomb');
        this.gear = null; this.sub = null; this.blade = null;
        if (this.type === 'machete') this.blade = bladePick();          // v0.45: ô dao rựa cũ → kiếm hệ ngẫu nhiên theo vùng (13s_blade.bladePick)
        if (this.type === 'kit') { this.sub = SUB_LIST[game.rngPlay.int(0, SUB_LIST.length - 1)]; }          // v0.43: "bộ đồ nghề" → bình đồ phụ ngẫu nhiên
        if (this.type === 'item') { this.gear = gearPick(game.player, false); if (!this.gear) this.type = 'heart'; }          // đã có hết đồ nghề: bán tim
        this.price = this.gear ? GEAR_DEFS[this.gear].price : this.blade ? BLADE.price : this.sub ? SUB[this.sub].price : SHOP.price[this.type]; this.paid = false;
        const B = LVL.border, rx = Math.floor((Math.floor(x / TILE) - B) / LVL.roomW), ry = Math.floor((Math.floor(y / TILE) - B) / LVL.roomH);
        this.shopBox = { x: (B + rx * LVL.roomW) * TILE, y: (B + ry * LVL.roomH) * TILE, w: LVL.roomW * TILE, h: LVL.roomH * TILE };
    }
    inShop() { return overlapBox(this.shopBox, { x: this.cx, y: this.cy, w: 1, h: 1 }); }
    keeper() { return thingsWhere(e => e.kind === 'shopkeeper')[0]; }
    label() { return this.gear ? GEAR_DEFS[this.gear].name : this.blade ? BLADE[this.blade].name : this.sub ? SUB[this.sub].name + ' ×' + SUB[this.sub].n : SHOP.name[this.type]; }
    apply(p) {
        if (this.gear) { gearGive(p, this.gear); return; }
        if (this.sub) { subGive(p, this.sub); return; }
        if (this.blade) { bladeGive(p, this.blade); return; }
        if (this.type === 'shotgun' || this.type === 'machete' || this.type === 'boomerang') { weaponGive(p, this.type); return; }
        if (this.type === 'bomb') p.bombs += 4; else if (this.type === 'rope') p.ropes += 4;
        else if (this.type === 'heart') p.hp += 2 * HP_UNIT; else { p.bombs += 2; p.ropes += 2; }
    }
    consume(p, msg) {
        this.apply(p); this.release(); this.alive = false;
        game.pickupMsg = { t: 0, text: msg }; sndPlay('unlock', { x: p.cx, p: 1.2 });
    }
    onPicked(p) {
        if (this.paid) { this.consume(p, this.label()); return; }                  // đã trả / đồ trộm rơi ngoài: nhận luôn
        if (p.gold >= this.price) { p.gold -= this.price; this.paid = true; game.stats.bought = (game.stats.bought || 0) + 1; this.consume(p, this.label() + '  (−$' + this.price + ')'); }
        else game.pickupMsg = { t: 0, text: 'Thiếu vàng ($' + this.price + ') — mang ra ngoài = trộm!' };
    }
    update(level, dt) {
        super.update(level, dt);
        if (!this.alive || this.paid || this.inShop()) return;
        // ra khỏi cửa hàng khi chưa trả => trộm
        this.paid = true; game.stats.stolen = (game.stats.stolen || 0) + 1;
        const k = this.keeper(); if (k) k.anger('đồ trộm');
        const p = this.holder;
        if (p && p === game.player) this.consume(p, 'Trộm được ' + this.label() + '!');
    }
    draw(ctx, alpha) {
        const x = Math.round(this.drawX(alpha)), y = Math.round(this.drawY(alpha)), t = this.type;
        if (ITEM_HP) drawGoodsHp(this, ctx, x, y);
        else {
        ctx.fillStyle = '#3a2a1a'; ctx.fillRect(x - 1, y + 10, 14, 2);
        if (this.gear) { const d = GEAR_DEFS[this.gear]; ctx.fillStyle = '#1c1420'; ctx.fillRect(x + 1, y + 1, 10, 10); ctx.fillStyle = d.col; ctx.fillRect(x + 2, y + 2, 8, 8); drawText(d.ch, x + 4 - Math.round(cam.x) + 0, y + 1 - Math.round(cam.y), '#101018'); }
        else if (t === 'boomerang') { ctx.fillStyle = '#1c1420'; ctx.fillRect(x + 1, y + 1, 10, 10); ctx.fillStyle = '#e0a84a'; ctx.fillRect(x + 2, y + 2, 7, 2); ctx.fillRect(x + 2, y + 2, 2, 7); }
        else if (t === 'shotgun' || t === 'machete') {
            ctx.fillStyle = '#1c1420'; ctx.fillRect(x + 1, y + 3, 10, 7);
            if (t === 'shotgun') { ctx.fillStyle = '#8a8a9a'; ctx.fillRect(x + 1, y + 4, 10, 2); ctx.fillStyle = '#7a4a22'; ctx.fillRect(x + 1, y + 6, 5, 3); ctx.fillRect(x + 2, y + 8, 2, 2); }
            else { ctx.fillStyle = this.blade ? BLADE[this.blade].col : '#c8d0e0'; ctx.fillRect(x + 4, y + 2, 7, 3); ctx.fillRect(x + 7, y + 5, 3, 1); ctx.fillStyle = '#7a4a22'; ctx.fillRect(x + 1, y + 5, 4, 3); }
        }
        else if (t === 'bomb') { ctx.fillStyle = '#2a2a33'; ctx.fillRect(x + 2, y + 3, 8, 8); ctx.fillRect(x + 1, y + 4, 10, 6); ctx.fillStyle = '#6a6a7a'; ctx.fillRect(x + 3, y + 4, 2, 2); ctx.fillStyle = '#9a7a4a'; ctx.fillRect(x + 6, y, 1, 3); }
        else if (t === 'rope') { ctx.fillStyle = '#c9a46a'; ctx.fillRect(x + 2, y + 2, 8, 8); ctx.fillStyle = '#8a6a3a'; ctx.fillRect(x + 5, y + 5, 2, 2); ctx.fillRect(x + 2, y + 8, 8, 1); }
        else if (t === 'heart') { ctx.fillStyle = '#e23a4a'; ctx.fillRect(x + 2, y + 2, 3, 3); ctx.fillRect(x + 7, y + 2, 3, 3); ctx.fillRect(x + 2, y + 4, 8, 3); ctx.fillRect(x + 3, y + 7, 6, 2); ctx.fillRect(x + 5, y + 9, 2, 1); ctx.fillStyle = '#ff9aa8'; ctx.fillRect(x + 3, y + 3, 1, 1); }
        else { ctx.fillStyle = '#4a2e16'; ctx.fillRect(x + 1, y + 2, 10, 9); ctx.fillStyle = '#a8743e'; ctx.fillRect(x + 2, y + 3, 8, 7); ctx.fillStyle = '#ffd24a'; ctx.fillRect(x + 5, y + 3, 2, 7); }
        }
        if (!this.paid && !this.holder) {
            const p = game.player, ok = p && p.gold >= this.price;
            drawText('$' + this.price, x + 6 - Math.round(cam.x), y - 9 - (Math.floor(this.x / TILE) % 2) * 9 - Math.round(cam.y), ok ? '#ffd24a' : '#ff8a8a', 'center');      // so le 2 hàng cho khỏi chồng chữ
        }
    }
}

// Đạn súng hoa cải: bay thẳng, sát thương như vật ném (nguồn IMPACT), biến mất khi trúng hoặc chạm tường
class Pellet extends Thing {
    constructor(x, y) { super(x, y, 4, 4, { kind: 'pellet', mass: 0, hurtsOnImpact: true, impactDmg: 1, gravity: 0, triggersTraps: false, dmgFrom: [], col: '#ffe08a' }); this.age = 0; this.life = SHOP.pelletLife; }
    physStep(level, dt) {
        if ((this.age += dt) > this.life) { this.alive = false; return; }
        physMove(level, this, dt);
        if (this.hitL || this.hitR || this.hitU || this.onGround) { this.alive = false; level.spawnBurst(this.cx, this.cy, 2, '#ffe08a', 40); }
    }
    onHitTarget() { this.alive = false; }
    draw(ctx, alpha) { if (ITEM_HP) { drawPelletHp(this, ctx, alpha); return; } ctx.fillStyle = '#ffe08a'; ctx.fillRect(Math.round(this.drawX(alpha)), Math.round(this.drawY(alpha)), 4, 4); ctx.fillStyle = '#fff'; ctx.fillRect(Math.round(this.drawX(alpha)) + 1, Math.round(this.drawY(alpha)) + 1, 2, 2); }
}

// Đòn do người chơi gây ra? (roi, đạp, bom, vật/đạn người chơi ném/bắn)
function byPlayer(src) {
    if (!src) return false; const p = game.player, b = src.by;
    if (src.kind === DMG.WHIP || src.kind === DMG.STOMP || src.kind === DMG.EXPLOSION) return true;
    return !!b && (b === p || b.thrower === p || b.owner === p);
}
class Shopkeeper extends Enemy {
    constructor(x, y) { super('shopkeeper', x, y); this.angry = false; this.windT = 0; this.cdT = 0.8; this.hopT = 0; this.facing = -1; }
    anger(why) {
        if (this.angry || !this.alive) return;
        this.angry = true; this.dmg = 1; this.why = why;
        if (!this.ambush && !game.wanted) { game.wanted = true; game.wantedMsg = 4; }       // bị truy nã: các tiệm khác phục kích ở cửa ra
        game.pickupMsg = { t: 0, text: 'Chủ cửa hàng nổi giận!' }; sndPlay('bossRoar', { x: this.cx, vol: 0.6 });
    }
    onHurt(src) { if (byPlayer(src)) this.anger('bị đánh'); }     // lần 29: quái / bẫy tên đánh trúng chủ tiệm KHÔNG làm người chơi bị truy nã
    onDie(src) {
        super.onDie(src);
        spawnGold(this.cx, this.cy, 2, SHOP.dropGold);
        const g = entAdd(new ShopGoods(this.cx - 6, this.y, 'shotgun')); g.paid = true; g.vy = -120; g.vx = this.facing * 30;      // cướp súng: giết chủ tiệm rơi súng hoa cải (miễn phí)
    }
    update(level, dt) {
        this.timers(dt);
        if (this.holder) { this.followHolder(); return; }
        const p = game.player, d = this.def;
        if (this.stunT > 0) { this.stunT -= dt; this.physStep(level, dt); return; }
        if (this.onGround && Math.abs(this.vx) > d.speed * 1.5) this.vx *= scFric(0.3, dt);
        else if (!this.angry || !p || p.dead) { this.vx = 0; if (p && !p.dead) this.facing = p.cx < this.cx ? -1 : 1; }
        else {
            const dx = p.cx - this.cx, dy = p.cy - this.cy;
            this.facing = dx < 0 ? -1 : 1;
            if (this.windT > 0) { this.vx = 0; if ((this.windT -= dt) <= 0) this.fire(level); }
            else {
                this.vx = Math.abs(dx) > 18 ? this.facing * SHOP.chaseSpeed : 0;
                const f = this.facing, aheadX = f > 0 ? this.x + this.w + 1 : this.x - 1;
                if (this.onGround && this.vx && level.solidAt(aheadX, this.y + this.h - 3) && !level.solidAt(aheadX, this.y - 8)) this.vy = -170;      // nhảy qua bậc 1 ô
                if ((this.cdT -= dt) <= 0 && Math.abs(dx) < SHOP.range && Math.abs(dy) < 30 && this.onGround) { this.windT = SHOP.wind; this.cdT = SHOP.cd; sndPlay('shootWind', { x: this.cx }); }
            }
        }
        this.vy = Math.min(this.vy + this.gravity * dt, this.fallMax);
        physMove(level, this, dt);
        this.crushedIn(level);
        if (this.y > level.ph + 32) this.alive = false;
    }
    fire(level) {
        const f = this.facing, x = f > 0 ? this.x + this.w : this.x - 4, y = this.y + 5;
        for (let i = -1; i <= 1; i++) {
            const a = (f > 0 ? 0 : Math.PI) + i * SHOP.spread * f, b = entAdd(new Pellet(x, y));
            b.vx = Math.cos(a) * SHOP.pelletV; b.vy = Math.sin(a) * SHOP.pelletV; b.thrower = this; b.safeT = 0.3;
        }
        sndPlay('shoot', { x: this.cx, p: 0.7 });
    }
    draw(ctx, alpha) {
        if (typeof drawKeeperHp === 'function') { drawKeeperHp(this, ctx, alpha); return; }
        const x = Math.round(this.drawX(alpha)), y = Math.round(this.drawY(alpha)), f = this.facing, w = this.windT > 0;
        const px = (dx, dy, ww, hh, c) => { ctx.fillStyle = c; ctx.fillRect(f > 0 ? x + dx : x + this.w - dx - ww, y + dy, ww, hh); };
        px(2, 0, 8, 2, '#3a2a1a'); px(1, 1, 10, 1, '#3a2a1a');                      // mũ rộng vành
        px(3, 2, 6, 4, '#e0b080'); px(7, 3, 1, 1, '#1a1a1a'); px(3, 5, 6, 1, '#6a4a2a');           // mặt + ria
        px(1, 6, 10, 6, this.angry ? '#a83a2a' : '#4a7a9a'); px(2, 12, 3, 3, '#3a2a1a'); px(7, 12, 3, 3, '#3a2a1a');
        px(this.angry ? 8 : 9, 7, w ? 8 : 5, 2, '#6a6a7a');                                             // súng
        if (this.angry) { ctx.fillStyle = '#ff5a3a'; ctx.fillRect(x + 5, y - 6, 2, 4); ctx.fillRect(x + 5, y - 1, 2, 1); }
    }
}

// ---- Truy nã (lần 19): trộm / đánh chủ tiệm một lần => từ các level sau, một chủ tiệm giận dữ phục kích cạnh cửa ra (tới hết ván) ----
function wantedAmbush(L) {
    const e = L.exit, x = (e.c - 2) * TILE + 2, d = ENEMY_DEFS.shopkeeper;
    const k = entAdd(new Shopkeeper(x, e.r * TILE + TILE - d.h)); k.ambush = true; k.angry = true; k.dmg = 1; k.why = 'truy nã'; k.facing = 1;
    game.banner = { text: 'TRUY NÃ — chủ tiệm chờ ở cửa ra!', t: 0 };
}
// ---- Linh cảm đầu level (lần 19; SC: "I hear rushing water…" …). Chỉ hiện chữ, dựa vào thứ có thật trong level ----
function levelFeeling(def) {
    const m = game.genMeta; if (!m || def.boss) return;
    let t = null;
    const mech = mechOf(zoneOf(game.levelIdx));
    if (mech.note && game.levelIdx % ZONE_LEN === 0) t = mech.note;           // màn đầu mỗi vùng: báo luật riêng của vùng
    else if (def.dark) t = 'Sống lưng ớn lạnh…';
    else if (m.pit) t = 'Có tiếng rắn rít dưới lòng đất…';
    else if (m.altar) t = 'Một khí tức tà giáo vọng lại…';
    else if (m.lake) t = 'Nghe tiếng nước chảy róc rách…';
    else if (m.treasure) t = 'Mùi vàng thoang thoảng…';
    else if (game.level.objs.some(o => o.kind === 'stalactite')) t = 'Trần hang rạn nứt, đá vụn rơi lách tách…';
    else if (game.level.objs.filter(o => o.kind === 'spider').length >= 2) t = 'Tiếng bước chân nhỏ trên trần…';
    if (t) game.banner = { text: t, t: 0 };
}

// 13e_ghost — CON MA (SC oGhost, roadmap D10): ở lại level quá lâu thì ma xuất hiện, bay xuyên tường về phía người chơi, chạm là chết (bất kể máu).
//   Cảnh báo ở GHOST.warnT giây (chữ + tiếng), xuất hiện ở GHOST.spawnT giây, từ mép màn hình phía có nhiều chỗ hơn. Không có ở level đầu (GHOST.fromLevel) và phòng thử nghiệm.
//   Số liệu đọc từ SC (oGame/oGhost): cảnh báo xtime > 120 s ("a chill runs up your spine"), ma ở > 150 s, từ level thứ 2; xuất hiện ngay ngoài mép màn hình (phía xa tâm level), giữa chiều cao màn hình;
//   bay 1 px/khung (30 px/s) thẳng vào người chơi, hộp va chạm 8×16; chạm khi người chơi KHÔNG đang bất tử (sau khi bị thương ~1–2 s) mới chết.
//   Không đánh chết được (bom, roi, đá đều vô tác dụng) — chỉ có cách rời level. Mỗi level chỉ một con.

class Ghost extends Thing {
    constructor(x, y) { super(x, y, 16, 16, { kind: 'ghost', mass: 0, creature: false, dmgFrom: [], triggersTraps: false, gravity: 0, col: '#cfe8ff' }); this.age = 0; this.facing = 1; }
    update(level, dt) {
        this.age += dt;
        const p = game.player; if (!p || p.dead) { this.vx *= 0.97; this.vy *= 0.97; this.x += this.vx * dt; this.y += this.vy * dt; return; }
        const dx = p.cx - this.cx, dy = p.cy - this.cy, d = Math.hypot(dx, dy) || 1;
        this.vx = dx / d * GHOST.speed; this.vy = dy / d * GHOST.speed;
        this.x += this.vx * dt; this.y += this.vy * dt;                  // xuyên tường: không qua physMove
        if (Math.abs(dx) > 2) this.facing = dx < 0 ? -1 : 1;
        if (p.invulnT <= 0 && overlapBox({ x: this.x + 4, y: this.y, w: 8, h: 16 }, p)) {
            if (p.hurt({ kind: DMG.GHOST, dmg: 99, x: this.cx, y: this.cy, by: this })) { sndPlay('hurt', { x: p.cx, p: 0.6 }); fxShake(3, 0.2); }
        }
    }
    draw(ctx, alpha) {
        if (ITEM_HP) { drawGhostHp(this, ctx, alpha); return; }
        const x = Math.round(this.drawX(alpha)), y = Math.round(this.drawY(alpha)), a = Math.min(1, this.age * 0.8), f = this.facing, k = Math.floor(game.time * 4) % 2;
        ctx.globalAlpha = 0.78 * a;
        const px = (dx, dy, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(f > 0 ? x + dx : x + this.w - dx - w, y + dy, w, h); };
        px(4, 0, 8, 2, '#e6f3ff'); px(2, 2, 12, 8, '#e6f3ff'); px(1, 10, 14, 3, '#d3e6fa');
        px(1, 13 + k, 3, 3 - k, '#d3e6fa'); px(6, 13, 4, 3, '#d3e6fa'); px(12, 13 + k, 3, 3 - k, '#d3e6fa');
        px(9, 4, 2, 3, '#1a2238'); px(12, 4, 2, 3, '#1a2238'); px(10, 8, 3, 2, '#1a2238');
        ctx.globalAlpha = 1;
    }
}

// Mỗi bước vật lý: cảnh báo và gọi ma
function ghostStep(L, p) {
    if (!p || p.dead || L.id === 'test' || L.def.finale || game.levelIdx < GHOST.fromLevel) return;
    const t = game.levelT + (game.ghostBonus || 0);
    if (!game.ghostWarned && t >= GHOST.warnT) { game.ghostWarned = true; game.pickupMsg = { t: 0, text: 'Lạnh sống lưng… Ra khỏi đây thôi!' }; sndPlay('bossRoar', { x: p.cx, vol: 0.35, p: 1.6 }); }
    if (!game.ghostOut && t >= GHOST.spawnT) {
        game.ghostOut = true;
        const x = p.cx > L.pw / 2 ? cam.x + VIEW_W + 8 : cam.x - 32, y = cam.y + Math.floor(VIEW_H / 2);      // SC: mép phải màn hình nếu người chơi ở nửa phải level, mép trái nếu nửa trái
        entAdd(new Ghost(x, y)); sndPlay('bossRoar', { x: p.cx, vol: 0.7, p: 1.3 });
    }
}

// 13f_pushblock — KHỐI ĐẨY (SC oPushBlock, roadmap GĐ5.1): ô T_PUSH.
//   Đứng dưới đất, giữ hướng vào khối PUSHB.pushT giây → khối trượt sang 1 ô nếu ô đó trống (không thang/dây, không vật hay sinh vật).
//   Mất chỗ tựa (bị đẩy qua mép, hoặc đất dưới bị bom phá) → rơi 1 ô mỗi PUSHB.fallStep giây; rơi trúng sinh vật / người chơi thì đè (DMG.CRUSH).
//   Khối là ô đặc nên bộ kiểm tra của bộ sinh coi như tường — mẫu phòng chỉ đặt khối nơi nhảy qua được (cao 1 ô).
//   Bom phá được. Không có hoạt cảnh trượt: ô đổi chỗ ngay (kèm bụi + tiếng).

const PUSHB = { pushT: 0.35, fallStep: 0.05 };

function pushCellFree(L, c, r, creaturesToo) {
    if (!L.inside(c, r) || L.tile(c, r) !== T_EMPTY || L.hasRope(c, r)) return false;
    const box = { x: c * TILE, y: r * TILE, w: TILE, h: TILE };
    for (const e of game.entities) if (e.alive && !e.holder && e.kind !== 'ghost' && (creaturesToo || !e.creature) && overlapBox(box, e)) return false;
    const p = game.player; if (p && !p.dead && overlapBox(box, p)) return false;
    return true;
}
// đè sinh vật trong ô (c, r); trả true nếu ô sạch sinh vật sau đó
function pushCrush(L, c, r) {
    const box = { x: c * TILE, y: r * TILE, w: TILE, h: TILE }; let clean = true;
    const hit = e => { if (e.alive && !e.dead && overlapBox(box, e)) { e.hurt({ kind: DMG.CRUSH, dmg: 99, x: box.x + 8, y: box.y }); if (e.alive && !e.dead) clean = false; } };
    for (const e of game.entities) if (e.creature || e.kind === 'shopkeeper' || e.kind === 'princess') hit(e);
    if (game.player && !game.player.dead) hit(game.player);
    return clean;
}
function pushMove(L, b, c, r) {
    L.setTile(b.c, b.r, T_EMPTY); L.setTile(c, r, T_PUSH); b.c = c; b.r = r; b.acc = 0;
}
function pushStep(L, p) {
    if (!L.pushes.length) return;
    const dt = STEP;
    for (let i = L.pushes.length - 1; i >= 0; i--) {
        const b = L.pushes[i];
        if (L.tile(b.c, b.r) !== T_PUSH) { L.pushes.splice(i, 1); continue; }       // bị bom phá
        const below = L.tile(b.c, b.r + 1), supported = L.isSolid(b.c, b.r + 1) || below === T_ONEWAY;
        if (supported) { if (b.fallT >= 0) { b.fallT = -1; L.spawnDust((b.c + 0.5) * TILE, (b.r + 1) * TILE, 4, 40, 10); sndPlay('rock', { x: (b.c + 0.5) * TILE, vol: 0.5 }); fxShake(1, 0.08); } }
        else {
            if (b.fallT < 0) b.fallT = 0;
            b.fallT += dt;
            if (b.fallT >= PUSHB.fallStep) {
                const tn = L.tile(b.c, b.r + 1);
                if (tn === T_SPIKE || tn === T_LADDER) L.breakAt(b.c, b.r + 1);
                if (L.tile(b.c, b.r + 1) === T_EMPTY && pushCrush(L, b.c, b.r + 1)) { pushMove(L, b, b.c, b.r + 1); b.fallT = 0; }
                else b.fallT = PUSHB.fallStep;      // vướng (sinh vật còn sống / vật): đợi
            }
        }
    }
    // đẩy
    const ax = p && !p.dead ? inp.axisX() : 0, dir = Math.sign(ax);
    let hit = null;
    if (dir && p.onGround && p.state !== 'climb' && !p.hold && p.blockedAt(L, dir)) {
        const c = Math.floor((dir > 0 ? p.x + p.w + 1 : p.x - 1) / TILE), r = Math.floor((p.y + p.h - 2) / TILE);
        hit = L.pushes.find(b => b.c === c && b.r === r && b.fallT < 0) || null;
    }
    for (const b of L.pushes) {
        if (b !== hit) { b.acc = 0; continue; }
        b.acc += dt;
        if (b.acc >= PUSHB.pushT && pushCellFree(L, b.c + dir, b.r, true)) {
            const x = (b.c + 0.5 + dir * 0.5) * TILE, y = (b.r + 1) * TILE;
            pushMove(L, b, b.c + dir, b.r); L.spawnDust(x, y, 5, 50, 12); sndPlay('rock', { x, vol: 0.6 });
        }
    }
}

// 13g_water — NƯỚC TĨNH (GĐ5.2): ô T_WATER không đặc. Người chơi: trọng lực nhẹ, chìm chậm, đi chậm, nhảy giữa nước = đạp nước, rơi vào nước không mất máu.
//   Vật (đá, bom, vàng…): chìm chậm, mất đà ngang. Quái bộ binh không bị ảnh hưởng (chưa).  Nước chỉ đặt trên sàn sâu ≤ 2 ô (mẫu phòng, ký tự W) để luôn thoát được bằng nhảy thường.
//   Vẽ: lớp xanh trong phủ lên vật thể, mặt nước sáng; gợn nhẹ.
// Lần 26: vẽ theo LƯỢNG từng ô (màng mỏng cũng thấy), mặt nước lượn sóng, đậm dần theo độ sâu, vệt sáng + bọt khí.
function drawWater(ctx, L, cx, cy) {
    if (ITEM_HP) return drawWaterHp(ctx, L, cx, cy);
    if (!L.amt) return;
    const c0 = Math.max(0, Math.floor(cx / TILE)), c1 = Math.min(L.w - 1, Math.floor((cx + VIEW_W) / TILE));
    const r0 = Math.max(0, Math.floor(cy / TILE)), r1 = Math.min(L.h - 1, Math.floor((cy + VIEW_H) / TILE)), t = game.time, W = L.w, A = L.amt, AT = L.amtT;
    const has = (c, r) => c >= 0 && r >= 0 && c < W && r < L.h && AT[r * W + c] === 1 && A[r * W + c] >= 0.05;
    for (let c = c0; c <= c1; c++) {
        for (let r = r0; r <= r1; r++) {
            if (!has(c, r)) continue;
            const x = c * TILE, y = r * TILE, top = !has(c, r - 1), a = Math.min(1, A[r * W + c]);
            const h = top ? Math.max(2, Math.round(a * TILE * 2) / 2) : TILE;
            let y0 = y + TILE - h;
            if (top) y0 += Math.sin(t * 2.2 + c * 0.9) * 0.5;
            let depth = 0; for (let k = r - 1; k >= r - 6 && has(c, k); k--) depth++;
            const al = 0.30 + Math.min(depth, 5) * 0.045;
            ctx.fillStyle = 'rgba(38,112,205,' + al.toFixed(3) + ')'; ctx.fillRect(x, y0, TILE, y + TILE - y0);
            if (depth >= 2) { ctx.fillStyle = 'rgba(10,40,110,' + (0.05 * Math.min(depth, 5)).toFixed(3) + ')'; ctx.fillRect(x, y, TILE, TILE); }
            if (top) {
                ctx.fillStyle = 'rgba(150,215,255,0.45)'; ctx.fillRect(x, y0, TILE, Math.min(2, h));
                ctx.fillStyle = 'rgba(225,246,255,0.9)'; ctx.fillRect(x, y0, TILE, 1);
                if (h > 6) { const gx = x + ((Math.sin(t * 1.3 + c * 2.1) * 0.5 + 0.5) * (TILE - 5)); ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fillRect(gx, y0 + 2.5, 4, 0.5); }
            } else {
                if ((Math.floor(t * 1.5 + c * 3 + r * 5) & 7) === 0) { ctx.fillStyle = 'rgba(190,235,255,0.28)'; ctx.fillRect(x + 3 + ((c * 5 + r) & 7), y + 4 + ((r * 3 + c) & 5), 4, 1); }
                const bt = (t * 0.6 + (c * 37 + r * 11) % 10) % 6;
                if (((c * 13 + r * 7) % 9) === 0 && bt < 1) { ctx.fillStyle = 'rgba(220,245,255,0.7)'; ctx.fillRect(x + 4 + (c * 3 % 8), y + TILE - bt * TILE, 1.5, 1.5); }
            }
        }
    }
}

// ---- Chất lỏng CHẢY (lần 23; viết lại lần 26 theo kiểu Terraria/Minecraft: LƯỢNG chất lỏng từng ô 0..1): NƯỚC và DUNG NHAM.
//   Mỗi ô có `L.amt` (lượng) và `L.amtT` (1 = nước, 2 = dung nham). Mỗi nhịp, theo thứ tự từ dưới lên: (1) rơi xuống ô dưới tới khi đầy; (2) phần còn lại dàn sang trái/phải
//   cho cân bằng với ô bên cạnh (chỉ khi chênh > FLOW.minDiff) => nước hở hai bên TRÀN RA và dẹt dần, rơi khỏi mép sàn; lớp mỏng không còn "đứng như khối hộp".
//   Ô tính là T_WATER/T_LAVA (bơi được / chết) khi lượng ≥ FLOW.thr (hạ xuống dưới FLOW.thrOff mới bỏ — tránh nhấp nháy); mỏng hơn chỉ là màng nước vẽ ra, không cản người.
//   Lượng < FLOW.dry bốc hơi (nên mỗi vũng dừng lan được). Dung nham nhớt hơn: nhịp chậm, lan 1/2 lượng. Nước gặp dung nham: dung nham hoá đá (T_STONE), nước mất 0.5.
const FLOW = { dt: 0.05, iters: 2, lavaDt: 0.22, thr: 0.6, thrOff: 0.5, dry: 0.06, minDiff: 0.03, side: 0.5, lavaSide: 0.3, minFilm: 0.35 };
function flowInitLevel(L) {
    L.flowInit = true; L.amt = new Float32Array(L.w * L.h); L.amtT = new Uint8Array(L.w * L.h); L.flowQ = new Set();
    for (let k = 0; k < L.w * L.h; k++) { const t = L.tiles[k]; if (t === T_WATER || t === T_LAVA) { L.amt[k] = 1; L.amtT[k] = t === T_WATER ? 1 : 2; L.flowQ.add(k); } }
}
function flowWake(L, c, r) {                     // gọi từ setTile: ô đổi → các ô chất lỏng quanh đó thức dậy; ô đổi thành đặc thì xoá lượng
    if (!L.flowInit) return;
    const k0 = r * L.w + c, t0 = L.tiles[k0];
    if (t0 === T_WATER || t0 === T_LAVA) { if (L.amt[k0] <= 0) { L.amt[k0] = 1; L.amtT[k0] = t0 === T_WATER ? 1 : 2; } }
    else if (t0 !== T_EMPTY && t0 !== T_LADDER) L.amt[k0] = 0;      // thang không chặn nước (lần 43)
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) { const cc = c + dc, rr = r + dr; if (L.inside(cc, rr) && L.amt[rr * L.w + cc] > 0) L.flowQ.add(rr * L.w + cc); }
}
function flowSync(L, k) {
    const a = L.amt[k], ty = L.amtT[k] === 1 ? T_WATER : T_LAVA, t = L.tiles[k];
    if (a < FLOW.dry) { if (a > 0) L.amt[k] = 0; if (t === T_WATER || t === T_LAVA) L.tiles[k] = T_EMPTY; return; }
    if (t === T_EMPTY && a >= FLOW.thr) L.tiles[k] = ty;
    else if ((t === T_WATER || t === T_LAVA) && a < FLOW.thrOff) L.tiles[k] = T_EMPTY;
}
function flowStep(L, dt) {
    L.flowNow = (L.flowNow || 0) + dt;                // đồng hồ riêng của dòng chảy (v0.35): vệt chảy `flowV` tàn sau ENV.flowFade giây
    if (!L.flowInit) flowInitLevel(L);
    if (!L.flowQ.size) return;
    L.flowW = (L.flowW || 0) + dt; L.flowL = (L.flowL || 0) + dt;
    const runW = L.flowW >= FLOW.dt, runL = L.flowL >= FLOW.lavaDt;
    if (!runW && !runL) return;
    if (runW) L.flowW = 0; if (runL) L.flowL = 0;
    const W = L.w, amt = L.amt, amtT = L.amtT, flip = (L.flowFlip = !L.flowFlip);
    for (let it = 0; it < (runW ? FLOW.iters : 1); it++) {
        L.flowTick = (L.flowTick || 0) + 1; const q = [...L.flowQ].sort((a, b) => b - a); L.flowQ = new Set();
        for (const k of q) {
            const ty = amtT[k]; let a = amt[k];
            if (a <= 0) continue;
            if ((ty === 1 && !runW) || (ty === 2 && !runL)) { L.flowQ.add(k); continue; }
            const c = k % W, r = (k - c) / W, side = ty === 1 ? FLOW.side : FLOW.lavaSide;
            const wake = kk => { L.flowQ.add(kk); for (const d of [1, -1, W, -W]) { const n = kk + d; if (n >= 0 && n < amt.length && amt[n] > 0) L.flowQ.add(n); } };
            const open = kk => { const t = L.tiles[kk]; if (t === T_EMPTY || (t === T_LADDER && ty === 1)) return amt[kk] <= 0 || amtT[kk] === ty; return (t === T_WATER && ty === 1) || (t === T_LAVA && ty === 2); };
            const move = (kk, mv) => {
                amt[k] -= mv; amt[kk] += mv; amtT[kk] = ty; a = amt[k]; flowSync(L, k); flowSync(L, kk); wake(k); wake(kk);
                if (ty === 1 && (kk === k + 1 || kk === k - 1)) {          // nước dàn ngang: ghi hướng + lượng chảy cho hai ô (đọc ở envFlowPush, 13p_envfx, để đẩy quái)
                    if (!L.flowV) { L.flowV = new Float32Array(L.w * L.h); L.flowVt = new Float32Array(L.w * L.h); }
                    const v = (kk - k) * mv; L.flowV[k] = v; L.flowV[kk] = v; L.flowVt[k] = L.flowVt[kk] = L.flowNow;
                }
            };
            // phản ứng nước × dung nham ở 4 ô lân cận
            let reacted = false;
            for (const d of [1, -1, W, -W]) {
                const n = k + d; if (n < 0 || n >= amt.length || (d === 1 && c === W - 1) || (d === -1 && c === 0)) continue;
                if (amt[n] > 0 && amtT[n] !== ty && amt[n] >= FLOW.dry) {
                    const lava = ty === 2 ? k : n, water = ty === 2 ? n : k, lc = lava % W, lr = (lava - lc) / W;
                    amt[lava] = 0; L.tiles[lava] = T_STONE; L.markDirty(lc, lr); amt[water] = Math.max(0, amt[water] - 0.5); flowSync(L, water); wake(water);
                    L.spawnBurst((lc + 0.5) * TILE, lr * TILE, 8, '#e0e0e8', 60); sndPlay('rock', { x: (lc + 0.5) * TILE, vol: 0.5, p: 2.2 });
                    reacted = true; break;
                }
            }
            if (reacted) continue;
            if (r + 1 < L.h && open(k + W)) { const sp = 1 - amt[k + W]; if (sp > 0.01) move(k + W, Math.min(a, sp)); }
            if (a < FLOW.dry) continue;
            // Mặt nước luôn PHẲNG: các ô mặt trên cùng (có chỗ đứng) liền nhau trong một hàng được san bằng; lan thêm 1 ô mỗi đầu nếu mực còn ≥ minFilm
            const supp = kk => { const b2 = kk + W; if (b2 >= amt.length) return true; return !open(b2) || amt[b2] >= 0.99; };
            const topCell = kk => amt[kk] > 0 && amtT[kk] === ty && !(kk - W >= 0 && amt[kk - W] >= 0.05 && amtT[kk - W] === ty);
            const rowOf = kk => Math.floor(kk / W);
            if (topCell(k) && supp(k)) {
                if (!L.flowSeen) L.flowSeen = new Set();
                if (L.flowSeenT !== L.flowTick) { L.flowSeen.clear(); L.flowSeenT = L.flowTick; }
                if (!L.flowSeen.has(k)) {
                    const run = [k]; L.flowSeen.add(k);
                    for (const d of [-1, 1]) for (let kk = k + d; rowOf(kk) === r && amt[kk] > 0 && amtT[kk] === ty && topCell(kk) && supp(kk) && !L.flowSeen.has(kk); kk += d) { run.push(kk); L.flowSeen.add(kk); }
                    run.sort((x, y) => x - y);
                    let total = 0; for (const kk of run) total += amt[kk];
                    for (const e of [run[0] - 1, run[run.length - 1] + 1]) {
                        if (rowOf(e) !== r || !((L.tiles[e] === T_EMPTY || (L.tiles[e] === T_LADDER && ty === 1)) && amt[e] <= 0) || !supp(e)) continue;
                        if (total / (run.length + 1) >= FLOW.minFilm) { if (e < run[0]) run.unshift(e); else run.push(e); }
                    }
                    const h = total / run.length;
                    for (const kk of run) { const ch = Math.abs(amt[kk] - h) > 0.004 || amt[kk] <= 0; amt[kk] = h; amtT[kk] = ty; flowSync(L, kk); if (ch) wake(kk); }
                    a = amt[k];
                }
            }
            a = amt[k]; const lev = topCell(k) && supp(k);
            for (const d of (flip ? [1, -1] : [-1, 1])) {
                if ((d === 1 && c === W - 1) || (d === -1 && c === 0)) continue;
                const n = k + d; if (!open(n) || (lev && supp(n))) continue;
                const na = amt[n] > 0 ? amt[n] : 0, diff = a - na;
                if (diff > FLOW.minDiff) move(n, diff * side);
            }
        }
    }
}

// 13h_crusher — BẪY ĐÈ (GĐ5.3; SC oCrushTrap ở vùng sau, ở đây dùng sớm ở Hầm mỏ): ô T_CRUSH gắn trần.
//   idle → người chơi đứng dưới trong CRUSH.halfW px ngang, trong CRUSH.range ô, không bị chắn → warn (rung + bụi, CRUSH.warnT s) → fall (CRUSH.fallStep s/ô, đè sinh vật)
//   → rest (CRUSH.restT s) → rise (CRUSH.riseStep s/ô) về chỗ cũ → idle. Không phá được bằng bom. Chỉ người chơi kích; sinh vật dưới ô bị đè (DMG.CRUSH 99).
function crushSee(L, b, p) {
    if (!p || p.dead || Math.abs(p.cx - (b.c + 0.5) * TILE) > CRUSH.halfW) return false;
    const pr = Math.floor((p.y + p.h - 1) / TILE); if (pr <= b.r || pr - b.r > CRUSH.range) return false;
    for (let r = b.r + 1; r <= pr; r++) if (L.isSolid(b.c, r)) return false;
    return true;
}
function crushStep(L, p) {
    for (const b of L.crushers) {
        b.t += STEP; const x = (b.c + 0.5) * TILE;
        if (b.st === 'idle') { if (b.r === b.hr && crushSee(L, b, p)) { b.st = 'warn'; b.t = 0; sndPlay('ui', { x, p: 0.5 }); } }
        else if (b.st === 'warn') {
            if (L.fx.length < 400 && Math.floor(b.t * 30) % 3 === 0) L.spawnDust(x, (b.r + 1) * TILE, 1, 20, 6);
            if (b.t >= CRUSH.warnT) { b.st = 'fall'; b.t = 0; }
        } else if (b.st === 'fall') {
            if (b.t >= CRUSH.fallStep) {
                b.t = 0; const nr = b.r + 1, tn = L.tile(b.c, nr);
                if (tn === T_SPIKE || tn === T_LADDER) L.breakAt(b.c, nr);
                if (L.tile(b.c, nr) === T_EMPTY) { if (pushCrush(L, b.c, nr)) { L.setTile(b.c, b.r, T_EMPTY); L.setTile(b.c, nr, T_CRUSH); b.r = nr; } }
                else { b.st = 'rest'; b.t = 0; fxShake(2.5, 0.2); sndPlay('crumbleFall', { x, vol: 0.8 }); L.spawnDust(x, (b.r + 1) * TILE, 6, 60, 12); }
            }
        } else if (b.st === 'rest') { if (b.t >= CRUSH.restT) { b.st = 'rise'; b.t = 0; } }
        else if (b.st === 'rise') {
            if (b.t >= CRUSH.riseStep) {
                b.t = 0;
                if (b.r <= b.hr) { b.st = 'idle'; continue; }
                const nr = b.r - 1;
                if (L.tile(b.c, nr) === T_EMPTY && pushCrush(L, b.c, nr)) { L.setTile(b.c, b.r, T_EMPTY); L.setTile(b.c, nr, T_CRUSH); b.r = nr; }
            }
        }
    }
}

// 13i_lava — DUNG NHAM (GĐ5.4; SC: lava ở vùng sâu): ô T_LAVA không đặc, chạm là chết.
//   Người chơi / quái / công chúa chạm (chân hoặc thân trong ô dung nham): DMG.FIRE 99 kèm cờ `lava: true` (bỏ qua nhấp nháy bất tử VÀ bỏ qua kháng lửa, v0.26: quái kháng lửa thường vẫn chết trong dung nham; Thing.hurt ở 08a_thing). Vật nhặt được (đá, bình, thùng) và VÀNG rơi vào thì cháy mất; BOM rơi vào thì nổ ngay (chain()).
//   Bộ sinh: ô dung nham không bao giờ nằm trên đường đi (genReach không bước/đáp vào), chỉ đặt trên sàn, rộng ≤ 2 ô khi nằm giữa lối đi (nhảy qua được). Vẽ động: sáng nhấp nháy + tia lửa.
function lavaCell(L, c, r) { return L.tile(c, r) === T_LAVA; }
function lavaTouch(L, e) {      // như gai: phải chìm quá 10 px (mặt dung nham thấp hơn đỉnh ô 6 px) vào ô mới chết => nhảy qua mép dung nham an toàn
    const c0 = Math.floor((e.x + 3) / TILE), c1 = Math.floor((e.x + e.w - 3) / TILE), r0 = Math.floor((e.y + 2) / TILE), r1 = Math.floor((e.y + e.h - 1) / TILE);
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (lavaCell(L, c, r) && e.y + e.h > r * TILE + 10) return true;
    return false;
}
// NƯỚC DẬP DUNG NHAM (v0.52): bình nước / thùng nước vỡ gần dung nham => ô dung nham trong bán kính r hoá ĐÁ vĩnh viễn (cầu đá để qua; màn Titan: nóng chảy lại sau FROST.finaleT giây như băng).

// 13j_springs — LÒ XO · MẠNG NHỆN · SÀN VỠ (GĐ5.5).
//   Lò xo (T_SPRING, 'Y'): thân/vật đang RƠI (vy > 30) xuống ô lò xo — đi bộ ngang qua không bị nảy (chân chìm > 8 px) bị bắn lên SPRING.v px/s, không mất máu vì rơi. Đặt trên sàn.

//     v0.20: MŨI TÊN xuyên qua mạng không bị chậm (đạn quái vốn không chịu mạng nên cũng xuyên). Mạng BẮT LỬA: đòn nạp kèm lửa (09_player: whipIgnite) hoặc nguồn lửa chạm một ô mạng (cầu lửa Fireball, ngọn lửa Fire của dầu, đuốc Torch kể cả đang cầm, sinh vật / người đang cháy) thì cả CỤM mạng liền nhau (8 hướng) cháy lan, mỗi lớp cách WEBFIRE.step giây;
//     ô cháy thành Fire (13n_fire) sống WEBFIRE.life giây: đốt sinh vật / người trong ô, châm dầu. webIgnite / webFireStep (webFireStep được fireStep gọi mỗi bước).
//   Sàn vỡ (T_CRUMBLE, 'F'; từ Metroidvania): đặc; có sinh vật đứng lên thì rung CRUMBLE.shakeT s rồi sập (mất hẳn). Bom phá được.

// ---- Mạng nhện cháy (v0.20) ----
// Xếp ô mạng (c, r) vào hàng đợi cháy sau `delay` giây. Trả true nếu xếp được (ô là T_WEB và chưa nằm trong hàng đợi).

}

// 13k_altar — BÀN THỜ HIẾN TẾ (GĐ7f; phòng bên đặc biệt, ký tự `n`). Một lựa chọn đánh đổi kiểu Spelunky:

// 13m_gear — ĐỒ NGHỀ THỤ ĐỘNG kiểu Spelunky (GĐ7h). Mua ở cửa hàng (ô `i`, thay "bộ đồ nghề"). Giữ cho tới hết ván (qua level vẫn còn).
//   ĐANG DÙNG: gloves, jetpack, ankh. Các món còn lại có cờ `hidden: true` — code vẫn còn nhưng không bán, không rơi, không hiện HUD (bỏ cờ để bật lại).
//   Tên gốc SC: Compass · Spring Shoes · Spike Shoes · Pitcher's Mitt · Cape · Jetpack · Ankh. Số liệu là ước lượng theo mô tả (mình không có mã gốc của từng món) — chờ chơi thử.
//   compass   mũi tên chỉ hướng cửa ra (HUD)                 spring   nhảy cao hơn ×GEAR.springJump
//   (jetpack) ĐANG phụt mà dính LỬA hoặc TÊN => nổ tung (rủi ro đi kèm phần thưởng — bài phân tích SC; chưa chắc bản gốc làm đúng điều kiện này)
//   spike     đạp đầu gây gấp ×GEAR.spikeStomp sát thương      mitt     ném xa hơn ×GEAR.mittThrow
//   gloves    trên không ép vào tường => bám; ↑/↓ leo (50/70 px/s), nhảy = bật ra, ép hướng ngược = buông
//   (cape)    ĐÃ BỎ ở H3: Lượn có sẵn từ đầu (giữ ↑ khi rơi, playerGlide ở 09a_abilities). Khai báo cape trong GEAR_DEFS / GEAR.glideVy chỉ còn là xác chết giữ cho khỏi vỡ chỗ tham chiếu khác
//   jetpack   đang bay mà BẤM nhảy lần nữa rồi giữ => phụt lên; nhiên liệu GEAR.fuel giây, KHÔNG nạp lại
//   ankh      chết lần đầu => sống lại 1 lần, về chỗ đứng an toàn gần nhất, bất tử GEAR.ankhInv giây
const GEAR = { wallKick: 110, clingUp: 50, clingDown: 70, springJump: 1.28, spikeStomp: 2, mittThrow: 1.55, mittArc: 0.3, glideVy: 55, fuel: 5, thrust: 1800, thrustMax: -150, ankhInv: 3 };
const GEAR_LIST = ['compass', 'spring', 'spike', 'mitt', 'gloves', 'jetpack', 'ankh', 'ward_fire', 'ward_ice', 'ward_shock', 'ward_poison'];          // H3: bỏ 'cape' (Lượn có sẵn từ đầu, xem playerGlide ở 09a_abilities)
const GEAR_DEFS = {
    compass: { name: 'La bàn', price: 500, col: '#ffd24a', ch: 'C', cheap: true, hidden: true },
    spring: { name: 'Giày lò xo', price: 800, col: '#4ac0ff', ch: 'S', cheap: true, hidden: true },
    spike: { name: 'Giày gai', price: 900, col: '#d9d9e6', ch: 'G', cheap: true, hidden: true },
    mitt: { name: 'Găng ném', price: 700, col: '#e0884a', ch: 'M', cheap: true, hidden: true },
    gloves: { name: 'Găng leo tường', price: 1000, col: '#8ac04a', ch: 'W', cheap: true },
    cape: { name: 'Áo choàng (đã bỏ, thay bằng Lượn)', price: 1200, col: '#c94a8a', ch: 'A', cheap: true, hidden: true },
    jetpack: { name: 'Bộ phản lực', price: 1600, col: '#ff6a3a', ch: 'J' },
    ankh: { name: 'Ankh (hồi sinh)', price: 1800, col: '#ffe9a8', ch: 'H' },
    ward_fire: { name: 'Bùa kháng Lửa', price: 700, col: '#ff9a3a', ch: 'L', ward: 'fire' },
    ward_ice: { name: 'Bùa kháng Băng', price: 700, col: '#7fd8ff', ch: 'B', ward: 'ice' },
    ward_shock: { name: 'Bùa kháng Sét', price: 700, col: '#ffe45a', ch: 'T', ward: 'shock' },
    ward_poison: { name: 'Bùa kháng Độc', price: 700, col: '#7be06a', ch: 'D', ward: 'poison' }
};
// KHÁNG HỆ CỦA HERO (v0.51): bùa kháng X (bán ở cửa hàng như đồ nghề, giữ tới hết ván) => miễn trạng thái hệ X (cháy / chậm-băng / giật / độc, xem statusApply) và đòn hệ X chỉ còn ×RESIST.dmgMul (làm tròn lên, tối thiểu 1 đơn vị máu = nửa tim).
//   Dung nham (src.lava) bỏ qua kháng như với quái. Trong cửa hàng ra bùa: trọng số 1 (đồ khác), bùa thường RESIST.wardW, bùa của hệ quái vùng này (ZONES[].resist) RESIST.zoneW.
const RESIST = { dmgMul: 0.5, wardW: 0.5, zoneW: 1.5 };
function resHas(p, el) { return !!(el && p && p.items && p.items['ward_' + el]); }
function gearHas(p, id) { return !!(p && p.items && p.items[id]); }
function gearGive(p, id) { p.items[id] = true; if (id === 'jetpack') p.fuel = GEAR.fuel; }
// chọn món chưa có (cheap = chỉ đồ rẻ); hết món thì trả null
function gearPick(p, cheap) {
    const l = GEAR_LIST.filter(id => !GEAR_DEFS[id].hidden && !gearHas(p, id) && (!cheap || GEAR_DEFS[id].cheap));
    if (!l.length) return null;
    const z = zoneOf(game.levelIdx) || {}, w = l.map(id => { const d = GEAR_DEFS[id]; return d.ward ? (z.resist && z.resist.indexOf(d.ward) >= 0 ? RESIST.zoneW : RESIST.wardW) : 1; });
    let r = game.rngPlay.next() * w.reduce((a, b) => a + b, 0); for (let i = 0; i < l.length; i++) { if ((r -= w[i]) < 0) return l[i]; } return l[l.length - 1];
}
function gearJumpMul(p) { return (gearHas(p, 'spring') ? GEAR.springJump : 1) * (salmonOn(p) ? SALMON.jump : 1); }          // cá hồi (13a_items): nhảy cao hơn

// Mỗi khung của người chơi (09_player gọi sau bước trọng lực, trước physMove)
function gearAir(p, level, dt, wet, wasGround) {
    if (!p.items) return;
    if (p.onGround || wet || p.state === 'climb' || p.state === 'hang' || p.state === 'cling') { p.jetOn = false; }
    if (gearHas(p, 'jetpack') && !wet && !p.onGround && p.fuel > 0) {
        if (p.bufferT > 0 && !wasGround && p.coyoteT <= 0 && p.state === 'air' && !p.jetOn && p.jumpT > 0.08) { p.jetOn = true; p.bufferT = 0; }
        if (p.jetOn && !inp.held('jump')) p.jetOn = false;
        if (p.jetOn) {
            p.vy = Math.max(GEAR.thrustMax, p.vy - GEAR.thrust * dt); p.fuel = Math.max(0, p.fuel - dt); p.fallT = 0;
            if (Math.floor(p.stateT * 30) % 2 === 0) level.fx.push({ x: p.cx + (game.rngFx.next() - 0.5) * 4, y: p.y + p.h, vx: (game.rngFx.next() - 0.5) * 20, vy: 70, life: 0.3, max: 0.3, size: 2, col: game.rngFx.next() < 0.5 ? '#ffb040' : '#ff6a2a' });
            if (p.fuel <= 0) p.jetOn = false;
        }
    }
    playerGlide(p, level, wet);          // H3: LƯỢN có sẵn từ đầu (giữ ↑ khi rơi; 09a_abilities). Thay áo choàng (cape) cũ
    if (p.onGround && p.stateT >= 0 && game.time - (p.safeAt || -9) > 0.4) {            // nhớ chỗ đứng an toàn (cho Ankh): đất liền, không gai / nhiệt dưới chân, không nước
        const c = Math.floor(p.cx / TILE), r = Math.floor((p.y + p.h + 1) / TILE), t = level.tile(c, r);
        if (T_IS_SOLID[t] && t !== T_SPIKE && t !== T_LAVA && t !== T_CRUMBLE && !level.inWater(p)) { p.safe = { x: p.x, y: p.y }; p.safeAt = game.time; }
    }
}
// Bộ phản lực đang phụt bị trúng lửa / tên => nổ (dùng explode: người chơi mất ITEM.blastDmg máu — thường là chết)
function gearJetHit(p, src) {
    if (!p.jetOn || (src.kind !== DMG.FIRE && src.kind !== DMG.ARROW)) return;
    p.jetOn = false; p.fuel = 0; game.pickupMsg = { t: 0, text: 'Bộ phản lực nổ tung!' };
    explode(game.level, p.cx, p.cy);
}
// Chết mà có Ankh => sống lại (trả true: đã cứu)
function gearRevive(p) {
    if (!gearHas(p, 'ankh') || p.dead) return false;
    p.items.ankh = false; p.hp = maxHpOf(p); p.invulnT = GEAR.ankhInv; p.blinkT = GEAR.ankhInv; p.vx = p.vy = 0; p.fallT = 0; p.stunT = 0;
    if (p.safe) p.teleport(p.safe.x, p.safe.y);
    const L = game.level; L.spawnBurst(p.cx, p.cy, 20, '#ffe9a8', 140); sndPlay('victory', { x: p.cx, vol: 0.6, p: 1.3 }); fxShake(2, 0.3);
    game.pickupMsg = { t: 0, text: 'Ankh: hồi sinh!' };
    if (typeof statusClear === 'function') statusClear(p);
    return true;
}

// HUD: biểu tượng đồ + thanh nhiên liệu + la bàn
function gearDrawHud() {
    const p = game.player; if (!p || !p.items || p.dead) return;
    let x = VIEW_W - 6 - 9;
    for (const id of GEAR_LIST) {
        if (!p.items[id] || GEAR_DEFS[id].hidden) continue;
        const d = GEAR_DEFS[id];
        ctx.fillStyle = '#000'; ctx.fillRect(x - 1, 25, 11, 11); ctx.fillStyle = d.col; ctx.fillRect(x, 26, 9, 9);
        drawText(d.ch, x + 2, 25, '#101018');
        if (id === 'jetpack') { ctx.fillStyle = '#000'; ctx.fillRect(x - 1, 37, 11, 4); ctx.fillStyle = '#ff6a3a'; ctx.fillRect(x, 38, Math.round(9 * clamp(p.fuel / GEAR.fuel, 0, 1)), 2); }
        x -= 12;
    }
    if (p.weapon) { ctx.fillStyle = '#000'; ctx.fillRect(x - 1, 25, 11, 11); ctx.fillStyle = p.weapon === 'shotgun' ? '#9a9aaa' : '#c8d0e0'; ctx.fillRect(x, 26, 9, 9); drawText(p.weapon === 'shotgun' ? String(p.ammo) : p.weapon === 'boomerang' ? 'B' : 'R', x + 2, 25, '#101018'); x -= 12; }
    if (p.items.compass && !GEAR_DEFS.compass.hidden && game.level.exit && game.level.id !== 'test') {
        const e = game.level.exit, dx = (e.c + 0.5) * TILE - p.cx, dy = (e.r + 0.5) * TILE - p.cy, d = Math.hypot(dx, dy);
        if (d > 70) {
            const a = Math.atan2(dy, dx), px = p.cx - cam.x + Math.cos(a) * 30, py = p.cy - cam.y + Math.sin(a) * 30;
            ctx.save(); ctx.translate(Math.round(px), Math.round(py)); ctx.rotate(a);
            ctx.fillStyle = '#000'; ctx.fillRect(-4, -4, 9, 8); ctx.fillStyle = '#ffd24a'; ctx.fillRect(-3, -1, 6, 2); ctx.fillRect(1, -3, 2, 6); ctx.fillRect(3, -2, 1, 4);
            ctx.restore();
        }
    }
}

// ---- Vũ khí mua ở tiệm vũ khí (lần 18; số liệu là ước lượng của mình, không có mã gốc để đối chiếu) ----
//   Súng hoa cải: thay nút đánh bằng bắn (5 viên tỏa, mỗi viên 1 sát thương, tầm ngắn), giật lùi, hết đạn thì quay về roi. TIẾNG NỔ làm quái trong tầm nghe
//   đuổi theo và chủ cửa hàng nổi giận. Dao rựa: vẫn là nhát roi nhưng sát thương 2 và với xa hơn.
const WPN = { cd: 0.7, ammo: 12, pellets: 5, spread: 0.13, v: 340, life: 0.42, recoil: 70, noiseR: 220, noiseT: 4, keeperR: 150, macheteDmg: 2, macheteReach: 6 };
function weaponGive(p, id) {
    p.weapon = id; p.boom = null; if (id === 'shotgun') p.ammo = WPN.ammo; else p.ammo = 0;
    if (id === 'shotgun' || id === 'boomerang') p.sel = id;          // v0.44: mua xong tự chọn làm đồ phụ (Tam giác để bắn / ném)
}
function weaponNoise(x, y, r) {
    for (const e of game.entities) {
        if (!e.alive || !e.creature || e === game.player) continue;
        if (Math.hypot(e.cx - x, e.cy - y) > r) continue;
        e.noiseT = WPN.noiseT;
        if (e.st === 'hang') e.st = 'fly';
    }
}
function weaponFire(p, level) {
    if (p.gunCd > 0) return;
    if (p.ammo <= 0) { p.weapon = null; game.pickupMsg = { t: 0, text: 'Hết đạn — quay lại dùng roi' }; return; }
    p.ammo--; p.gunCd = WPN.cd;
    const f = p.facing, x = f > 0 ? p.x + p.w : p.x - 4, y = p.y + 6;
    for (let i = 0; i < WPN.pellets; i++) {
        const a = (f > 0 ? 0 : Math.PI) + (i - (WPN.pellets - 1) / 2) * WPN.spread * f, b = entAdd(new Pellet(x, y));
        b.vx = Math.cos(a) * WPN.v; b.vy = Math.sin(a) * WPN.v; b.thrower = p; b.safeT = 0.15; b.life = WPN.life;
    }
    if (!p.onGround || true) p.vx -= f * WPN.recoil;
    sndPlay('shoot', { x: p.cx, p: 0.55 });
    weaponNoise(p.cx, p.cy, WPN.noiseR);
    for (const k of thingsWhere(e => e.kind === 'shopkeeper' && e.alive && !e.angry)) if (Math.hypot(k.cx - p.cx, k.cy - p.cy) < WPN.keeperR) k.anger('tiếng súng');
    if (p.ammo === 0) game.pickupMsg = { t: 0, text: 'Hết đạn' };
}

// ---- Boomerang (lần 18): ném ra, làm quái CHOÁNG (không gây sát thương), bay về tay người chơi; đang bay thì nút đánh dùng roi ----
const BOOM = { v: 230, decel: 380, back: 260, stun: 1.6, life: 4, catchR: 12 };
class Boomerang extends Thing {
    constructor(x, y, owner) { super(x, y, 8, 8, { kind: 'boomerang', mass: 0, gravity: 0, triggersTraps: false, dmgFrom: [], col: '#e0a84a' }); this.owner = owner; this.age = 0; this.back = false; this.hit = new Set(); }
    physStep(level, dt) {
        const p = this.owner; this.age += dt;
        if (!p || p.dead || this.age > BOOM.life) { this.finish(); return; }
        if (!this.back) { const s = Math.sign(this.vx) || 1; this.vx -= s * BOOM.decel * dt; if (Math.sign(this.vx) !== s) { this.back = true; this.hit.clear(); } }
        if (this.back) { const dx = p.cx - this.cx, dy = p.cy - this.cy, d = Math.hypot(dx, dy) || 1; this.vx = dx / d * BOOM.back; this.vy = dy / d * BOOM.back; if (d < BOOM.catchR) { this.finish(); return; } }
        physMove(level, this, dt);
        if (!this.back && (this.hitL || this.hitR)) { this.back = true; this.hit.clear(); }
        for (const e of game.entities) {
            if (!e.alive || !e.creature || e === p || e.holder || this.hit.has(e) || !overlapBox(this, e)) continue;
            this.hit.add(e); e.stunT = Math.max(e.stunT || 0, BOOM.stun); e.vx = Math.sign(this.vx || 1) * 40; sndPlay('hit', { x: e.cx, p: 1.3 });
            level.spawnBurst(e.cx, e.cy, 3, '#e0a84a', 50);
        }
    }
    finish() { this.alive = false; if (this.owner) this.owner.boom = null; }
    draw(ctx, alpha) { if (ITEM_HP) { drawBoomerangHp(this, ctx, alpha); return; } const x = Math.round(this.drawX(alpha)), y = Math.round(this.drawY(alpha)), k = Math.floor(this.age * 20) % 2; ctx.fillStyle = '#e0a84a'; if (k) { ctx.fillRect(x, y + 3, 8, 2); ctx.fillRect(x + 3, y, 2, 4); } else { ctx.fillRect(x + 3, y, 2, 8); ctx.fillRect(x, y + 3, 5, 2); } }
}
function weaponThrowBoom(p) {
    const f = p.facing, b = entAdd(new Boomerang(p.cx - 4, p.cy - 6, p));
    b.vx = f * BOOM.v; b.vy = 0; p.boom = b; sndPlay('swing', { x: p.cx, p: 1.4 });
}

// ---- Pogo (lần 22; học Hollow Knight): trên không ↓ + đánh = chém xuống dưới chân. Trúng quái → quái mất máu như roi, người NẢY lên (hết thời gian rơi => không đau
//   vì rơi); trúng gai → nảy lên không bị thương. Cửa sổ đòn 0.25s, hồi 0.35s. Số liệu ước lượng.
//   H4d (v0.13): trúng ĐẠN thù địch (bolt / fireball / shell chưa nổ / mũi tên đang bay, cùng điều kiện với whipReflect) → đạn bị phá và người cũng NẢY. Trúng đất thì không nảy. ----
const POGO = { win: 0.25, cd: 0.35, v: -230, h: 10 };
const SYN_X2 = new Set([DMG.WHIP, DMG.IMPACT, DMG.STOMP, DMG.ARROW]);       // cộng hưởng: các đòn này ×2 lên quái đang cháy
// Đạn thù địch có chém xuống phá được không (cùng điều kiện với whipReflect ở 09_player: đạn của mình, đạn đã nổ, mũi tên nằm im thì không)
function pogoIsShot(p, e) {
    if (e.kind === 'bolt' || e.kind === 'fireball') return e.owner !== p;
    if (e.kind === 'shell') return e.owner !== p && !(e.boom >= 0);
    if (e.kind === 'arrow') return !!e.flying && e.thrower !== p && e.speed > ITEM.impactSpeed;
    return false;
}
function pogoStart(p) {
    if (p.pogoCd > 0) return;
    p.pogoT = POGO.win; p.pogoCd = POGO.cd; p.pogoHits = new Set(); sndPlay('swing', { x: p.cx, p: 0.8 });
}
function pogoBounce(p, level) { p.vy = POGO.v * gearJumpMul(p); p.fallT = 0; p.jumpHeld = false; p.pogoT = 0; level.spawnBurst(p.cx, p.y + p.h, 4, '#ffffff', 60); }
function pogoStep(p, level, dt) {
    if (p.pogoCd > 0) p.pogoCd -= dt;
    if (!(p.pogoT > 0)) return;
    p.pogoT -= dt;
    if (p.onGround) { p.pogoT = 0; return; }
    const b = { x: p.x - 2, y: p.y + p.h - 2, w: p.w + 4, h: POGO.h };
    for (const e of game.entities) {
        if (e === p || !e.alive || e.holder || p.pogoHits.has(e)) continue;
        const shot = pogoIsShot(p, e);
        if (!shot && !(e.creature || e.breakOnImpact || e.boss)) continue;
        if (!overlapBox(b, e)) continue;
        p.pogoHits.add(e);
        if (shot) {                                                                       // H4d: chém xuống trúng đạn => phá đạn + nảy
            e.alive = false; sndPlay('hit', { x: e.cx, p: 1.6 }); level.spawnBurst(e.cx, e.cy, 5, '#fff3b0', 90); pogoBounce(p, level); return;
        }
        if (e.hurt({ kind: DMG.WHIP, dmg: p.weapon === 'machete' ? WPN.macheteDmg : WHIP.dmg, x: p.cx, y: p.y + p.h, by: p }) || e.creature || e.boss) {
            sndPlay('hit', { x: e.cx }); pogoBounce(p, level); return;
        }
    }
    const c0 = Math.floor(b.x / TILE), c1 = Math.floor((b.x + b.w) / TILE), r = Math.floor((b.y + b.h) / TILE);
    for (let c = c0; c <= c1; c++) if (level.tile(c, r) === T_SPIKE) { sndPlay('spike', { x: p.cx, p: 1.5 }); pogoBounce(p, level); return; }
}
function pogoDraw(ctx, alpha) {
    const p = game.player; if (!p || !(p.pogoT > 0)) return;
    const x = Math.round(p.drawX(alpha)), y = Math.round(p.drawY(alpha)) + p.h;
    ctx.fillStyle = '#e8e0c8'; ctx.fillRect(x - 1, y, p.w + 2, 2); ctx.fillRect(x + 2, y + 2, p.w - 4, 3); ctx.fillStyle = '#ffffff'; ctx.fillRect(x + p.w / 2 - 1, y + 4, 2, 4);
}

// 13n_fire — DẦU + LỬA LAN (lần 18; ý từ bài phân tích SC: lửa là một phần của dây chuyền hỗn loạn).
//   Một số bình (khoảng 1/5, theo vị trí ô, từ level thứ 2) chứa DẦU: vỡ ra thì đổ vũng dầu trên sàn. Dầu bắt lửa từ: cầu lửa, ngọn lửa khác, quái/người đang cháy,
//   dung nham, vụ nổ. Dầu cháy thành LỬA (3.5s), lan sang vũng dầu kề bên (≤ 12 px) mỗi bước, đốt mọi sinh vật chạm vào (người: trạng thái cháy; quái: 1 máu / 0.5s
//   và tiếp tục cháy 2.4s, quái cháy đi qua dầu thì châm dầu). Nước dập lửa. Số liệu là ước lượng của mình.
const FIRE = { oilT: 3, life: 3.5, spread: 12, tick: 0.5, burnT: 2.4, burnTick: 0.9, oilChance: 5, slow: 0.5 };       // slow: đi bộ ×0.5 khi còn dính dầu (oilT > 0; tính ở statusSpeedMul, 10c_status)
const oilPot = (x, y) => game.levelIdx >= 1 && ((Math.floor(x / TILE) * 7 + Math.floor(y / TILE) * 13) % FIRE.oilChance === 0);

class Oil extends Thing {
    constructor(x, y) { super(x, y, 22, 3, { kind: 'oil', mass: 1, dmgFrom: [], triggersTraps: false, col: '#2a2418' }); }
    draw(ctx, alpha) {
        if (ITEM_HP) { drawOilHp(this, ctx, alpha); return; }

    panic: 1,            // 1 = quái đi bộ đang cháy bỏ AI, chạy tìm nước gần nhất (không có nước thì chạy bừa); 0 = tắt

const PROF_STORE = 'spGD4_profile_v1', PROF_VER = 1;

function profBlank() { return { v: PROF_VER, runs: 0, wins: 0, bestDepth: 0, bestGold: 0, bestTime: 0, kills: 0, rescued: 0, princessLost: 0, bought: 0, stolen: 0, goldTotal: 0, deaths: {}, top: [] }; }

    if (outcome === 'dead') { const c = game.deathCause || 'không rõ'; PROF.deaths[c] = (PROF.deaths[c] || 0) + 1; }
    // Điểm = tiền đang có lúc kết thúc (SC: money); giữ 5 điểm cao nhất
    game.newRecord = false; const sc = p ? p.gold : 0;

        PROF.top.push({ score: sc, depth: game.levelIdx + 1, win: outcome === 'win' }); PROF.top.sort((a, b) => b.score - a.score); PROF.top.length = Math.min(PROF.top.length, 5);

// Nguyên nhân chết hay gặp nhất: 'rơi vào gai ×3' hoặc ''
function profTopDeath() { let best = '', n = 0; for (const k in PROF.deaths) if (PROF.deaths[k] > n) { n = PROF.deaths[k]; best = k; } return best ? best + ' ×' + n : ''; }

// 15a_save — LƯU / MỞ LẠI VÁN (v0.36). Ý từ Metroidvania 15a_save (SAVE_VERSION / SAVE_MIGRATE / saveMigrate / saveSanitize / saveRead), viết lại cho ván Spelunky-like của Honzy.
//   Tự lưu (lần 27): đầu mỗi level (loadLevel) và khi ngồi ghế (13o_bench) ghi ván đang chơi vào localStorage; mở lại game thì chơi tiếp đúng level đó (seed + lần thử → level sinh lại y hệt). Chết thật (không easy) / thắng thì xoá.

const RUN_STORE = 'spelunky_run_v2';

const SAVE_MIGRATE = {};          // SAVE_MIGRATE[v] = d => d: nâng bản v lên v+1 (chưa cần: v2 là bản đầu còn đọc được)

// Nâng bản cũ lên bản hiện tại. Trả về {ok, data, why}: why = 'newer' | 'old' | 'corrupt'. `target` chỉ để test chạy thử chuỗi nâng cấp.
function saveMigrate(d, target) {

// Kiểm tra từng trường, loại giá trị lạ. Trả về bản sạch hoặc null nếu hỏng nặng (seed / level / máu không hợp lệ).

    };
}

// Đọc ô lưu: { state: 'none' | 'ok' | 'corrupt' | 'newer' | 'old' | 'stale' | 'nostore', data }
function saveRead() {
    let raw;
    try { try { localStorage.removeItem(RUN_STORE_V1); } catch (e) { } raw = localStorage.getItem(RUN_STORE); } catch (e) { return { state: 'nostore' }; }
    if (!raw) return { state: 'none' };

// Ghi. KHÔNG ghi đè bản lưu thuộc bản game mới hơn. Trả về true nếu ghi được.

}

// ---- Đo hiệu năng (debug: I, O) ----
const perf = { N: 120, i: 0, n: 0, dt: new Float32Array(120), steps: new Uint8Array(120), logic: new Float32Array(120), draw: new Float32Array(120) };
function perfPush(dt, steps, logicMs, drawMs) { const i = perf.i; perf.dt[i] = dt * 1000; perf.steps[i] = steps; perf.logic[i] = logicMs; perf.draw[i] = drawMs; perf.i = (i + 1) % perf.N; perf.n = Math.min(perf.n + 1, perf.N); }
function perfStats() {
    if (perf.n < 10) return null;
    let s = 0, mx = 0, st = 0, lg = 0, dr = 0, dm = 0;
    for (let i = 0; i < perf.n; i++) { s += perf.dt[i]; mx = Math.max(mx, perf.dt[i]); st += perf.steps[i]; lg += perf.logic[i]; dr += perf.draw[i]; dm = Math.max(dm, perf.draw[i]); }
    const n = perf.n; return { fps: 1000 / (s / n), dtAvg: s / n, dtMax: mx, stepsAvg: st / n, logicAvg: lg / n, drawAvg: dr / n, drawMax: dm };
}

function frameLoop(now) {
    requestAnimationFrame(frameLoop);
    let dt = (now - game.last) / 1000; game.last = now;
    if (!(dt > 0)) dt = 0;
    dt = Math.min(dt, MAX_FRAME_DT);
    game._fpsAcc += dt; game._fpsN++;
    if (game._fpsAcc >= 0.5) { game.fps = Math.round(game._fpsN / game._fpsAcc); game._fpsAcc = 0; game._fpsN = 0; }
    gpadPoll();
    let alpha, n = 0;
    const t0 = performance.now();
    if (game.title) { game.acc = 0; alpha = 1; }
    else if (!game.paused) {
        game.acc += dt * game.timeScale;
        while (game.acc >= STEP && n < 6) { stepGame(); game.acc -= STEP; n++; }
        if (n === 6) game.acc = 0;
        alpha = game.acc / STEP;
    } else {
        if (game.stepOnce) { stepGame(); game.stepOnce = false; n = 1; } else inp.endStep();
        alpha = 1;
    }
    const t1 = performance.now();
    musStep();
    renderFrame(alpha);
    if (dt > 0 && !game.paused) perfPush(dt, n, t1 - t0, performance.now() - t1);
}
// Phím bất kỳ (sau khi chết) => chơi lại
window.addEventListener('keydown', e => {
    if (game.title) { if (titleKey(e)) e.preventDefault(); return; }
    if (e.repeat) return;
    const over = (game.player && game.player.dead && game.deadShown) || (game.won && game.wonT > 0.8) || (game.trans && game.trans.t > 0.5);
    if (e.code === 'Escape' && !over) { titleOpen(); e.preventDefault(); return; }          // Esc khi đang chơi: mở menu
    if (!over) return;
    if (game.trans) { if (!/^(Key[HITPNGMLOBKJU]|Digit[09]|Tab|Escape)$/.test(e.code)) game.anyKey = true; return; }
    if (e.code === 'Escape') game.toTitle = true;
    else if (e.code === 'Enter' && !game.won) game.retrySame = true;
    else if (!/^(Key[HITPNGMLOBKJU]|Digit[09]|Tab)$/.test(e.code)) game.anyKey = true;
});

//   (v0.11) Còn lại: I thông tin · P tạm dừng · N 1 bước khi tạm dừng / sang level kế khi không tạm dừng · G bảng tinh chỉnh · K sao chép báo cáo hiệu năng · 0 phòng thử nghiệm · J xem toàn bộ level.
//   Đã BỎ: T (đổi tốc độ), M (bất tử), B (+bom/dây), U (bật năng lực), 9 (level kế; dùng N), O (đổi thành K). dbg.hitbox còn đó nhưng không có phím bật.

const dbg = { hitbox: false, info: false, overview: false, panel: null, toast: '', toastT: 0 };     // I = bật bảng thông tin (mặc định tắt: màn 320×240 nhỏ)
const DBG_SCALES = [1, 0.25, 0.5, 2, 4];

function dbgToast(msg) { dbg.toast = msg; dbg.toastT = 1.5; }

// Phím N (lần 42): nhảy sang level kế tiếp ngay (1-1 → 1-2 …; đang ở phòng boss → level đầu của vùng sau). Đang tạm dừng thì N vẫn là "1 bước".
function dbgSkipLevel() {
    if (game.screen && game.screen !== 'play') return;
    if (game.levelIdx + 1 >= RUN_LEVELS) { dbgToast('Đã ở màn cuối'); return; }
    game.trans = null; game.won = false; nextLevel(); dbgToast(game.level.name);
}
function dbgInit() {
    window.addEventListener('keydown', e => {
        if (e.repeat || game.title || (e.target && e.target.tagName === 'INPUT')) return;
        switch (e.code) {
            case 'KeyI': dbg.info = !dbg.info; break;
            case 'KeyP': game.paused = !game.paused; dbgToast(game.paused ? 'Tạm dừng (N = 1 bước; bỏ tạm dừng thì N = sang level kế)' : 'Tiếp tục'); break;
            case 'KeyN': if (game.paused) game.stepOnce = true; else dbgSkipLevel(); break;
            case 'KeyG': dbgTogglePanel(); break;
            case 'KeyK': dbgCopyPerf(); break;
            case 'Digit0': loadTestRoom(); dbgToast('Phòng thử nghiệm'); break;
            case 'KeyJ': dbg.overview = !dbg.overview; break;
        }
    });
}

function dbgTogglePanel() {
    const el = document.getElementById('tune');
    if (!el) return;
    if (!dbg.panel) {
        dbg.panel = el;
        let h = '<h4>Tuning (phím G: đóng)</h4><label><span>Luôn chạy nhanh (autoRun)</span><input type="checkbox" id="tune_autorun"' + (SETTINGS.autoRun ? ' checked' : '') + '></label><label><span>Hỗ trợ nhảy (Celeste: coyote/nhớ phím/góc)</span><input type="checkbox" id="tune_assist"' + (SETTINGS.assist ? ' checked' : '') + '></label>';
        TUNE_GROUPS.forEach((g, gi) => {
            h += `<h4 style="margin-top:10px">${g.name}</h4>`;
            for (const [k, min, max, step, label] of g.meta)
                h += `<label><span>${label}</span><b id="tv_${gi}_${k}">${+g.obj[k].toFixed(3)}</b></label><input type="range" data-g="${gi}" data-k="${k}" min="${min}" max="${max}" step="${step}" value="${g.obj[k]}">`;
        });
        h += '<button id="tune_reset">Mặc định</button><button id="tune_copy">Sao chép JSON</button>';
        el.innerHTML = h;
        el.addEventListener('input', e => {
            if (e.target.id === 'tune_assist') { SETTINGS.assist = e.target.checked; inp.save(); return; }
            if (e.target.id === 'tune_autorun') { SETTINGS.autoRun = e.target.checked; inp.save(); return; }
            const d = e.target.dataset; if (!d || d.k === undefined) return;
            TUNE_GROUPS[d.g].obj[d.k] = parseFloat(e.target.value); document.getElementById('tv_' + d.g + '_' + d.k).textContent = TUNE_GROUPS[d.g].obj[d.k];
        });
        el.addEventListener('change', e => { if (e.target.tagName === 'INPUT') e.target.blur(); canvas.focus(); });
        document.getElementById('tune_reset').onclick = () => {
            TUNE_GROUPS.forEach(g => Object.assign(g.obj, g.def));
            el.querySelectorAll('input[data-k]').forEach(i => { const g = TUNE_GROUPS[i.dataset.g]; i.value = g.obj[i.dataset.k]; document.getElementById('tv_' + i.dataset.g + '_' + i.dataset.k).textContent = +g.obj[i.dataset.k].toFixed(3); });

function dbgDrawWorld(ctx, alpha) {
    if (!dbg.hitbox) return;
    const L = game.level, p = game.player;
    for (const e of game.entities) {
        ctx.strokeStyle = e === p ? '#ff4d6d' : e.creature ? '#ffa53d' : e.carryable ? '#7dd3ff' : '#9a9ab0';
        ctx.strokeRect(Math.round(e.drawX(alpha)) + 0.5, Math.round(e.drawY(alpha)) + 0.5, e.w - 1, e.h - 1);
    }
    const wb = p.whipBox(); if (wb) { ctx.strokeStyle = wb.front ? '#7dff9a' : '#c8ff7d'; ctx.strokeRect(Math.round(wb.x) + 0.5, Math.round(wb.y) + 0.5, wb.w - 1, wb.h - 1); }
    for (const tr of L.traps) { if (tr.fired) continue; const s = trapSensor(tr); ctx.fillStyle = 'rgba(255,60,60,.35)'; ctx.fillRect(s.x, s.y, s.w, s.h); }
    ctx.fillStyle = 'rgba(255,255,0,.2)';
    const c0 = Math.floor(p.x / TILE) - 1, c1 = Math.floor((p.x + p.w) / TILE) + 1, r0 = Math.floor(p.y / TILE) - 1, r1 = Math.floor((p.y + p.h) / TILE) + 1;
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (L.isSolid(c, r)) ctx.fillRect(c * TILE, r * TILE, TILE, TILE);
}

        env: { dpr: window.devicePixelRatio, win: window.innerWidth + 'x' + window.innerHeight, scale: view.scale, ua: navigator.userAgent }
    };

// v0.34: nhật ký âm thanh 4 dòng (góc dưới trái): nhạc nền / môi trường / hero / quái-đồ vật-NPC. Dữ liệu từ sndLogView (04_audio.js): mỗi tiếng hiện ngay, giữ rồi mờ dần, hết 3s thì biến mất; tiếng mới nối sau tiếng cũ.
function dbgDrawSoundLog(ctx) {
    const rows = [['Nhạc nền', null, '#ffd36b'], ['Môi trường', 'env', '#9be0a5'], ['Hero', 'hero', '#cfe3ff'], ['Quái/vật', 'other', '#ff9aa8']];
    const y0 = VIEW_H - 4 - rows.length * 9;
    ctx.save();
    rows.forEach((r, i) => {
        const y = y0 + i * 9, head = r[0] + ': ';
        ctx.globalAlpha = 1; drawText(head, 4, y, '#8a93b0', 'left');
        let x = 4 + (ctx.measureText(head).width || head.length * 4);
        if (!r[1]) { drawText(sndLogMusicText(), x, y, r[2], 'left'); return; }
        sndLogView(r[1]).forEach((e, k) => {
            const t = (k ? ' > ' : '') + e.text;
            ctx.globalAlpha = e.alpha; drawText(t, x, y, r[2], 'left');
            x += ctx.measureText(t).width || t.length * 4;
        });
    });
    ctx.restore();
}

// Phím J: xem cả level thu nhỏ (40×32 ô + viền vừa khung 320×240) — để soi bố cục bộ sinh. Đường kẻ = ranh giới 16 phòng; số = loại phòng.
function dbgDrawOverview() {
    if (!dbg.overview) return;
    const L = game.level, k = Math.min(VIEW_W / L.pw, VIEW_H / L.ph), ox = (VIEW_W - L.pw * k) / 2, oy = (VIEW_H - L.ph * k) / 2;
    if (!dbg.ovCv || dbg.ovL !== L || dbg.ovV !== L.version) {
        dbg.ovCv = makeCanvas(L.pw, L.ph); const g = dbg.ovCv.getContext('2d');
        g.fillStyle = L.theme.back ? L.theme.back[3] : '#111'; g.fillRect(0, 0, L.pw, L.ph);
        paintTiles(g, L, 0, 0, L.w - 1, L.h - 1, 0, 0);
        dbg.ovL = L; dbg.ovV = L.version;
    }
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.drawImage(dbg.ovCv, ox, oy, L.pw * k, L.ph * k);
    ctx.save(); ctx.translate(ox, oy); ctx.scale(k, k);
    for (const e of game.entities) e.draw(ctx, 1);
    if (L.exit) drawDoor(L.exit.c * TILE, L.exit.r * TILE, true);
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1 / k;
    for (let i = 0; i <= LVL.roomsX; i++) { ctx.beginPath(); ctx.moveTo(TILE + i * LVL.roomW * TILE, TILE); ctx.lineTo(TILE + i * LVL.roomW * TILE, TILE + LVL.roomsY * LVL.roomH * TILE); ctx.stroke(); }
    for (let i = 0; i <= LVL.roomsY; i++) { ctx.beginPath(); ctx.moveTo(TILE, TILE + i * LVL.roomH * TILE); ctx.lineTo(TILE + LVL.roomsX * LVL.roomW * TILE, TILE + i * LVL.roomH * TILE); ctx.stroke(); }
    ctx.restore();
    const m = game.genMeta;
    if (m && m.path) for (let y = 0; y < LVL.roomsY; y++) for (let x = 0; x < LVL.roomsX; x++) {          // H1: theo LVL (5×5), không gõ cứng 4
        const t = m.path.type[x][y], onPath = t !== 0;
        drawText(String(t), ox + (TILE + x * LVL.roomW * TILE + 4) * k, oy + (TILE + y * LVL.roomH * TILE + 2) * k, onPath ? '#ff8a6a' : '#9aa0b0');
    }
    drawText('J: đóng bản đồ · ' + L.name + ' · seed ' + game.seed, VIEW_W / 2, VIEW_H - 10, '#ffe9a8', 'center');
}

// 18_boot — khởi động (file cuối cùng; dòng cuối gọi boot())
function boot() {
    canvas.width = VIEW_W * RES; canvas.height = VIEW_H * RES; ctx.imageSmoothingEnabled = false;
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    const sr = saveRead(); if (sr.state === 'ok') resumeRun(sr.data); else {
        newRun();
        const why = { newer: 'Bản lưu thuộc phiên bản game MỚI HƠN — giữ nguyên, ván mới này sẽ không ghi đè', corrupt: 'Bản lưu bị hỏng — bắt đầu ván mới', stale: 'Bản lưu cũ (bộ sinh level đã đổi) — bắt đầu ván mới', old: 'Bản lưu quá cũ — bắt đầu ván mới' }[sr.state];
        if (why) game.banner = { text: why, t: 0 };
    }
    dbgInit();
    window.__game = { game, PHYS, WHIP, ITEM, TRAP, inp, cam, dbg };          // để thử trong console (F12)
    game.last = performance.now();
    canvas.focus();
    requestAnimationFrame(frameLoop);
}
boot();
